<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>⚡ RAILGUN · v2.0</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05070a; font-family: 'Segoe UI', system-ui, monospace;
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, #101620 0%, #05070a 70%);
    position: fixed; inset: 0;
  }

  #lockScreen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #0c1420 0%, #030507 80%);
    transition: opacity 0.4s ease, visibility 0.4s ease;
    padding: 1rem;
  }
  #lockScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .lock-box {
    background: linear-gradient(160deg, #121a28, #080b11);
    border: 1px solid #2a4a7a; border-radius: 20px;
    padding: 2rem 1.5rem; width: 100%; max-width: 380px;
    text-align: center;
    box-shadow: 0 0 60px rgba(40,120,255,0.25), 0 30px 60px black;
  }
  .lock-icon { font-size: 3.5rem; margin-bottom: 1rem; filter: drop-shadow(0 0 20px #4f9eff); }
  .lock-title { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 3px; color: #aad0ff; margin-bottom: 0.4rem; }
  .lock-subtitle { font-size: 0.85rem; color: #5f7a9e; margin-bottom: 1.5rem; }
  .lock-input {
    width: 100%; background: #0a0e14; border: 2px solid #2a4a7a;
    border-radius: 12px; padding: 0.8rem 1rem; color: #c8deff;
    font-size: 1.1rem; font-family: inherit; text-align: center;
    letter-spacing: 3px; outline: none; margin-bottom: 1rem;
    -webkit-appearance: none;
  }
  .lock-input:focus { border-color: #5f9eff; box-shadow: 0 0 20px rgba(80,160,255,0.4); }
  .lock-btn {
    width: 100%; background: linear-gradient(180deg, #2e5a8a, #1a3350);
    border: 1px solid #7df9ff; color: #fff; font-weight: bold;
    font-size: 1rem; padding: 0.9rem; border-radius: 12px;
    cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
    -webkit-appearance: none;
  }
  .lock-btn:active { transform: scale(0.97); }
  .lock-error-msg { color: #ff6666; font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.2rem; font-weight: 600; }

  #gameContainer { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
  #gameContainer.visible { display: flex; }

  .game-wrapper {
    position: relative; width: 100vw; max-width: 1600px;
    height: 100vh; max-height: 1000px;
    background: linear-gradient(145deg, #0f131b 0%, #080b10 100%);
    border-radius: 0; padding: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.95), 0 0 0 1px rgba(100,160,255,0.12);
    display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 800px) {
    .game-wrapper { border-radius: 18px; padding: 10px; width: 98vw; height: 96vh; }
  }

  .canvas-container {
    position: relative; flex: 1; border-radius: 10px; overflow: hidden; background: #06090e;
    box-shadow: inset 0 0 80px rgba(0,20,40,0.9), inset 0 0 0 1px rgba(80,140,255,0.15);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; border-radius: 10px; touch-action: none; }

  .stats-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding: 0 2px; gap: 3px; flex-wrap: wrap;
    color: #c8deff; font-weight: 600; font-size: 0.72rem;
  }
  .hud-item {
    display: flex; align-items: center; gap: 3px;
    background: linear-gradient(180deg, #141c28, #0b1118);
    border: 1px solid #2a3f5c; padding: 2px 6px; border-radius: 5px;
    min-height: 28px;
  }
  .level-badge { color: #ffd966; border-color: #5a4a1f; }
  .level-badge span { color: #fff3c4; font-size: 0.85rem; }
  .gem-badge { color: #c77dff; border-color: #5a2e8a; }
  .gem-badge span { color: #e8c8ff; font-size: 0.85rem; }
  .mode-badge { color: #ff9a5c; border-color: #8a4a1a; display: none; }
  @media (min-width: 500px) { .mode-badge { display: flex; } }
  .hp-container { display: flex; align-items: center; gap: 3px; }
  .hp-fill { width: 70px; height: 10px; background: #0a0e14; border-radius: 3px; overflow: hidden; border: 1px solid #3a1f28; }
  @media (min-width: 500px) { .hp-fill { width: 90px; height: 12px; } }
  .hp-fill span { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff1f4b, #ff8a5c); border-radius: 2px; transition: width 0.12s ease; }

  button { font-family: inherit; cursor: pointer; transition: all 0.15s ease; border: none; outline: none; -webkit-appearance: none; }
  .sound-toggle, .restart-btn, .admin-toggle, .shop-btn, .tanks-btn, .modes-btn {
    font-weight: bold; padding: 4px 6px; border-radius: 5px; font-size: 0.7rem; border: 1px solid;
    min-width: 30px; min-height: 30px; display: flex; align-items: center; justify-content: center;
  }
  .sound-toggle { background: #1a2432; border-color: #2e4a7a; color: #b8d4ff; }
  .admin-toggle { background: #2e1616; border-color: #8a2e2e; color: #ffb8b8; }
  .admin-toggle.locked { opacity: 0.6; }
  .restart-btn { background: #14202e; border-color: #2e5a8a; color: #b8d4ff; }
  .shop-btn { background: #2a1a3e; border-color: #7a2e8a; color: #e0b8ff; }
  .tanks-btn { background: #1a2e1a; border-color: #2e7a2e; color: #b8ffb8; }
  .modes-btn { background: #2e2a1a; border-color: #7a6e2e; color: #ffffb8; }
  button:active { transform: scale(0.92); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2,4,8,0.92); backdrop-filter: blur(6px);
    display: none; justify-content: center; align-items: center; z-index: 15; padding: 0.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #121a28, #080b11);
    border-radius: 14px; border: 1px solid #2a4a7a;
    box-shadow: 0 0 60px rgba(40,120,255,0.25), 0 30px 60px black;
    max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto;
    padding: 1rem; color: #c8deff;
    -webkit-overflow-scrolling: touch;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid #2a4a7a;
  }
  .modal-title { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: #aad0ff; }
  .close-btn {
    background: #2a1a1a; border: 1px solid #8a2e2e; color: #ffb8b8;
    width: 32px; height: 32px; border-radius: 50%; font-size: 0.95rem; font-weight: bold;
    min-width: 32px;
  }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.6rem; }
  .chest-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 10px; border: 2px solid #3a5a8a; padding: 0.8rem 0.4rem;
    text-align: center; cursor: pointer;
  }
  .chest-card:active { transform: scale(0.97); }
  .chest-card .chest-icon { font-size: 2rem; margin-bottom: 0.3rem; }
  .chest-card .chest-name { font-size: 0.8rem; font-weight: 700; color: #fff; margin-bottom: 0.3rem; }
  .chest-card .chest-desc { font-size: 0.65rem; color: #97b9e0; margin-bottom: 0.4rem; line-height: 1.3; }
  .chest-card .chest-price { display: inline-block; background: #5a2e8a; color: #e8c8ff; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: bold; font-size: 0.75rem; border: 1px solid #7a4aae; }
  .chest-card.locked { opacity: 0.5; }

  .tanks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.5rem; }
  .tank-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 8px; border: 2px solid #3a5a8a; padding: 0.6rem 0.3rem;
    text-align: center; cursor: pointer; position: relative;
  }
  .tank-card:active { transform: scale(0.96); }
  .tank-card.active { border-color: #7df9ff; box-shadow: 0 0 20px #3e7eff; }
  .tank-card.locked { opacity: 0.5; }
  .tank-card .tank-icon { font-size: 1.6rem; margin-bottom: 0.2rem; }
  .tank-card .tank-name { font-size: 0.7rem; font-weight: 700; color: #fff; }
  .tank-card .tank-rarity { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  .tank-card .tank-level { font-size: 0.55rem; color: #97b9e0; margin-top: 2px; }
  .rarity-comun { color: #8a9ab0; } .rarity-raro { color: #5f9eff; }
  .rarity-epico { color: #c77dff; } .rarity-legendario { color: #ffd966; }
  .rarity-secreto { color: #ff5c8a; } .rarity-exotico { color: #4dffb8; }
  .rarity-mitico { color: #ff4dff; }
  .tank-card .tank-lock { position: absolute; top: 3px; right: 3px; font-size: 0.7rem; }

  .modes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
  .mode-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 10px; border: 2px solid #3a5a8a; padding: 0.9rem 0.6rem;
    text-align: center; cursor: pointer;
  }
  .mode-card:active { transform: scale(0.97); }
  .mode-card.active { border-color: #7df9ff; box-shadow: 0 0 20px #3e7eff; }
  .mode-card .mode-icon { font-size: 2rem; margin-bottom: 0.3rem; }
  .mode-card .mode-name { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 0.2rem; }
  .mode-card .mode-desc { font-size: 0.7rem; color: #97b9e0; line-height: 1.3; }

  .admin-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 320px; max-width: 92vw;
    background: linear-gradient(160deg, #0f131c, #080b11);
    border: 1px solid #8a2e2e; border-radius: 14px; padding: 0.9rem; z-index: 20;
    color: #ffd8d8; display: none; font-size: 0.75rem; max-height: 88vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .admin-panel.open { display: block; }
  .admin-panel h3 { margin: 0 0 0.6rem 0; color: #ff6b6b; font-size: 0.9rem; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 0.3rem; margin-bottom: 0.35rem; }
  .admin-row label { flex: 1; color: #ffb8b8; font-size: 0.7rem; }
  .admin-row input[type="number"] { width: 60px; background: #1a1f2b; border: 1px solid #8a2e2e; color: #fff; padding: 0.15rem 0.25rem; border-radius: 4px; font-size: 0.7rem; }
  .admin-btn { background: #2a1a1a; border: 1px solid #8a2e2e; color: #ffb8b8; padding: 0.3rem 0.5rem; border-radius: 5px; font-weight: bold; font-size: 0.7rem; width: 100%; margin-top: 0.25rem; }
  .admin-btn.good { background: #0f2a1a; border-color: #2e8a5a; color: #b8ffd8; }
  .admin-btn.danger { background: #4a1010; border-color: #ff2e2e; }
  .admin-section { border-top: 1px solid #3a1b1b; margin-top: 0.6rem; padding-top: 0.6rem; }
  .admin-section-title { color: #ff8a8a; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.3rem; font-weight: bold; }
  .weapon-btn { background: #14202e; border: 1px solid #2e4a7a; color: #b8d4ff; padding: 0.25rem 0.4rem; border-radius: 5px; font-size: 0.68rem; margin: 0 0.15rem 0.25rem 0; font-weight: 600; }
  .weapon-btn.active { background: #2e5a8a; border-color: #7df9ff; color: #fff; }

  .cards-overlay {
    position: fixed; inset: 0; background: rgba(2,4,8,0.9); backdrop-filter: blur(6px);
    display: flex; justify-content: center; align-items: center;
    visibility: hidden; opacity: 0; transition: opacity 0.25s ease;
    pointer-events: none; z-index: 10; padding: 0.5rem;
  }
  .cards-overlay.active { visibility: visible; opacity: 1; pointer-events: auto; }
  .cards-container { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; max-width: 700px; }
  .card {
    width: 120px; height: 180px;
    background: linear-gradient(160deg, #1c273a, #0d141f);
    border-radius: 10px; border: 1px solid #3a5a8a;
    display: flex; flex-direction: column; align-items: center;
    padding: 0.7rem 0.5rem; color: #c6e2ff; text-align: center;
    cursor: pointer; font-weight: 600;
  }
  .card:active { transform: scale(0.97); }
  .card .icon { font-size: 2rem; margin-bottom: 0.3rem; }
  .card .title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: #aad0ff; margin-bottom: 0.4rem; border-bottom: 1px solid #2e5a8a; padding-bottom: 0.3rem; width: 100%; }
  .card .desc { font-size: 0.68rem; color: #97b9e0; line-height: 1.3; font-weight: 400; }
  @media (min-width: 500px) {
    .card { width: 150px; height: 220px; padding: 1rem 0.7rem; }
    .card .icon { font-size: 2.4rem; }
    .card .title { font-size: 0.9rem; }
    .card .desc { font-size: 0.75rem; }
  }

  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #1a2e4a; border: 1px solid #5f9eff; border-radius: 8px; padding: 0.4rem 1rem;
    color: #c8deff; font-weight: bold; box-shadow: 0 0 20px rgba(80,160,255,0.5);
    z-index: 30; opacity: 0; transition: all 0.3s ease; pointer-events: none; font-size: 0.78rem;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .chest-opening { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; text-align: center; }
  .chest-opening .big-icon { font-size: 4rem; animation: chestShake 0.6s ease-in-out infinite; }
  @keyframes chestShake { 0%, 100% { transform: rotate(-5deg) scale(1); } 50% { transform: rotate(5deg) scale(1.05); } }
  .reward-display { font-size: 1rem; font-weight: bold; color: #ffd966; margin-top: 0.6rem; }
  .reward-sub { font-size: 0.75rem; color: #97b9e0; margin-top: 0.3rem; }

  /* ===== CONTROLES TÁCTILES ===== */
  .joystick-zone {
    position: absolute; bottom: 15px; left: 15px;
    width: 110px; height: 110px;
    background: rgba(30, 60, 100, 0.3);
    border: 2px solid rgba(100, 180, 255, 0.4);
    border-radius: 50%; display: none; z-index: 5; touch-action: none;
  }
  .joystick-zone.active { display: block; }
  .joystick-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 46px; height: 46px;
    background: radial-gradient(circle, #4df0ff, #1a6aaa);
    border-radius: 50%; border: 2px solid rgba(200, 240, 255, 0.6);
    box-shadow: 0 0 20px #4df0ff; pointer-events: none;
  }
  .fire-zone {
    position: absolute; bottom: 25px; right: 20px;
    width: 80px; height: 80px;
    background: rgba(255, 80, 80, 0.3);
    border: 2px solid rgba(255, 120, 120, 0.6);
    border-radius: 50%; display: none; z-index: 5; touch-action: none;
    justify-content: center; align-items: center;
    color: #ffcccc; font-weight: bold; font-size: 0.75rem;
  }
  .fire-zone.active { display: flex; }
  .fire-zone:active { background: rgba(255, 80, 80, 0.6); }

  .minimap {
    position: absolute; top: 8px; right: 8px;
    width: 100px; height: 100px;
    background: rgba(5, 10, 18, 0.7);
    border: 1px solid rgba(80, 140, 255, 0.3);
    border-radius: 6px; z-index: 4; pointer-events: none;
  }
  @media (min-width: 800px) {
    .minimap { width: 130px; height: 130px; }
  }

  /* Fullscreen button */
  .fullscreen-btn {
    position: absolute; top: 8px; left: 8px;
    background: rgba(20, 30, 50, 0.8);
    border: 1px solid rgba(100, 160, 255, 0.4);
    color: #b8d4ff; width: 36px; height: 36px;
    border-radius: 6px; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Acceso Restringido</div>
    <div class="lock-subtitle">Introduce la contraseña para jugar</div>
    <input type="password" id="passwordInput" class="lock-input" placeholder="••••••••" autocomplete="off" maxlength="32" inputmode="text">
    <button id="unlockBtn" class="lock-btn">Desbloquear</button>
    <div id="lockError" class="lock-error-msg"></div>
  </div>
</div>

<div id="gameContainer">
  <div class="game-wrapper" id="gameWrapper">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas"></canvas>
      <canvas id="minimap" class="minimap" width="130" height="130"></canvas>
      <button class="fullscreen-btn" id="fullscreenBtn" title="Pantalla completa">⛶</button>
      <div class="joystick-zone" id="joystickZone">
        <div class="joystick-knob" id="joystickKnob"></div>
      </div>
      <div class="fire-zone" id="fireZone">FUEGO</div>
    </div>
    <div class="stats-bar">
      <div class="hud-item level-badge">⭐ <span id="levelDisplay">1</span></div>
      <div class="hud-item gem-badge">💎 <span id="gemDisplay">0</span></div>
      <div class="hud-item mode-badge">🎮 <span id="modeDisplay">Supervivencia</span></div>
      <div class="hud-item hp-container">
        <span>❤️</span>
        <div class="hp-fill"><span id="hpFill" style="width:100%"></span></div>
      </div>
      <div class="hud-item" style="padding:2px 4px;gap:2px;">
        <button class="modes-btn" id="modesBtn" title="Modos">🎮</button>
        <button class="tanks-btn" id="tanksBtn" title="Tanques">🚀</button>
        <button class="shop-btn" id="shopBtn" title="Tienda">🛒</button>
        <button class="sound-toggle" id="soundToggle" title="Sonido">🔊</button>
        <button class="admin-toggle locked" id="adminToggle" title="Admin">🔨</button>
        <button class="restart-btn" id="restartBtn" title="Reiniciar">⟳</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="shopModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🛒 Tienda</div>
      <button class="close-btn" data-close="shopModal">✕</button>
    </div>
    <div style="text-align:center;margin-bottom:0.6rem;font-size:0.9rem;">
      Gemas: <span style="color:#e8c8ff;font-weight:bold;">💎 <span id="shopGemCount">0</span></span>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="tanksModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🚀 Tanques</div>
      <button class="close-btn" data-close="tanksModal">✕</button>
    </div>
    <div style="text-align:center;margin-bottom:0.5rem;font-size:0.75rem;color:#97b9e0;">
      Se desbloquean cada 5 niveles (nivel: <span id="tankLevelReq" style="color:#7df9ff;font-weight:bold;">5</span>)
    </div>
    <div class="tanks-grid" id="tanksGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="modesModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🎮 Modos</div>
      <button class="close-btn" data-close="modesModal">✕</button>
    </div>
    <div class="modes-grid" id="modesGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="chestModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title">🎁 Cofre</div>
      <button class="close-btn" data-close="chestModal">✕</button>
    </div>
    <div class="chest-opening" id="chestOpening"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid #8a2e2e;">
    <h3 style="margin:0;">🔨 Admin</h3>
    <button id="adminClose" style="background:#2a1a1a;border:1px solid #8a2e2e;color:#ffb8b8;width:24px;height:24px;border-radius:50%;font-size:0.85rem;font-weight:bold;">✕</button>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Armas</div>
    <div id="adminWeaponList" style="display:flex;flex-wrap:wrap;"></div>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Estadísticas</div>

  let currentMode = 'survival';

  // ==================== COFRES ====================
  const CHESTS = [
    { id: 'comun', name: 'Común', icon: '📦', price: 50, desc: 'Recompensas básicas',
      drops: [
        { type: 'gems', amount: 10, weight: 50 }, { type: 'gems', amount: 25, weight: 30 },

        { type: 'gems', amount: 50, weight: 40 }, { type: 'gems', amount: 100, weight: 20 },

  const WEAPONS = {

    pistol:  { name: 'Pistola', icon: '🔫', chargeTime: 4,  cooldownMax: 4,  rayDamage: 8,  rayRange: 380, rayWidth: 5,  pierce: 1, multishot: 1, spread: 0.03, color: '#ffe066' },
    shotgun: { name: 'Escopeta', icon: '💥', chargeTime: 10, cooldownMax: 22, rayDamage: 6,  rayRange: 260, rayWidth: 4,  pierce: 1, multishot: 5, spread: 0.28, color: '#ff9a5c' },
    sniper:  { name: 'Francotirador', icon: '🎯', chargeTime: 30, cooldownMax: 35, rayDamage: 40, rayRange: 900, rayWidth: 7, pierce: 6, multishot: 1, spread: 0, color: '#ff5c8a' }

  let currentWeaponKey = 'railgun';

  // ==================== AUDIO ====================
  let audioCtx = null, soundEnabled = true, masterGain = null;
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.85;
        masterGain.connect(audioCtx.destination);
      } catch (e) { soundEnabled = false; return; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  window.addEventListener('mousedown', initAudio, { passive: true });
  window.addEventListener('touchstart', initAudio, { passive: true });
  window.addEventListener('keydown', initAudio, { passive: true });

  function playTone(freq, duration, type, volume, slideTo) {
    if (!soundEnabled || !audioCtx || !masterGain) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
      gain.gain.setValueAtTime(volume || 0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + duration + 0.02);
    } catch (e) {}
  }
  function playChargeSound() { playTone(80, 0.25, 'sawtooth', 0.12, 400); }
  function playRailSound() { playTone(120, 0.35, 'sine', 0.5, 35); playTone(800, 0.3, 'sawtooth', 0.25, 60); }

  // ==================== ESTADO ====================

  // ==================== PAREDES ====================
  function generateWalls() {
    walls = [];
    const isMaze = currentMode === 'maze';
    const wallCount = isMaze ? 25 : 12;
    for (let i = 0; i < wallCount; i++) {
      let w, h, x, y, attempts = 0;
      do {
        w = 60 + Math.random() * 120;
        h = 30 + Math.random() * 90;
        x = 100 + Math.random() * (MAP_W - 200 - w);
        y = 100 + Math.random() * (MAP_H - 200 - h);
        attempts++;
      } while (attempts < 15 && overlapsPlayerArea(x, y, w, h));
      if (!overlapsPlayerArea(x, y, w, h)) {
        walls.push({ x, y, w, h });
      }
    }
    if (isMaze) {
      const cellSize = 250;
      for (let gx = cellSize; gx < MAP_W - cellSize; gx += cellSize) {
        for (let gy = cellSize; gy < MAP_H - cellSize; gy += cellSize) {
          if (Math.random() < 0.6) {
            const orient = Math.random() < 0.5;
            if (orient) walls.push({ x: gx, y: gy, w: 180, h: 20 });
            else walls.push({ x: gx, y: gy, w: 20, h: 180 });
          }
        }
      }
    }
  }

  function overlapsPlayerArea(x, y, w, h) {
    const px = MAP_W / 2, py = MAP_H / 2;
    return !(x > px + 120 || x + w < px - 120 || y > py + 120 || y + h < py - 120);
  }

  function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX, dy = cy - closestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function resolveWallCollision(entity) {
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      if (rectCircleCollide(w.x, w.y, w.w, w.h, entity.x, entity.y, entity.radius)) {
        const closestX = Math.max(w.x, Math.min(entity.x, w.x + w.w));
        const closestY = Math.max(w.y, Math.min(entity.y, w.y + w.h));
        const dx = entity.x - closestX, dy = entity.y - closestY;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const overlap = entity.radius - dist;
          entity.x += (dx / dist) * overlap;
          entity.y += (dy / dist) * overlap;
        }
      }
    }
  }

    mouseY = (e.clientY - rect.top) * (H / rect.height);
  }, { passive: true });
  canvas.addEventListener('mousedown', function() { mouseDown = true; initAudio(); });

  if (isMobile) {
    let joystickActive = false, joystickStartX = 0, joystickStartY = 0;
    const maxDist = 32;
    joystickZone.addEventListener('touchstart', function(e) {
      e.preventDefault(); joystickActive = true;
      const touch = e.touches[0];
      const rect = joystickZone.getBoundingClientRect();
      joystickStartX = rect.left + rect.width / 2;
      joystickStartY = rect.top + rect.height / 2;
      updateJoystick(touch.clientX, touch.clientY);
    }, { passive: false });
    joystickZone.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!joystickActive) return;
      updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    joystickZone.addEventListener('touchend', function(e) {
      e.preventDefault(); joystickActive = false;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
      keys.w = keys.a = keys.s = keys.d = false;
    }, { passive: false });
    joystickZone.addEventListener('touchcancel', function() {
      joystickActive = false;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
      keys.w = keys.a = keys.s = keys.d = false;
    }, { passive: false });
    function updateJoystick(clientX, clientY) {
      let dx = clientX - joystickStartX, dy = clientY - joystickStartY;
      const dist = Math.hypot(dx, dy);
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
      joystickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      const dz = 10;
      keys.a = dx < -dz; keys.d = dx > dz;
      keys.w = dy < -dz; keys.s = dy > dz;
    }
    fireZone.addEventListener('touchstart', function(e) { e.preventDefault(); mouseDown = true; initAudio(); }, { passive: false });
    fireZone.addEventListener('touchend', function(e) { e.preventDefault(); mouseDown = false; }, { passive: false });
    fireZone.addEventListener('touchcancel', function() { mouseDown = false; }, { passive: false });
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      mouseX = (touch.clientX - rect.left) * (W / rect.width);
      mouseY = (touch.clientY - rect.top) * (H / rect.height);
    }, { passive: false });
    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      mouseX = (touch.clientX - rect.left) * (W / rect.width);
      mouseY = (touch.clientY - rect.top) * (H / rect.height);

  // ==================== CARTAS ====================
  function showUpgradeCards() {

    const all = [
      { icon: '🔥', title: 'DAÑO +', desc: '+8 daño', apply: function() { player.rayDamage += 8; } },
      { icon: '⚡', title: 'CARGA RÁPIDA', desc: '-4 frames', apply: function() { player.chargeTime = Math.max(4, player.chargeTime - 4); } },
      { icon: '💥', title: 'MULTIDISPARO', desc: '+1 proyectil', apply: function() { player.multishot += 1; player.spread += 0.04; } },
      { icon: '🛡️', title: 'VIDA +', desc: 'Cura 30', apply: function() { player.maxHp += 15; player.hp = Math.min(player.hp + 30, player.maxHp); } },
      { icon: '🎯', title: 'PERFORACIÓN', desc: '+1 enemigo', apply: function() { player.pierce += 1; } },
      { icon: '🌀', title: 'ALCANCE +', desc: '+100', apply: function() { player.rayRange += 100; } },

      card.addEventListener('click', function() {

  function requestLevelUp() {
    if (levelUpPending || !gameActive) return;
    levelUpPending = true; gameActive = false;
    playLevelUpSound();
    const oldLevel = level;
    level++;
    if (level > bestLevel) bestLevel = level;
    xp = 0; xpToNext = Math.floor(5 + level * 2.5);
    const gemReward = 5 + level * 2;
    gems += gemReward;
    showToast('⭐ Nivel ' + level + ' · +' + gemReward + ' gemas');
    if (Math.floor(level / 5) > Math.floor(oldLevel / 5)) {
      const unlockedTanks = [];
      Object.keys(TANKS).forEach(function(key) {
        const t = TANKS[key];
        if (t.levelReq > 0 && t.levelReq <= level && !ownedTanks[key]) {
          ownedTanks[key] = true;
          unlockedTanks.push(t.name);
        }
      });
      if (unlockedTanks.length > 0) {
        showToast('🎁 ¡' + unlockedTanks.join(', ') + ' desbloqueado(s)!');
      }
    }
    updateUI(); saveGame();
    requestAnimationFrame(function() { showUpgradeCards(); });
  }

  // ==================== ENEMIGOS ====================
  function spawnEnemy() {
    const mode = MODES[currentMode];
    if (enemies.length >= mode.maxEnemies) return;
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 50;
    if (side === 0) { x = Math.random() * MAP_W; y = -margin; }
    else if (side === 1) { x = MAP_W + margin; y = Math.random() * MAP_H; }
    else if (side === 2) { x = Math.random() * MAP_W; y = MAP_H + margin; }
    else { x = -margin; y = Math.random() * MAP_H; }
    const baseHp = (15 + level * 4) * mode.enemyHp;
    enemies.push({
      x: x, y: y, radius: 14 + Math.random() * 6,
      hp: baseHp, maxHp: baseHp,
      speed: (1.2 + Math.random() * 0.8 + level * 0.15) * mode.enemySpeed,
      color: 'hsl(' + (Math.random() * 20 + 340) + ', 80%, 60%)',
      wobble: Math.random() * Math.PI * 2, angle: 0,
      frozen: 0, isBoss: false
    });
  }

  function spawnBoss() {
    const bossHp = 500 + level * 50;
    enemies.push({
      x: MAP_W / 2, y: -100, radius: 45,
      hp: bossHp, maxHp: bossHp, speed: 1.5,
      color: '#ff3344', wobble: 0, angle: 0,
      frozen: 0, isBoss: true
    });
    showToast('👹 ¡JEFE APARECIDO!');
    bossSpawned = true;
  }

  function addHitParticles(x, y, color, count) {
    count = count || 6;
    if (particles.length > 250) return;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x, y: y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
        life: 1.0, color: color || '#ffaa66', size: 2.5 + Math.random() * 4
      });
    }
  }

  // ==================== DISPARO ====================
  function pointSegmentDistance(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = 0;
    if (lenSq > 0) { t = ((px - x1) * dx + (py - y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); }
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function getRayEndWithWalls(x1, y1, angle, maxRange) {
    let endX = x1 + Math.cos(angle) * maxRange;
    let endY = y1 + Math.sin(angle) * maxRange;
    let minT = 1;
    for (let i = 0; i < walls.length; i++) {
      const wall = walls[i];
      for (let step = 0; step <= 30; step++) {
        const t = step / 30;
        const px = x1 + (endX - x1) * t;
        const py = y1 + (endY - y1) * t;
        if (px > wall.x && px < wall.x + wall.w && py > wall.y && py < wall.y + wall.h) {
          if (t < minT) minT = t;
          break;
        }
      }
    }
    return { x: x1 + (endX - x1) * minT, y: y1 + (endY - y1) * minT };
  }

  function fireWeapon() {
    if (!gameActive) return;
    playWeaponSound(player.weaponKey);
    player.recoil = 6; player.flash = 6;
    const baseAngle = Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
    const hitEnemies = []; const rays = [];
    const wColor = WEAPONS[player.weaponKey].color;
    for (let s = 0; s < player.multishot; s++) {
      let offset = 0;
      if (player.multishot > 1) {
        const totalSpread = player.spread * (player.multishot - 1);
        offset = -totalSpread / 2 + (s * player.spread);
      }
      rays.push(baseAngle + offset);
    }
    rayEffect = { active: true, timer: rayEffect.duration, duration: rayEffect.duration, rays: rays, color: wColor };
    for (let s = 0; s < player.multishot; s++) {
      let offset = 0;
      if (player.multishot > 1) {
        const totalSpread = player.spread * (player.multishot - 1);
        offset = -totalSpread / 2 + (s * player.spread);
      }
      const angle = baseAngle + offset;
      const rayEnd = getRayEndWithWalls(player.x, player.y, angle, player.rayRange);
      const endX = rayEnd.x, endY = rayEnd.y;
      let pierceLeft = player.pierce;
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (pointSegmentDistance(e.x, e.y, player.x, player.y, endX, endY) < e.radius + player.rayWidth / 2) {
          candidates.push({ enemy: e, d: Math.hypot(e.x - player.x, e.y - player.y) });
        }
      }
      candidates.sort(function(a, b) { return a.d - b.d; });
      for (let c = 0; c < candidates.length; c++) {
        if (pierceLeft <= 0) break;
        const e = candidates[c].enemy;
        if (hitEnemies.indexOf(e) !== -1) continue;
        hitEnemies.push(e);
        e.hp -= player.rayDamage;
        addHitParticles(e.x, e.y, wColor, 5);
        playHitSound();
        if (e.hp <= 0) {
          const idx = enemies.indexOf(e);
          if (idx !== -1) enemies.splice(idx, 1);
          xp++; totalKills++;
          if (Math.random() < 0.15) gems += 1;
          addHitParticles(e.x, e.y, '#ffaa66', 10);
          playEnemyDieSound();
          if (e.isBoss) {
            showToast('👹 ¡JEFE DERROTADO! +500 gemas');
            gems += 500; saveGame();
          }
          if (xp >= xpToNext && !levelUpPending) { requestLevelUp(); return; }
        }
        pierceLeft--;
      }
    }
  }

  // ==================== UPDATE ====================
  function update() {
    if (!gameActive || !player) return;
    let dx = 0, dy = 0;
    if (keys.w) dy -= 1; if (keys.s) dy += 1;
    if (keys.a) dx -= 1; if (keys.d) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      player.x += dx * player.speed; player.y += dy * player.speed;
    }
    resolveWallCollision(player);
    player.x = Math.max(player.radius, Math.min(MAP_W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(MAP_H - player.radius, player.y));
    camera.x = Math.max(0, Math.min(MAP_W - W, player.x - W / 2));
    camera.y = Math.max(0, Math.min(MAP_H - H, player.y - H / 2));

    const targetAngle = Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
    let diff = targetAngle - player.aimAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.aimAngle += diff * 0.25;
    if (player.recoil > 0) player.recoil *= 0.85;
    if (player.flash > 0) player.flash--;

    if (player.regenPerSecond > 0 && player.hp < player.maxHp) {
      regenAccumulator++;
      if (regenAccumulator >= REGEN_INTERVAL) {
        regenAccumulator = 0;
        player.hp = Math.min(player.maxHp, player.hp + player.regenPerSecond);
        updateUI();
      }
    } else regenAccumulator = 0;

    if (player.cooldownTimer > 0) {
      player.cooldownTimer--; player.isCharging = false; player.chargeTimer = 0; player.chargeSoundPlayed = false;
    } else if (mouseDown) {
      if (!player.isCharging) { player.isCharging = true; player.chargeTimer = 0; player.chargeSoundPlayed = false; }
      player.chargeTimer++;
      if (!player.chargeSoundPlayed && player.chargeTimer === 1) { playChargeSound(); player.chargeSoundPlayed = true; }
      if (player.chargeTimer >= player.chargeTime) {
        fireWeapon();
        player.chargeTimer = 0; player.isCharging = false;
        player.cooldownTimer = player.cooldownMax; player.chargeSoundPlayed = false;
        if (!gameActive) return;
      }
    } else { player.isCharging = false; player.chargeTimer = 0; player.chargeSoundPlayed = false; }

    if (rayEffect.active) { rayEffect.timer--; if (rayEffect.timer <= 0) rayEffect.active = false; }

    const mode = MODES[currentMode];
    if (mode.bossMode) {
      if (!bossSpawned && enemies.length < 5) spawnBoss();
    } else if (mode.waveMode) {
      if (betweenWaves) {
        waveTimer--;
        if (waveTimer <= 0) {
          betweenWaves = false; waveNumber++;
          showToast('🌊 Oleada ' + waveNumber);
          for (let i = 0; i < 5 + waveNumber * 2; i++) spawnEnemy();
        }
      } else {
        if (enemies.length === 0) { betweenWaves = true; waveTimer = 120; }
      }
    } else {
      enemySpawnTimer++;
      if (enemySpawnTimer >= enemySpawnDelay) {
        enemySpawnTimer = 0; spawnEnemy();
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.frozen > 0) { e.frozen--; continue; }
      const edx = player.x - e.x, edy = player.y - e.y;
      const dist = Math.hypot(edx, edy);
      if (dist > 1) {
        const move = Math.min(e.speed, dist);
        e.x += (edx / dist) * move; e.y += (edy / dist) * move;
      }
      resolveWallCollision(e);
      e.wobble += 0.08; e.angle = Math.atan2(edy, edx);
      if (dist < player.radius + e.radius) {
        if (player.dodge > 0 && Math.random() < player.dodge) {
          addHitParticles(e.x, e.y, '#c77dff', 6); enemies.splice(i, 1); continue;
        }
        if (!godMode) { player.hp -= e.isBoss ? 20 : 8; playHurtSound(); updateUI(); }
        addHitParticles(e.x, e.y, '#ff5555', 6);
        if (!e.isBoss) enemies.splice(i, 1);
        if (!godMode && player.hp <= 0) {
          player.hp = 0; updateUI(); gameActive = false;
          playGameOverSound(); saveGame();
          setTimeout(function() {
            alert('💀 Has caído.\nNivel: ' + level + '\nMejor: ' + bestLevel + '\nBajas: ' + totalKills);
            resetGame();
          }, 400);
          return;
        }
        continue;
      }
      if (e.x < -200 || e.x > MAP_W + 200 || e.y < -200 || e.y > MAP_H + 200) {
        if (!e.isBoss) enemies.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.022;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = 0; i < stars.length; i++) stars[i].twinkle += stars[i].speed;
  }

  // ==================== DRAW ====================
  function draw() {
    const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, '#0c121c'); bgGrad.addColorStop(0.5, '#070b12'); bgGrad.addColorStop(1, '#030507');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.fillStyle = '#aaccff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(60, 110, 180, 0.06)'; ctx.lineWidth = 1;
    for (let x = 0; x < MAP_W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke(); }
    for (let y = 0; y < MAP_H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke(); }

    ctx.strokeStyle = 'rgba(100, 160, 255, 0.3)'; ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, MAP_W, MAP_H);

    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      const grad = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      grad.addColorStop(0, '#2a3a5a'); grad.addColorStop(1, '#1a2a4a');
      ctx.fillStyle = grad;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
      ctx.fillStyle = 'rgba(150, 200, 255, 0.15)';
      ctx.fillRect(w.x, w.y, w.w, 3);
    }

    if (!player) { ctx.restore(); return; }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      ctx.save();
      ctx.shadowColor = e.isBoss ? 'rgba(255, 0, 0, 0.8)' : 'rgba(255, 40, 60, 0.5)';
      ctx.shadowBlur = e.isBoss ? 40 : 20;
      const eg = ctx.createRadialGradient(e.x - e.radius * 0.3, e.y - e.radius * 0.3, 2, e.x, e.y, e.radius);
      if (e.frozen > 0) {
        eg.addColorStop(0, '#aaddff'); eg.addColorStop(0.7, '#4d9fdf'); eg.addColorStop(1, '#1a4a7a');
      } else if (e.isBoss) {
        eg.addColorStop(0, '#ff6b6b'); eg.addColorStop(0.7, '#cc0000'); eg.addColorStop(1, '#4a0000');
      } else {
        eg.addColorStop(0, '#ff6b8a'); eg.addColorStop(0.7, e.color); eg.addColorStop(1, '#5a0a1a');
      }
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = eg; ctx.fill();
      ctx.strokeStyle = e.isBoss ? '#ff4444' : 'rgba(255, 120, 150, 0.8)';
      ctx.lineWidth = e.isBoss ? 3 : 1.5; ctx.stroke();
      const eyeOffset = e.radius * 0.35;
      ctx.beginPath(); ctx.arc(e.x - eyeOffset, e.y - 2, 2, 0, Math.PI * 2);
      ctx.arc(e.x + eyeOffset, e.y - 2, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffddaa'; ctx.fill();
      ctx.restore();
      const hpPct = e.hp / e.maxHp;
      const barW = e.isBoss ? 80 : 38, barH = 6;
      const bx = e.x - barW / 2, by = e.y - e.radius - 16;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
      ctx.fillStyle = hpPct > 0.6 ? '#3aff7a' : (hpPct > 0.25 ? '#ffbb33' : '#ff3344');
      ctx.fillRect(bx, by, barW * hpPct, barH);
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.shadowBlur = 10; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    if (rayEffect.active) {
      const t = rayEffect.timer / rayEffect.duration;
      const alpha = Math.min(1, t * 1.8);
      const color = rayEffect.color || '#7df9ff';
      for (let r = 0; r < rayEffect.rays.length; r++) {
        const angle = rayEffect.rays[r];
        const rayEnd = getRayEndWithWalls(player.x, player.y, angle, player.rayRange);
        const endX = rayEnd.x, endY = rayEnd.y;
        ctx.save();
        ctx.globalAlpha = alpha * 0.3; ctx.strokeStyle = color;
        ctx.lineWidth = player.rayWidth * 2 * (0.5 + 0.5 * t);
        ctx.lineCap = 'round'; ctx.shadowBlur = 30; ctx.shadowColor = color;
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(endX, endY); ctx.stroke();
        ctx.globalAlpha = alpha * 0.8; ctx.lineWidth = player.rayWidth * (0.7 + 0.3 * t);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(endX, endY); ctx.stroke();
        ctx.globalAlpha = alpha; ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1.5, player.rayWidth / 2.5 * t);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(endX, endY); ctx.stroke();
        ctx.restore();
      }
    }

    if (player.isCharging && player.cooldownTimer <= 0) {
      const progress = player.chargeTimer / player.chargeTime;
      const r = player.radius + 14;
      ctx.save();
      ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(40, 80, 120, 0.4)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.beginPath(); ctx.arc(player.x, player.y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
      ctx.strokeStyle = '#4df0ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.shadowBlur = 15; ctx.shadowColor = '#4df0ff'; ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.shadowColor = godMode ? '#ffdd00' : '#2ad4ff'; ctx.shadowBlur = 25;
    const pg = ctx.createRadialGradient(player.x - 5, player.y - 5, 2, player.x, player.y, player.radius);
    pg.addColorStop(0, '#8fdcff'); pg.addColorStop(0.5, godMode ? '#ffcc33' : '#2b8cff'); pg.addColorStop(1, '#0a2a5a');
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = godMode ? '#ffe680' : '#7dd4ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();

    const recoilOffset = player.recoil;
    const ang = player.aimAngle;
    const barrelLen = player.radius + 16 - recoilOffset;
    const tipX = player.x + Math.cos(ang) * barrelLen;
    const tipY = player.y + Math.sin(ang) * barrelLen;
    ctx.save();
    ctx.shadowBlur = 15; ctx.shadowColor = player.isCharging ? '#ffdd66' : '#aae0ff';
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(tipX, tipY);
    ctx.lineWidth = 10; ctx.strokeStyle = '#1a3a6a'; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(tipX, tipY);
    ctx.lineWidth = 4; ctx.strokeStyle = player.isCharging ? '#ffdd66' : '#7dd4ff'; ctx.stroke();
    ctx.restore();

    if (player.flash > 0) {
      ctx.save(); ctx.globalAlpha = player.flash / 6;
      ctx.beginPath(); ctx.arc(tipX, tipY, 16, 0, Math.PI * 2);
      const fg = ctx.createRadialGradient(tipX, tipY, 2, tipX, tipY, 16);
      fg.addColorStop(0, '#ffffff'); fg.addColorStop(1, 'rgba(120, 240, 255, 0)');
      ctx.fillStyle = fg; ctx.fill(); ctx.restore();
    }

    if (godMode) {
      ctx.save(); ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 220, 0, 0.5)'; ctx.lineWidth = 2;
      ctx.shadowBlur = 25; ctx.shadowColor = '#ffdd00'; ctx.stroke(); ctx.restore();
    }

    if (!isMobile) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 1.5;
      ctx.shadowBlur = 6; ctx.shadowColor = '#4df0ff';
      const mwx = mouseX + camera.x, mwy = mouseY + camera.y;
      ctx.beginPath(); ctx.arc(mwx, mwy, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mwx - 14, mwy); ctx.lineTo(mwx - 4, mwy);
      ctx.moveTo(mwx + 4, mwy); ctx.lineTo(mwx + 14, mwy);
      ctx.moveTo(mwx, mwy - 14); ctx.lineTo(mwx, mwy - 4);
      ctx.moveTo(mwx, mwy + 4); ctx.lineTo(mwx, mwy + 14);
      ctx.stroke(); ctx.restore();
    }

    ctx.restore();

    // HUD de pantalla
    ctx.font = 'bold 11px "Segoe UI", monospace'; ctx.textAlign = 'center';
    ctx.shadowBlur = 8;
    const px = player.x - camera.x, py = player.y - camera.y;
    if (player.cooldownTimer > 0) {
      ctx.fillStyle = '#ff8888'; ctx.fillText('RECARGANDO', px, py - player.radius - 20);
    } else if (player.isCharging) {
      ctx.fillStyle = '#66ddff'; ctx.fillText('CARGANDO...', px, py - player.radius - 20);
    } else {
      ctx.fillStyle = '#88aadd'; ctx.fillText('LISTO', px, py - player.radius - 20);
    }
    ctx.shadowBlur = 0;

    const xpPct = xp / xpToNext;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(8, H - 16, W - 16, 8);
    const xpGrad = ctx.createLinearGradient(8, 0, W - 8, 0);
    xpGrad.addColorStop(0, '#3a8eff'); xpGrad.addColorStop(1, '#7df9ff');
    ctx.fillStyle = xpGrad; ctx.fillRect(8, H - 16, (W - 16) * xpPct, 8);
    ctx.strokeStyle = 'rgba(120, 180, 255, 0.4)'; ctx.lineWidth = 1; ctx.strokeRect(8, H - 16, W - 16, 8);
    ctx.font = 'bold 8px "Segoe UI", monospace'; ctx.fillStyle = '#b8d4ff';
    ctx.fillText('XP ' + xp + ' / ' + xpToNext, W / 2, H - 8);

    drawMinimap();
  }

  function drawMinimap() {
    mctx.clearRect(0, 0, 130, 130);
    mctx.fillStyle = 'rgba(5, 10, 18, 0.8)';
    mctx.fillRect(0, 0, 130, 130);
    const scaleX = 130 / MAP_W, scaleY = 130 / MAP_H;
    mctx.fillStyle = 'rgba(60, 100, 160, 0.6)';
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      mctx.fillRect(w.x * scaleX, w.y * scaleY, w.w * scaleX, w.h * scaleY);
    }
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      mctx.fillStyle = e.isBoss ? '#ff4444' : '#ff6688';
      mctx.beginPath();
      mctx.arc(e.x * scaleX, e.y * scaleY, e.isBoss ? 3 : 1.5, 0, Math.PI * 2);
      mctx.fill();
    }
    if (player) {
      mctx.fillStyle = '#4df0ff';
      mctx.beginPath();
      mctx.arc(player.x * scaleX, player.y * scaleY, 2.5, 0, Math.PI * 2);
      mctx.fill();
      mctx.strokeStyle = 'rgba(120, 200, 255, 0.5)';
      mctx.lineWidth = 1;
      mctx.strokeRect(camera.x * scaleX, camera.y * scaleY, W * scaleX, H * scaleY);
    }
    mctx.strokeStyle = 'rgba(100, 180, 255, 0.4)';
    mctx.lineWidth = 1;
    mctx.strokeRect(0, 0, 130, 130);
  }

  // ==================== TIENDA ====================
  function openShop() { shopModal.classList.add('open'); renderShop(); updateUI(); }
  function renderShop() {
    shopGrid.innerHTML = '';
    CHESTS.forEach(function(chest) {
      const canAfford = gems >= chest.price;
      const card = document.createElement('div');
      card.className = 'chest-card' + (canAfford ? '' : ' locked');
      card.innerHTML = '<div class="chest-icon">' + chest.icon + '</div><div class="chest-name">' + chest.name + '</div><div class="chest-desc">' + chest.desc + '</div><div class="chest-price">' + chest.price + '</div>';
      card.addEventListener('click', function() {
        if (canAfford) buyChest(chest);
        else showToast('💎 Faltan gemas');
      });
      shopGrid.appendChild(card);
    });
  }
  function buyChest(chest) {
    if (gems < chest.price) { showToast('💎 Faltan gemas'); return; }
    gems -= chest.price; updateUI();
    shopModal.classList.remove('open'); openChest(chest);
  }
  function openChest(chest) {
    chestModal.classList.add('open');
    chestOpening.innerHTML = '<div class="big-icon">' + chest.icon + '</div><div style="color:#97b9e0;margin-top:0.6rem;font-size:0.85rem;">Abriendo ' + chest.name + '...</div>';
    playChestOpenSound();
    setTimeout(function() {
      const totalWeight = chest.drops.reduce(function(s, d) { return s + d.weight; }, 0);
      let roll = Math.random() * totalWeight;
      let drop = chest.drops[0];
      for (let i = 0; i < chest.drops.length; i++) {
        roll -= chest.drops[i].weight;
        if (roll <= 0) { drop = chest.drops[i]; break; }
      }
      let rewardHTML = '';
      if (drop.type === 'gems') {
        gems += drop.amount;
        rewardHTML = '<div class="big-icon">💎</div><div class="reward-display">+' + drop.amount + ' GEMAS</div>';
        showToast('💎 +' + drop.amount + ' gemas');
      } else if (drop.type === 'tank') {
        const tank = TANKS[drop.key];
        if (!ownedTanks[drop.key]) {
          ownedTanks[drop.key] = true;
          rewardHTML = '<div class="big-icon">' + tank.icon + '</div><div class="reward-display" style="color:' + getRarityColor(tank.rarity) + '">¡' + tank.name + '!</div><div class="reward-sub">' + tank.rarity.toUpperCase() + ' · Nv. ' + tank.levelReq + '</div>';
          showToast('🎉 ¡' + tank.name + ' desbloqueado!');
        } else {
          const comp = 30; gems += comp;
          rewardHTML = '<div class="big-icon">💎</div><div class="reward-display">Repetido</div><div class="reward-sub">+' + comp + ' gemas</div>';
          showToast('💎 +' + comp + ' gemas');
        }
      }
      chestOpening.innerHTML = rewardHTML + '<button class="admin-btn good" style="margin-top:1rem;width:auto;padding:0.4rem 1.2rem;" id="chestAccept">✓ Aceptar</button>';
      playRewardSound(); updateUI(); saveGame();
      document.getElementById('chestAccept').addEventListener('click', function() { chestModal.classList.remove('open'); });
    }, 1000);
  }
  function getRarityColor(rarity) {
    const colors = { comun: '#8a9ab0', raro: '#5f9eff', epico: '#c77dff', legendario: '#ffd966', secreto: '#ff5c8a', exotico: '#4dffb8', mitico: '#ff4dff' };
    return colors[rarity] || '#fff';
  }

  shopBtn.addEventListener('click', openShop);
  document.querySelectorAll('[data-close]').forEach(function(btn) {
    btn.addEventListener('click', function() { document.getElementById(btn.getAttribute('data-close')).classList.remove('open'); });
  });
  shopModal.addEventListener('click', function(e) { if (e.target === shopModal) shopModal.classList.remove('open'); });
  tanksModal.addEventListener('click', function(e) { if (e.target === tanksModal) tanksModal.classList.remove('open'); });
  modesModal.addEventListener('click', function(e) { if (e.target === modesModal) modesModal.classList.remove('open'); });
  chestModal.addEventListener('click', function(e) { if (e.target === chestModal) chestModal.classList.remove('open'); });

  // ==================== TANQUES ====================
  function openTanks() { tanksModal.classList.add('open'); renderTanks(); }
  function renderTanks() {
    tanksGrid.innerHTML = '';
    tankLevelReq.textContent = Math.ceil(level / 5) * 5;
    Object.keys(TANKS).forEach(function(key) {
      const tank = TANKS[key];
      const owned = ownedTanks[key];
      const levelOk = level >= tank.levelReq;
      const active = currentTankKey === key;
      const card = document.createElement('div');
      card.className = 'tank-card' + (active ? ' active' : '') + ((!owned || !levelOk) ? ' locked' : '');
      card.innerHTML =
        ((!owned || !levelOk) ? '<div class="tank-lock">🔒</div>' : '') +
        '<div class="tank-icon">' + tank.icon + '</div>' +
        '<div class="tank-name">' + tank.name + '</div>' +
        '<div class="tank-rarity rarity-' + tank.rarity + '">' + tank.rarity + '</div>' +
        '<div class="tank-level">Nv. ' + tank.levelReq + '</div>';
      card.addEventListener('click', function() {
        if (!owned) { showToast('🔒 Consíguelo en cofres'); return; }
        if (!levelOk) { showToast('🔒 Necesitas nivel ' + tank.levelReq); return; }
        applyTankToPlayer(key); renderTanks();
      });
      tanksGrid.appendChild(card);
    });
  }

  // ==================== MODOS ====================
  function openModes() { modesModal.classList.add('open'); renderModes(); }
  function renderModes() {
    modesGrid.innerHTML = '';
    Object.keys(MODES).forEach(function(key) {
      const mode = MODES[key];
      const active = currentMode === key;
      const card = document.createElement('div');
      card.className = 'mode-card' + (active ? ' active' : '');
      card.innerHTML = '<div class="mode-icon">' + mode.icon + '</div><div class="mode-name">' + mode.name + '</div><div class="mode-desc">' + mode.desc + '</div>';
      card.addEventListener('click', function() {
        currentMode = key;
        playModeSelectSound();
        modesModal.classList.remove('open');
        resetGame();
        showToast('🎮 ' + mode.name);
        saveGame();
      });
      modesGrid.appendChild(card);
    });
  }
  modesBtn.addEventListener('click', openModes);

  // ==================== ADMIN ====================
  adminToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!adminUnlocked) {
      if (gems >= 100) {
        gems -= 100; adminUnlocked = true; updateUI();
        showToast('🔨 Admin desbloqueado');
        adminPanel.classList.add('open'); syncAdminInputs();
        playCardSelectSound(); saveGame();
      } else {
        showToast('💎 Necesitas 100 gemas');
      }
    } else {
      adminPanel.classList.toggle('open');
      if (adminPanel.classList.contains('open')) syncAdminInputs();
    }
  });
  adminClose.addEventListener('click', function() { adminPanel.classList.remove('open'); });

  function syncAdminInputs() {
    if (!player) return;
    document.getElementById('admDamage').value = player.rayDamage;
    document.getElementById('admFireRate').value = player.cooldownMax;
    document.getElementById('admRange').value = player.rayRange;
    document.getElementById('admPierce').value = player.pierce;
    document.getElementById('admMultishot').value = player.multishot;
  }

  document.querySelectorAll('[data-apply]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (!player) return;
      const type = btn.getAttribute('data-apply');
      const v = function(id) { return parseFloat(document.getElementById(id).value); };
      if (type === 'damage') player.rayDamage = Math.max(1, v('admDamage'));
      else if (type === 'firerate') player.cooldownMax = Math.max(1, v('admFireRate'));
      else if (type === 'range') player.rayRange = Math.max(50, v('admRange'));
      else if (type === 'pierce') player.pierce = Math.max(1, v('admPierce'));
      else if (type === 'multishot') player.multishot = Math.max(1, v('admMultishot'));
      syncAdminInputs();
    });
  });

  document.getElementById('admLevelUp').addEventListener('click', function() { if (gameActive && !levelUpPending) requestLevelUp(); });
  document.getElementById('admAddGems').addEventListener('click', function() { gems += 100; updateUI(); showToast('💎 +100'); saveGame(); });
  document.getElementById('admUnlockAll').addEventListener('click', function() {
    Object.keys(TANKS).forEach(function(k) { ownedTanks[k] = true; });
    showToast('🔓 Todos desbloqueados'); renderTanks(); saveGame();
  });
  document.getElementById('admGodMode').addEventListener('click', function() {
    godMode = !godMode;
    this.style.background = godMode ? '#4a3a0a' : '#2a1a1a';
    this.style.borderColor = godMode ? '#ffdd00' : '#8a2e2e';
    this.textContent = godMode ? '🛡️ Dios: ON' : '🛡️ Modo Dios';
  });
  document.getElementById('admReset').addEventListener('click', function() { resetGame(); });

  function updateAdminWeaponButtons() {
    adminWeaponList.innerHTML = '';
    Object.keys(WEAPONS).forEach(function(key) {
      const w = WEAPONS[key];
      const btn = document.createElement('button');
      btn.className = 'weapon-btn' + (currentWeaponKey === key ? ' active' : '');
      btn.textContent = w.icon + ' ' + w.name;
      btn.addEventListener('click', function() { applyWeaponToPlayer(key); });
      adminWeaponList.appendChild(btn);
    });
  }

  // ==================== BUCLE ====================
  let lastTime = 0;
  const TARGET_FPS = 60;
  const FRAME_INTERVAL = 1000 / TARGET_FPS;
  function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);
    if (!timestamp) timestamp = performance.now();
    const delta = timestamp - lastTime;
    if (delta < FRAME_INTERVAL - 1) return;
    lastTime = timestamp - (delta % FRAME_INTERVAL);
    update();
    draw();
  }

  // ==================== INIT ====================
  const save = loadSave();
  if (save) {
    gems = save.gems || 0;
    ownedTanks = save.ownedTanks || { base: true };
    adminUnlocked = save.adminUnlocked || false;
    currentTankKey = save.currentTankKey || 'base';
    currentMode = save.currentMode || 'survival';
    bestLevel = save.bestLevel || 1;
    totalKills = save.totalKills || 0;
    ownedTanks.base = true;
    showToast('💾 Partida cargada');
  }

  resizeCanvas();
  initStars();
  resetGame();
  updateAdminWeaponButtons();
  requestAnimationFrame(gameLoop);

  window.addEventListener('beforeunload', saveGame);
  setInterval(saveGame, 30000);
};
</script>
</body>
