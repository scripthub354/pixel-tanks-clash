<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>⚡ RAILGUN · v3.0</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05070a; font-family: 'Segoe UI', system-ui, monospace;
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    position: fixed; inset: 0;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, #101620 0%, #05070a 70%);
  }

  #lockScreen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #0c1420 0%, #030507 80%);
    transition: opacity 0.4s ease, visibility 0.4s ease; padding: 1rem;
  }
  #lockScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .lock-box {
    background: linear-gradient(160deg, #121a28, #080b11);
    border: 1px solid #2a4a7a; border-radius: 20px;
    padding: 2rem 1.5rem; width: 100%; max-width: 380px;
    text-align: center; box-shadow: 0 0 60px rgba(40,120,255,0.25);
  }
  .lock-icon { font-size: 3.5rem; margin-bottom: 1rem; }
  .lock-title { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 3px; color: #aad0ff; margin-bottom: 0.4rem; }
  .lock-subtitle { font-size: 0.85rem; color: #5f7a9e; margin-bottom: 1.5rem; }
  .lock-input {
    width: 100%; background: #0a0e14; border: 2px solid #2a4a7a;
    border-radius: 12px; padding: 0.8rem 1rem; color: #c8deff;
    font-size: 1.1rem; font-family: inherit; text-align: center;
    letter-spacing: 3px; outline: none; margin-bottom: 1rem;
  }
  .lock-btn {
    width: 100%; background: linear-gradient(180deg, #2e5a8a, #1a3350);
    border: 1px solid #7df9ff; color: #fff; font-weight: bold;
    font-size: 1rem; padding: 0.9rem; border-radius: 12px;
    cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  }
  .lock-error-msg { color: #ff6666; font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.2rem; font-weight: 600; }

  #gameContainer { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
  #gameContainer.visible { display: flex; }

  .game-wrapper {
    position: relative; width: 100vw; height: 100vh; max-width: 1600px; max-height: 1000px;
    background: linear-gradient(145deg, #0f131b 0%, #080b10 100%);
    padding: 4px; display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 800px) {
    .game-wrapper { border-radius: 18px; padding: 10px; width: 98vw; height: 96vh; }
  }

  .canvas-container {
    position: relative; flex: 1; border-radius: 8px; overflow: hidden; background: #06090e;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  .stats-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 4px; padding: 0 2px; gap: 3px; flex-wrap: wrap;
    color: #c8deff; font-weight: 600; font-size: 0.7rem;
  }
  .hud-item {
    display: flex; align-items: center; gap: 3px;
    background: linear-gradient(180deg, #141c28, #0b1118);
    border: 1px solid #2a3f5c; padding: 2px 6px; border-radius: 5px;
    min-height: 26px;
  }
  .level-badge { color: #ffd966; border-color: #5a4a1f; }
  .gem-badge { color: #c77dff; border-color: #5a2e8a; }
  .hp-fill { width: 60px; height: 9px; background: #0a0e14; border-radius: 3px; overflow: hidden; border: 1px solid #3a1f28; }
  @media (min-width: 500px) { .hp-fill { width: 90px; height: 12px; } }
  .hp-fill span { display: block; height: 100%; background: linear-gradient(90deg, #ff1f4b, #ff8a5c); transition: width 0.12s ease; }

  button { font-family: inherit; cursor: pointer; border: none; outline: none; -webkit-appearance: none; }
  .hud-btn {
    font-weight: bold; padding: 4px 6px; border-radius: 5px; font-size: 0.7rem; border: 1px solid;
    min-width: 28px; min-height: 28px; display: flex; align-items: center; justify-content: center;
    background: #14202e; border-color: #2e5a8a; color: #b8d4ff;
  }
  .hud-btn:active { transform: scale(0.9); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2,4,8,0.92); backdrop-filter: blur(6px);
    display: none; justify-content: center; align-items: center; z-index: 15; padding: 0.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #121a28, #080b11);
    border-radius: 14px; border: 1px solid #2a4a7a;
    max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto;
    padding: 1rem; color: #c8deff; -webkit-overflow-scrolling: touch;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid #2a4a7a;
  }
  .modal-title { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: #aad0ff; }
  .close-btn {
    background: #2a1a1a; border: 1px solid #8a2e2e; color: #ffb8b8;
    width: 32px; height: 32px; border-radius: 50%; font-size: 0.95rem; font-weight: bold;
  }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.6rem; }
  .chest-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 10px; border: 2px solid #3a5a8a; padding: 0.8rem 0.4rem;
    text-align: center; cursor: pointer;
  }
  .chest-card .chest-icon { font-size: 2rem; margin-bottom: 0.3rem; }
  .chest-card .chest-name { font-size: 0.8rem; font-weight: 700; color: #fff; }
  .chest-card .chest-price { display: inline-block; background: #5a2e8a; color: #e8c8ff; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: bold; font-size: 0.75rem; margin-top: 0.3rem; }
  .chest-card.locked { opacity: 0.5; }

  .tanks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.5rem; }
  .tank-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 8px; border: 2px solid #3a5a8a; padding: 0.6rem 0.3rem;
    text-align: center; cursor: pointer; position: relative;
  }
  .tank-card.active { border-color: #7df9ff; box-shadow: 0 0 20px #3e7eff; }
  .tank-card.locked { opacity: 0.5; }
  .tank-card .tank-icon { font-size: 1.6rem; margin-bottom: 0.2rem; }
  .tank-card .tank-name { font-size: 0.7rem; font-weight: 700; color: #fff; }
  .tank-card .tank-rarity { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  .tank-card .tank-level { font-size: 0.55rem; color: #97b9e0; margin-top: 2px; }
  .rarity-comun { color: #8a9ab0; } .rarity-raro { color: #5f9eff; }
  .rarity-epico { color: #c77dff; } .rarity-legendario { color: #ffd966; }
  .rarity-secreto { color: #ff5c8a; } .rarity-exotico { color: #4dffb8; }
  .rarity-mitico { color: #ff4dff; } .rarity-admin { color: #ff0000; text-shadow: 0 0 8px #ff0000; }
  .tank-card .tank-lock { position: absolute; top: 3px; right: 3px; font-size: 0.7rem; }

  .modes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
  .mode-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 10px; border: 2px solid #3a5a8a; padding: 0.9rem 0.6rem;
    text-align: center; cursor: pointer;
  }
  .mode-card.active { border-color: #7df9ff; box-shadow: 0 0 20px #3e7eff; }
  .mode-card .mode-icon { font-size: 2rem; margin-bottom: 0.3rem; }
  .mode-card .mode-name { font-size: 0.85rem; font-weight: 700; color: #fff; }
  .mode-card .mode-desc { font-size: 0.7rem; color: #97b9e0; line-height: 1.3; }

  .admin-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 340px; max-width: 92vw;
    background: linear-gradient(160deg, #0f131c, #080b11);
    border: 1px solid #8a2e2e; border-radius: 14px; padding: 0.9rem; z-index: 20;
    color: #ffd8d8; display: none; font-size: 0.75rem; max-height: 88vh; overflow-y: auto;
  }
  .admin-panel.open { display: block; }
  .admin-panel h3 { margin: 0 0 0.6rem 0; color: #ff6b6b; font-size: 0.9rem; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 0.3rem; margin-bottom: 0.35rem; }
  .admin-row label { flex: 1; color: #ffb8b8; font-size: 0.7rem; }
  .admin-row input[type="number"] { width: 60px; background: #1a1f2b; border: 1px solid #8a2e2e; color: #fff; padding: 0.15rem 0.25rem; border-radius: 4px; font-size: 0.7rem; }
  .admin-btn { background: #2a1a1a; border: 1px solid #8a2e2e; color: #ffb8b8; padding: 0.3rem 0.5rem; border-radius: 5px; font-weight: bold; font-size: 0.7rem; width: 100%; margin-top: 0.25rem; }
  .admin-btn.good { background: #0f2a1a; border-color: #2e8a5a; color: #b8ffd8; }
  .admin-btn.danger { background: #4a1010; border-color: #ff2e2e; }
  .admin-section { border-top: 1px solid #3a1b1b; margin-top: 0.6rem; padding-top: 0.6rem; }
  .admin-section-title { color: #ff8a8a; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.3rem; font-weight: bold; }
  .weapon-btn { background: #14202e; border: 1px solid #2e4a7a; color: #b8d4ff; padding: 0.25rem 0.4rem; border-radius: 5px; font-size: 0.68rem; margin: 0 0.15rem 0.25rem 0; font-weight: 600; }
  .weapon-btn.active { background: #2e5a8a; border-color: #7df9ff; color: #fff; }

  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #1a2e4a; border: 1px solid #5f9eff; border-radius: 8px; padding: 0.4rem 1rem;
    color: #c8deff; font-weight: bold; z-index: 30; opacity: 0; transition: all 0.3s ease;
    pointer-events: none; font-size: 0.78rem; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .chest-opening { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; text-align: center; }
  .chest-opening .big-icon { font-size: 4rem; animation: chestShake 0.6s ease-in-out infinite; }
  @keyframes chestShake { 0%, 100% { transform: rotate(-5deg) scale(1); } 50% { transform: rotate(5deg) scale(1.05); } }
  .reward-display { font-size: 1rem; font-weight: bold; color: #ffd966; margin-top: 0.6rem; }
  .reward-sub { font-size: 0.75rem; color: #97b9e0; margin-top: 0.3rem; }

  /* ===== DOBLE JOYSTICK ===== */
  .joystick-zone {
    position: absolute; bottom: 20px;
    width: 110px; height: 110px;
    background: rgba(30, 60, 100, 0.3);
    border: 2px solid rgba(100, 180, 255, 0.4);
    border-radius: 50%; display: none; z-index: 5; touch-action: none;
  }
  .joystick-zone.active { display: block; }
  .joystick-zone.left { left: 20px; }
  .joystick-zone.right { right: 20px; background: rgba(100, 30, 30, 0.3); border-color: rgba(255, 120, 120, 0.4); }
  .joystick-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 46px; height: 46px;
    background: radial-gradient(circle, #4df0ff, #1a6aaa);
    border-radius: 50%; border: 2px solid rgba(200, 240, 255, 0.6);
    box-shadow: 0 0 20px #4df0ff; pointer-events: none;
  }
  .joystick-zone.right .joystick-knob {
    background: radial-gradient(circle, #ff6666, #aa1a1a);
    border-color: rgba(255, 200, 200, 0.6);
    box-shadow: 0 0 20px #ff6666;
  }

  .minimap {
    position: absolute; top: 8px; right: 8px;
    width: 90px; height: 90px;
    background: rgba(5, 10, 18, 0.7);
    border: 1px solid rgba(80, 140, 255, 0.3);
    border-radius: 6px; z-index: 4; pointer-events: none;
  }
  @media (min-width: 800px) { .minimap { width: 130px; height: 130px; } }

  .fullscreen-btn {
    position: absolute; top: 8px; left: 8px;
    background: rgba(20, 30, 50, 0.8);
    border: 1px solid rgba(100, 160, 255, 0.4);
    color: #b8d4ff; width: 32px; height: 32px;
    border-radius: 6px; font-size: 0.9rem; z-index: 6;
  }

  /* ===== BARRA DE MEJORAS ===== */
  .upgrade-bar {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; z-index: 6; background: rgba(10, 15, 25, 0.8);
    padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(80, 140, 255, 0.3);
  }
  .upgrade-btn {
    background: #1a2a3e; border: 1px solid #3a5a8a; color: #c8deff;
    width: 36px; height: 36px; border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.55rem; font-weight: bold; cursor: pointer;
    position: relative;
  }
  .upgrade-btn .upg-icon { font-size: 0.9rem; line-height: 1; }
  .upgrade-btn .upg-cost { font-size: 0.5rem; color: #ffd966; }
  .upgrade-btn:active { transform: scale(0.9); }
  .upgrade-btn.maxed { opacity: 0.4; }
  @media (min-width: 500px) {
    .upgrade-btn { width: 44px; height: 44px; font-size: 0.6rem; }
    .upgrade-btn .upg-icon { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Acceso Restringido</div>
    <div class="lock-subtitle">Introduce la contraseña</div>
    <input type="password" id="passwordInput" class="lock-input" placeholder="••••••••" autocomplete="off" maxlength="32">
    <button id="unlockBtn" class="lock-btn">Desbloquear</button>
    <div id="lockError" class="lock-error-msg"></div>
  </div>
</div>

<div id="gameContainer">
  <div class="game-wrapper">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas"></canvas>
      <canvas id="minimap" class="minimap" width="130" height="130"></canvas>
      <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>
      <div class="joystick-zone left" id="joystickLeft">
        <div class="joystick-knob" id="knobLeft"></div>
      </div>
      <div class="joystick-zone right" id="joystickRight">
        <div class="joystick-knob" id="knobRight"></div>
      </div>
      <div class="upgrade-bar" id="upgradeBar"></div>
    </div>
    <div class="stats-bar">
      <div class="hud-item level-badge">⭐ <span id="levelDisplay">1</span></div>
      <div class="hud-item gem-badge">💎 <span id="gemDisplay">0</span></div>
      <div class="hud-item hp-container">
        <span>❤️</span>
        <div class="hp-fill"><span id="hpFill" style="width:100%"></span></div>
      </div>
      <div class="hud-item" style="padding:2px 4px;gap:2px;">
        <button class="hud-btn" id="modesBtn" title="Modos">🎮</button>
        <button class="hud-btn" id="tanksBtn" title="Cambiar tanque">🚀</button>
        <button class="hud-btn" id="shopBtn" title="Tienda">🛒</button>
        <button class="hud-btn" id="soundToggle" title="Sonido">🔊</button>
        <button class="hud-btn" id="adminToggle" title="Admin">🔨</button>
        <button class="hud-btn" id="restartBtn" title="Reiniciar">⟳</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="shopModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🛒 Tienda</div><button class="close-btn" data-close="shopModal">✕</button></div>
    <div style="text-align:center;margin-bottom:0.6rem;font-size:0.9rem;">Gemas: <span style="color:#e8c8ff;font-weight:bold;">💎 <span id="shopGemCount">0</span></span></div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="tanksModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🚀 Tanques</div><button class="close-btn" data-close="tanksModal">✕</button></div>
    <div style="text-align:center;margin-bottom:0.5rem;font-size:0.75rem;color:#97b9e0;">Árbol de evolución · Nivel actual: <span id="tankLevelReq" style="color:#7df9ff;font-weight:bold;">1</span></div>
    <div class="tanks-grid" id="tanksGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="modesModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🎮 Modos</div><button class="close-btn" data-close="modesModal">✕</button></div>
    <div class="modes-grid" id="modesGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="chestModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header"><div class="modal-title">🎁 Cofre</div><button class="close-btn" data-close="chestModal">✕</button></div>
    <div class="chest-opening" id="chestOpening"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid #8a2e2e;">
    <h3 style="margin:0;">🔨 Admin</h3>
    <button id="adminClose" style="background:#2a1a1a;border:1px solid #8a2e2e;color:#ffb8b8;width:24px;height:24px;border-radius:50%;font-size:0.85rem;font-weight:bold;">✕</button>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Tanques de Admin (exclusivos)</div>
    <div id="adminTankList" style="display:flex;flex-wrap:wrap;"></div>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Trucos</div>
    <button class="admin-btn good" id="admLevelUp">⬆ Subir de nivel</button>
    <button class="admin-btn" id="admAddGems">💎 +100 gemas</button>
    <button class="admin-btn" id="admUnlockAll">🔓 Desbloquear todos</button>
    <button class="admin-btn" id="admGodMode">🛡️ Modo Dios</button>
    <button class="admin-btn danger" id="admReset">☠ Reiniciar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== CONTRASEÑA ====================
(function() {
  'use strict';
  const CORRECT_PASSWORD = 'melon2027';
  const lockScreen = document.getElementById('lockScreen');
  const passwordInput = document.getElementById('passwordInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const lockError = document.getElementById('lockError');
  const gameContainer = document.getElementById('gameContainer');

  if (sessionStorage.getItem('railgun_auth') === 'true') {
    lockScreen.classList.add('hidden');
    gameContainer.classList.add('visible');
    if (window.initGame) window.initGame();
  }

  function tryUnlock() {
    if (passwordInput.value.trim() === CORRECT_PASSWORD) {
      lockError.textContent = '✓ Acceso concedido';
      lockError.style.color = '#66ff88';
      sessionStorage.setItem('railgun_auth', 'true');
      setTimeout(function() {
        lockScreen.classList.add('hidden');
        gameContainer.classList.add('visible');
        if (window.initGame) window.initGame();
      }, 300);
    } else {
      lockError.textContent = '✕ Contraseña incorrecta';
      lockError.style.color = '#ff6666';
      passwordInput.value = '';
    }
  }
  unlockBtn.addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });
  setTimeout(function() { passwordInput.focus(); }, 100);
})();

// ==================== JUEGO ====================
window.initGame = function() {
  'use strict';
  if (window._gameInitialized) return;
  window._gameInitialized = true;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const minimapCanvas = document.getElementById('minimap');
  const mctx = minimapCanvas.getContext('2d');
  const canvasContainer = document.getElementById('canvasContainer');
  const levelSpan = document.getElementById('levelDisplay');
  const gemDisplay = document.getElementById('gemDisplay');
  const shopGemCount = document.getElementById('shopGemCount');
  const hpFillSpan = document.getElementById('hpFill');
  const restartBtn = document.getElementById('restartBtn');
  const soundToggle = document.getElementById('soundToggle');
  const adminToggle = document.getElementById('adminToggle');
  const adminPanel = document.getElementById('adminPanel');
  const adminClose = document.getElementById('adminClose');
  const adminTankList = document.getElementById('adminTankList');
  const shopBtn = document.getElementById('shopBtn');
  const shopModal = document.getElementById('shopModal');
  const shopGrid = document.getElementById('shopGrid');
  const tanksBtn = document.getElementById('tanksBtn');
  const tanksModal = document.getElementById('tanksModal');
  const tanksGrid = document.getElementById('tanksGrid');
  const tankLevelReq = document.getElementById('tankLevelReq');
  const modesBtn = document.getElementById('modesBtn');
  const modesModal = document.getElementById('modesModal');
  const modesGrid = document.getElementById('modesGrid');
  const chestModal = document.getElementById('chestModal');
  const chestOpening = document.getElementById('chestOpening');
  const toast = document.getElementById('toast');
  const joystickLeft = document.getElementById('joystickLeft');
  const joystickRight = document.getElementById('joystickRight');
  const knobLeft = document.getElementById('knobLeft');
  const knobRight = document.getElementById('knobRight');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  function playTone(freq, dur, type, vol, slide) {
    if (!soundEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, now + dur);
      g.gain.setValueAtTime(vol || 0.15, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + dur + 0.02);
    } catch (e) {}
  }

  function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX, dy = cy - closestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function resolveWallCollision(entity) {
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      if (rectCircleCollide(w.x, w.y, w.w, w.h, entity.x, entity.y, entity.radius)) {
        const cx = Math.max(w.x, Math.min(entity.x, w.x + w.w));
        const cy = Math.max(w.y, Math.min(entity.y, w.y + w.h));
        const dx = entity.x - cx, dy = entity.y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const ov = entity.radius - dist;
          entity.x += (dx / dist) * ov;
          entity.y += (dy / dist) * ov;
        }
      }
    }
  }

  function updateBots() {
    for (let i = 0; i < bots.length; i++) {
      const bot = bots[i];
      // Buscar objetivo: enemigos, jugador o bots enemigos
      let closestDist = Infinity, target = null;
      // Enemigos siempre son objetivo
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        const d = Math.hypot(e.x - bot.x, e.y - bot.y);
        if (d < closestDist) { closestDist = d; target = e; }
      }
      // Bots de otro equipo
      for (let j = 0; j < bots.length; j++) {
        if (i === j) continue;
        if (bots[j].team !== bot.team && bots[j].hp > 0) {
          const d = Math.hypot(bots[j].x - bot.x, bots[j].y - bot.y);
          if (d < closestDist) { closestDist = d; target = bots[j]; }
        }
      }
      // Jugador (en modo team, solo si es de otro equipo, aquí jugador es azul por defecto)
      if (bot.team === 'red' && player) {
        const d = Math.hypot(player.x - bot.x, player.y - bot.y);
        if (d < closestDist) { closestDist = d; target = player; }
      }

      if (target) {
        const dx = target.x - bot.x, dy = target.y - bot.y;
        const dist = Math.hypot(dx, dy);
        bot.aimAngle = Math.atan2(dy, dx);
        // Moverse hacia el objetivo si está lejos
        if (dist > 200) {
          bot.x += (dx / dist) * bot.speed;
          bot.y += (dy / dist) * bot.speed;
        } else if (dist < 150) {
          bot.x -= (dx / dist) * bot.speed * 0.5;
          bot.y -= (dy / dist) * bot.speed * 0.5;
        }
        // Disparar
        if (bot.cooldown <= 0 && dist < 400) {
          bot.cooldown = 30;
          fireBotProjectile(bot);
        }
      } else {
        // Movimiento aleatorio
        bot.aimAngle += (Math.random() - 0.5) * 0.2;
        bot.x += Math.cos(bot.aimAngle) * bot.speed * 0.5;
        bot.y += Math.sin(bot.aimAngle) * bot.speed * 0.5;
      }
      if (bot.cooldown > 0) bot.cooldown--;
      resolveWallCollision(bot);
      bot.x = Math.max(bot.radius, Math.min(MAP_W - bot.radius, bot.x));
      bot.y = Math.max(bot.radius, Math.min(MAP_H - bot.radius, bot.y));
    }
  }

  // ==================== DISPARO DEL JUGADOR ====================
  function pointSegmentDistance(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = 0;
    if (lenSq > 0) { t = ((px - x1) * dx + (py - y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); }
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function getRayEndWithWalls(x1, y1, angle, maxRange) {
    let endX = x1 + Math.cos(angle) * maxRange;
    let endY = y1 + Math.sin(angle) * maxRange;
    let minT = 1;
    for (let i = 0; i < walls.length; i++) {
      const wall = walls[i];
      for (let step = 0; step <= 20; step++) {
        const t = step / 20;
        const px = x1 + (endX - x1) * t;
        const py = y1 + (endY - y1) * t;
        if (px > wall.x && px < wall.x + wall.w && py > wall.y && py < wall.y + wall.h) {
          if (t < minT) minT = t;
          break;
        }
      }
    }
    return { x: x1 + (endX - x1) * minT, y: y1 + (endY - y1) * minT };
  }

  function fireRailgun() {
    if (!gameActive) return;
    const r = RAILGUNS[currentRailgunKey];
    playTone(120, 0.35, 'sine', 0.5, 35);
    playTone(800, 0.3, 'sawtooth', 0.25, 60);
    player.recoil = 6; player.flash = 6;

    const baseAngle = joystickRightActive ? aimAngleJoy : Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
    const hitEnemies = [];
    const rays = [];
    const viaCount = r.via;
    const spread = viaCount > 1 ? 0.15 : 0;

    for (let s = 0; s < viaCount; s++) {
      let offset = 0;
      if (viaCount > 1) offset = -spread / 2 + (s * spread / (viaCount - 1));
      rays.push(baseAngle + offset);
    }
    rayEffect = { active: true, timer: 8, duration: 8, rays: rays, color: r.color };

    for (let s = 0; s < viaCount; s++) {
      let offset = 0;
      if (viaCount > 1) offset = -spread / 2 + (s * spread / (viaCount - 1));
      const angle = baseAngle + offset;
      const rayEnd = getRayEndWithWalls(player.x, player.y, angle, player.rayRange);
      let pierceLeft = player.pierce;
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (pointSegmentDistance(e.x, e.y, player.x, player.y, rayEnd.x, rayEnd.y) < e.radius + player.rayWidth / 2) {
          candidates.push({ target: e, d: Math.hypot(e.x - player.x, e.y - player.y), type: 'enemy' });
        }
      }
      for (let i = 0; i < bots.length; i++) {
        const b = bots[i];
        if (b.hp <= 0) continue;
        // Solo disparar a bots de otro equipo (jugador es azul)
        if (b.team === 'red' && pointSegmentDistance(b.x, b.y, player.x, player.y, rayEnd.x, rayEnd.y) < b.radius + player.rayWidth / 2) {
          candidates.push({ target: b, d: Math.hypot(b.x - player.x, b.y - player.y), type: 'bot' });
        }
      }
      candidates.sort(function(a, b) { return a.d - b.d; });
      for (let c = 0; c < candidates.length; c++) {
        if (pierceLeft <= 0) break;
        const cand = candidates[c];
        if (hitEnemies.indexOf(cand.target) !== -1) continue;
        hitEnemies.push(cand.target);
        cand.target.hp -= player.rayDamage;
        addHitParticles(cand.target.x, cand.target.y, r.color, 4);
        if (cand.target.hp <= 0) {
          if (cand.type === 'enemy') {
            const idx = enemies.indexOf(cand.target);
            if (idx !== -1) enemies.splice(idx, 1);
            xp += 2; totalKills++;
          }
          addHitParticles(cand.target.x, cand.target.y, '#ffaa66', 10);
        }
        pierceLeft--;
      }
    }
  }

  // ==================== UPDATE ====================
  function update() {
    if (!gameActive || !player) return;

    // Movimiento
    let dx = 0, dy = 0;
    if (keys.w) dy -= 1; if (keys.s) dy += 1;
    if (keys.a) dx -= 1; if (keys.d) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      player.x += dx * player.speed;
      player.y += dy * player.speed;
    }
    resolveWallCollision(player);
    player.x = Math.max(player.radius, Math.min(MAP_W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(MAP_H - player.radius, player.y));

    // Cámara
    camera.x = Math.max(0, Math.min(MAP_W - W, player.x - W / 2));
    camera.y = Math.max(0, Math.min(MAP_H - H, player.y - H / 2));

    // Ángulo
    let targetAngle;
    if (joystickRightActive) {
      targetAngle = aimAngleJoy;
    } else {
      targetAngle = Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
    }
    let diff = targetAngle - player.aimAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.aimAngle += diff * 0.3;
    if (player.recoil > 0) player.recoil *= 0.85;
    if (player.flash > 0) player.flash--;

    // Regen
    if (player.regenPerSecond > 0 && player.hp < player.maxHp) {
      regenAccumulator++;
      if (regenAccumulator >= REGEN_INTERVAL) {
        regenAccumulator = 0;
        player.hp = Math.min(player.maxHp, player.hp + player.regenPerSecond);
        updateUI();
      }
    }

    // Disparo automático con joystick derecho o clic
    const shouldFire = joystickRightActive || mouseDown;
    if (player.cooldownTimer > 0) {
      player.cooldownTimer--;
      player.isCharging = false; player.chargeTimer = 0;
    } else if (shouldFire) {
      if (!player.isCharging) { player.isCharging = true; player.chargeTimer = 0; }
      player.chargeTimer++;
      if (player.chargeTimer >= player.chargeTime) {
        fireRailgun();
        player.chargeTimer = 0; player.isCharging = false;
        player.cooldownTimer = player.cooldownMax;
      }
    } else {
      player.isCharging = false; player.chargeTimer = 0;
    }

    if (rayEffect.active) { rayEffect.timer--; if (rayEffect.timer <= 0) rayEffect.active = false; }

    // Spawn enemigos
    enemySpawnTimer++;
    if (enemySpawnTimer >= MODES[currentMode].spawnRate) {
      enemySpawnTimer = 0;
      if (enemies.length < MODES[currentMode].maxEnemies) spawnEnemy();
    }

    // Bots
    updateBots();

    // Enemigos
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const edx = player.x - e.x, edy = player.y - e.y;
      const dist = Math.hypot(edx, edy);
      if (dist > 1) {
        const move = Math.min(e.speed, dist);
        e.x += (edx / dist) * move; e.y += (edy / dist) * move;
      }
      resolveWallCollision(e);
      if (dist < player.radius + e.radius) {
        if (!godMode) {
          player.hp -= 8;
          e.hp -= player.bodyDamage;
          if (e.hp <= 0) { enemies.splice(i, 1); xp += 2; totalKills++; }
          updateUI();
        }
        if (!godMode && player.hp <= 0) { gameOver(); return; }
      }
    }

    // Proyectiles de bots
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) { projectiles.splice(i, 1); continue; }
      // Colisión con paredes
      for (let w = 0; w < walls.length; w++) {
        const wall = walls[w];
        if (p.x > wall.x && p.x < wall.x + wall.w && p.y > wall.y && p.y < wall.y + wall.h) {
          projectiles.splice(i, 1); break;
        }
      }
      // Colisión con jugador (si es de otro equipo)
      if (p.team === 'red' && Math.hypot(p.x - player.x, p.y - player.y) < player.radius + p.radius) {
        if (!godMode) { player.hp -= p.damage; updateUI(); }
        projectiles.splice(i, 1);
        if (!godMode && player.hp <= 0) { gameOver(); return; }
        continue;
      }
      // Colisión con bots enemigos
      for (let b = 0; b < bots.length; b++) {
        if (bots[b].team !== p.team && Math.hypot(p.x - bots[b].x, p.y - bots[b].y) < bots[b].radius + p.radius) {
          bots[b].hp -= p.damage;
          projectiles.splice(i, 1);
          break;
        }
      }
    }

    // Comida (XP)
    for (let i = foodItems.length - 1; i >= 0; i--) {
      const f = foodItems[i];
      f.pulse += 0.1;
      if (Math.hypot(f.x - player.x, f.y - player.y) < player.radius + f.radius + 5) {
        xp += f.xpValue;
        addHitParticles(f.x, f.y, f.color, 4);
        foodItems.splice(i, 1);
        // Regenerar comida
        setTimeout(function() {
          foodItems.push({
            x: 100 + Math.random() * (MAP_W - 200),
            y: 100 + Math.random() * (MAP_H - 200),
            xpValue: 3 + Math.floor(Math.random() * 5),
            radius: 6, color: 'hsl(' + Math.random() * 60 + 40 + ', 90%, 60%)',
            pulse: Math.random() * Math.PI * 2
          });
        }, 3000);
      }
    }

    // Level up
    if (xp >= xpToNext && !levelUpPending) {
      levelUpPending = true;
      level++;
      xp = 0;
      xpToNext = Math.floor(10 + level * 3);
      gems += 3;
      showToast('⭐ ¡Nivel ' + level + '! +3 gemas');
      // Desbloqueo de tanques por evolución
      Object.keys(TANKS).forEach(function(k) {
        const t = TANKS[k];
        if (!t.adminOnly && t.levelReq > 0 && t.levelReq <= level && !ownedTanks[k]) {
          ownedTanks[k] = true;
          showToast('🎁 ¡' + t.name + ' desbloqueado!');
        }
      });
      updateUI();
      setTimeout(function() { levelUpPending = false; }, 1000);
      saveGame();
    }

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.022;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = 0; i < stars.length; i++) stars[i].twinkle += stars[i].speed;
  }

  function gameOver() {
    player.hp = 0;
    gameActive = false;
    playTone(300, 0.3, 'sawtooth', 0.15, 150);
    saveGame();
    setTimeout(function() {
      alert('💀 Has caído.\nNivel: ' + level + '\nBajas: ' + totalKills);
      resetGame();
    }, 400);
  }

  // ==================== ENEMIGOS ====================
  function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 50;
    if (side === 0) { x = Math.random() * MAP_W; y = -margin; }
    else if (side === 1) { x = MAP_W + margin; y = Math.random() * MAP_H; }
    else if (side === 2) { x = Math.random() * MAP_W; y = MAP_H + margin; }
    else { x = -margin; y = Math.random() * MAP_H; }
    const hp = (15 + level * 4) * MODES[currentMode].enemyHp;
    enemies.push({
      x, y, radius: 14 + Math.random() * 6,
      hp, maxHp: hp,
      speed: 1.2 + Math.random() * 0.8 + level * 0.1,
      color: 'hsl(' + (Math.random() * 20 + 340) + ', 80%, 60%)'
    });
  }

  function addHitParticles(x, y, color, count) {
    count = count || 5;
    if (particles.length > 250) return;
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
        life: 1.0, color: color || '#ffaa66', size: 2.5 + Math.random() * 3
      });
    }
  }

  // ==================== DRAW ====================
  function draw() {
    const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, '#0c121c'); bgGrad.addColorStop(0.5, '#070b12'); bgGrad.addColorStop(1, '#030507');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Estrellas
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.fillStyle = '#aaccff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    // Rejilla
    ctx.strokeStyle = 'rgba(60, 110, 180, 0.06)'; ctx.lineWidth = 1;
    for (let x = 0; x < MAP_W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke(); }
    for (let y = 0; y < MAP_H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke(); }

    // Borde
    ctx.strokeStyle = 'rgba(100, 160, 255, 0.3)'; ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, MAP_W, MAP_H);

    // Paredes
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      const grad = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      grad.addColorStop(0, '#2a3a5a'); grad.addColorStop(1, '#1a2a4a');
      ctx.fillStyle = grad; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    // Comida
    for (let i = 0; i < foodItems.length; i++) {
      const f = foodItems[i];
      const s = f.radius + Math.sin(f.pulse) * 1.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, s, 0, Math.PI * 2);
      ctx.fillStyle = f.color;
      ctx.shadowBlur = 10; ctx.shadowColor = f.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Enemigos
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const eg = ctx.createRadialGradient(e.x - e.radius * 0.3, e.y - e.radius * 0.3, 2, e.x, e.y, e.radius);
      eg.addColorStop(0, '#ff6b8a'); eg.addColorStop(0.7, e.color); eg.addColorStop(1, '#5a0a1a');
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = eg; ctx.fill();
      ctx.strokeStyle = 'rgba(255, 120, 150, 0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
      const hpPct = e.hp / e.maxHp;
      const bx = e.x - 18, by = e.y - e.radius - 14;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx - 1, by - 1, 38, 6);
      ctx.fillStyle = hpPct > 0.6 ? '#3aff7a' : (hpPct > 0.25 ? '#ffbb33' : '#ff3344');
      ctx.fillRect(bx, by, 36 * hpPct, 4);
    }

    // Bots
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      if (b.hp <= 0) continue;
      ctx.save();
      ctx.shadowBlur = 15; ctx.shadowColor = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fillStyle = b.color; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      // Cañón
      const bx = b.x + Math.cos(b.aimAngle) * (b.radius + 8);
      const by = b.y + Math.sin(b.aimAngle) * (b.radius + 8);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(bx, by);
      ctx.strokeStyle = '#aaccff'; ctx.lineWidth = 4; ctx.stroke();
      ctx.restore();
      // Barra HP
      const hpPct = b.hp / b.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(b.x - 18, b.y - b.radius - 12, 36, 5);
      ctx.fillStyle = b.color; ctx.fillRect(b.x - 18, b.y - b.radius - 12, 36 * hpPct, 5);
    }

    // Proyectiles
    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    // Partículas
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Rayo
    if (rayEffect.active) {
      const t = rayEffect.timer / rayEffect.duration;
      const alpha = Math.min(1, t * 1.8);
      const color = rayEffect.color || '#7df9ff';
      for (let r = 0; r < rayEffect.rays.length; r++) {
        const angle = rayEffect.rays[r];
        const rayEnd = getRayEndWithWalls(player.x, player.y, angle, player.rayRange);
        ctx.save();
        ctx.globalAlpha = alpha * 0.3; ctx.strokeStyle = color;
        ctx.lineWidth = player.rayWidth * 2 * (0.5 + 0.5 * t);
        ctx.lineCap = 'round'; ctx.shadowBlur = 30; ctx.shadowColor = color;
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(rayEnd.x, rayEnd.y); ctx.stroke();
        ctx.globalAlpha = alpha; ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(1.5, player.rayWidth / 2.5 * t);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(rayEnd.x, rayEnd.y); ctx.stroke();
        ctx.restore();
      }
    }

    // Jugador
    if (player) {
      ctx.save();
      ctx.shadowColor = godMode ? '#ffdd00' : (player.tankKey.startsWith('admin') ? '#ff0000' : '#2ad4ff');
      ctx.shadowBlur = 25;
      const pg = ctx.createRadialGradient(player.x - 5, player.y - 5, 2, player.x, player.y, player.radius);
      pg.addColorStop(0, '#8fdcff');
      pg.addColorStop(0.5, godMode ? '#ffcc33' : (player.tankKey.startsWith('admin') ? '#ff4444' : '#2b8cff'));
      pg.addColorStop(1, '#0a2a5a');
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = pg; ctx.fill();
      ctx.strokeStyle = godMode ? '#ffe680' : '#7dd4ff'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();

      // Cañón
      const ang = player.aimAngle;
      const tipX = player.x + Math.cos(ang) * (player.radius + 14 - player.recoil);
      const tipY = player.y + Math.sin(ang) * (player.radius + 14 - player.recoil);
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(tipX, tipY);
      ctx.lineWidth = 8; ctx.strokeStyle = '#1a3a6a'; ctx.lineCap = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(tipX, tipY);
      ctx.lineWidth = 3; ctx.strokeStyle = player.isCharging ? '#ffdd66' : '#7dd4ff'; ctx.stroke();
    }

    ctx.restore();

    // HUD
    if (player) {
      ctx.font = 'bold 10px "Segoe UI", monospace'; ctx.textAlign = 'center';
      const px = player.x - camera.x, py = player.y - camera.y;
      ctx.fillStyle = '#88aadd';
      ctx.fillText(RAILGUNS[currentRailgunKey].name, px, py - player.radius - 18);
    }

    // Barra XP
    const xpPct = xp / xpToNext;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(8, H - 14, W - 16, 7);
    const xg = ctx.createLinearGradient(8, 0, W - 8, 0);
    xg.addColorStop(0, '#3a8eff'); xg.addColorStop(1, '#7df9ff');
    ctx.fillStyle = xg; ctx.fillRect(8, H - 14, (W - 16) * xpPct, 7);
    ctx.strokeStyle = 'rgba(120, 180, 255, 0.4)'; ctx.lineWidth = 1; ctx.strokeRect(8, H - 14, W - 16, 7);
    ctx.font = 'bold 7px "Segoe UI", monospace'; ctx.fillStyle = '#b8d4ff';
    ctx.fillText('XP ' + xp + '/' + xpToNext, W / 2, H - 7);

    drawMinimap();
  }

  function drawMinimap() {
    mctx.clearRect(0, 0, 130, 130);
    mctx.fillStyle = 'rgba(5, 10, 18, 0.8)'; mctx.fillRect(0, 0, 130, 130);
    const sx = 130 / MAP_W, sy = 130 / MAP_H;
    mctx.fillStyle = 'rgba(60, 100, 160, 0.6)';
    for (let i = 0; i < walls.length; i++) mctx.fillRect(walls[i].x * sx, walls[i].y * sy, walls[i].w * sx, walls[i].h * sy);
    mctx.fillStyle = 'rgba(255, 200, 50, 0.6)';
    for (let i = 0; i < foodItems.length; i++) mctx.fillRect(foodItems[i].x * sx - 1, foodItems[i].y * sy - 1, 2, 2);
    mctx.fillStyle = '#ff6688';
    for (let i = 0; i < enemies.length; i++) mctx.fillRect(enemies[i].x * sx - 1, enemies[i].y * sy - 1, 2, 2);
    for (let i = 0; i < bots.length; i++) {
      mctx.fillStyle = bots[i].color;
      mctx.beginPath(); mctx.arc(bots[i].x * sx, bots[i].y * sy, 2, 0, Math.PI * 2); mctx.fill();
    }
    if (player) {
      mctx.fillStyle = '#4df0ff';
      mctx.beginPath(); mctx.arc(player.x * sx, player.y * sy, 2.5, 0, Math.PI * 2); mctx.fill();
    }
    mctx.strokeStyle = 'rgba(100, 180, 255, 0.4)'; mctx.lineWidth = 1; mctx.strokeRect(0, 0, 130, 130);
  }

  // ==================== UI ====================
  function updateUI() {
    levelSpan.textContent = level;
    gemDisplay.textContent = gems;
    shopGemCount.textContent = gems;
    if (player) {
      hpFillSpan.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
    }
  }

  function resetGame() {
    gameActive = true; level = 1; xp = 0; xpToNext = 10;
    enemies = []; bots = []; particles = []; projectiles = [];
    player = createPlayer();
    godMode = false; regenAccumulator = 0; levelUpPending = false;
    generateWalls(); generateFood(); spawnBotsForMode();
    updateUI(); renderUpgrades();
    saveGame();
  }

  // ==================== RENDER TANQUES ====================
  function renderTanks() {
    tanksGrid.innerHTML = '';
    tankLevelReq.textContent = level;
    Object.keys(TANKS).forEach(function(key) {
      const t = TANKS[key];
      if (t.adminOnly && !adminUnlocked) return;
      const owned = ownedTanks[key] || t.adminOnly;
      const levelOk = level >= t.levelReq;
      const active = currentTankKey === key;
      const card = document.createElement('div');
      card.className = 'tank-card' + (active ? ' active' : '') + ((!owned || !levelOk) ? ' locked' : '');
      card.innerHTML =
        ((!owned || !levelOk) ? '<div class="tank-lock">🔒</div>' : '') +
        '<div class="tank-icon">' + t.icon + '</div>' +
        '<div class="tank-name">' + t.name + '</div>' +
        '<div class="tank-rarity rarity-' + t.rarity + '">' + t.rarity + '</div>' +
        '<div class="tank-level">Nv. ' + t.levelReq + '</div>';
      card.addEventListener('click', function() {
        if (!owned) { showToast('🔒 Consíguelo en cofres'); return; }
        if (!levelOk) { showToast('🔒 Nivel ' + t.levelReq); return; }
        applyTankToPlayer(key);
      });
      tanksGrid.appendChild(card);
    });
  }

  // ==================== RENDER MODOS ====================
  function renderModes() {
    modesGrid.innerHTML = '';
    Object.keys(MODES).forEach(function(key) {
      const m = MODES[key];
      const active = currentMode === key;
      const card = document.createElement('div');
      card.className = 'mode-card' + (active ? ' active' : '');
      card.innerHTML = '<div class="mode-icon">' + m.icon + '</div><div class="mode-name">' + m.name + '</div><div class="mode-desc">' + m.desc + '</div>';
      card.addEventListener('click', function() {
        currentMode = key;
        modesModal.classList.remove('open');
        resetGame();
        showToast('🎮 ' + m.name);
      });
      modesGrid.appendChild(card);
    });
  }

  // ==================== RENDER COFRES ====================
  function renderShop() {
    shopGrid.innerHTML = '';
    CHESTS.forEach(function(c) {
      const canAfford = gems >= c.price;
      const card = document.createElement('div');
      card.className = 'chest-card' + (canAfford ? '' : ' locked');
      card.innerHTML = '<div class="chest-icon">' + c.icon + '</div><div class="chest-name">' + c.name + '</div><div class="chest-price">' + c.price + '</div>';
      card.addEventListener('click', function() {
        if (canAfford) buyChest(c);
        else showToast('💎 Faltan gemas');
      });
      shopGrid.appendChild(card);
    });
  }

  function buyChest(chest) {
    if (gems < chest.price) return;
    gems -= chest.price; updateUI();
    shopModal.classList.remove('open'); openChest(chest);
  }

  function openChest(chest) {
    chestModal.classList.add('open');
    chestOpening.innerHTML = '<div class="big-icon">' + chest.icon + '</div><div style="color:#97b9e0;margin-top:0.6rem;font-size:0.85rem;">Abriendo...</div>';
    setTimeout(function() {
      const total = chest.drops.reduce(function(s, d) { return s + d.weight; }, 0);
      let roll = Math.random() * total;
      let drop = chest.drops[0];
      for (let i = 0; i < chest.drops.length; i++) {
        roll -= chest.drops[i].weight;
        if (roll <= 0) { drop = chest.drops[i]; break; }
      }
      let html = '';
      if (drop.type === 'gems') {
        gems += drop.amount;
        html = '<div class="big-icon">💎</div><div class="reward-display">+' + drop.amount + ' GEMAS</div>';
      } else if (drop.type === 'tank') {
        if (drop.key === 'railgun_triple') {
          if (!ownedTanks.railgun_triple) {
            ownedTanks.railgun_triple = true;
            currentRailgunKey = 'triple';
            html = '<div class="big-icon">⚡⚡⚡</div><div class="reward-display" style="color:#ffd700">¡RAILGUN TRIPLE!</div><div class="reward-sub">Secreto desbloqueado</div>';
          } else {
            gems += 100;
            html = '<div class="big-icon">💎</div><div class="reward-display">+100 gemas</div>';
          }
        } else {
          const t = TANKS[drop.key];
          if (t && !ownedTanks[drop.key]) {
            ownedTanks[drop.key] = true;
            html = '<div class="big-icon">' + t.icon + '</div><div class="reward-display">¡' + t.name + '!</div><div class="reward-sub">' + t.rarity.toUpperCase() + '</div>';
          } else {
            gems += 30;
            html = '<div class="big-icon">💎</div><div class="reward-display">Repetido +30</div>';
          }
        }
      }
      chestOpening.innerHTML = html + '<button class="admin-btn good" style="margin-top:1rem;width:auto;padding:0.4rem 1.2rem;" id="chestAccept">✓</button>';
      playTone(523, 0.15, 'triangle', 0.15, 1046);
      updateUI(); saveGame();
      document.getElementById('chestAccept').addEventListener('click', function() { chestModal.classList.remove('open'); });
    }, 1000);
  }

  // ==================== RENDER MEJORAS ====================
  function renderUpgrades() {
    upgradeBar.innerHTML = '';
    Object.keys(UPGRADES_DEF).forEach(function(key) {
      const def = UPGRADES_DEF[key];
      const lvl = upgrades[key];
      const maxed = lvl >= def.maxLevel;
      const cost = getUpgradeCost(key);
      const btn = document.createElement('div');
      btn.className = 'upgrade-btn' + (maxed ? ' maxed' : '');
      btn.innerHTML = '<div class="upg-icon">' + def.icon + '</div><div class="upg-cost">' + (maxed ? 'MAX' : cost) + '</div>';
      btn.title = def.name + ' · ' + def.effect + ' · Nivel ' + lvl + '/' + def.maxLevel;
      btn.addEventListener('click', function() {
        if (maxed) { showToast('Máximo alcanzado'); return; }
        if (gems < cost) { showToast('💎 Necesitas ' + cost + ' gemas'); return; }
        gems -= cost;
        upgrades[key]++;
        updateUI(); renderUpgrades();
        // Recalcular stats del jugador
        const newP = createPlayer();
        newP.x = player.x; newP.y = player.y; newP.hp = Math.min(player.hp, newP.maxHp);
        player = newP;
        showToast('✅ ' + def.name + ' mejorado');
        saveGame();
      });
      upgradeBar.appendChild(btn);
    });
  }

  // ==================== JOYSTICKS ====================
  function setupJoystick(zone, knob, onMove, onEnd) {
    let active = false, startX = 0, startY = 0;
    const maxDist = 32;
    zone.addEventListener('touchstart', function(e) {
      e.preventDefault(); active = true;
      const t = e.touches[0];
      const r = zone.getBoundingClientRect();
      startX = r.left + r.width / 2;
      startY = r.top + r.height / 2;
      handleMove(t.clientX, t.clientY);
    }, { passive: false });
    zone.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!active) return;
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    zone.addEventListener('touchend', function(e) {
      e.preventDefault(); active = false;
      knob.style.transform = 'translate(-50%, -50%)';
      onEnd();
    }, { passive: false });
    zone.addEventListener('touchcancel', function() {
      active = false;
      knob.style.transform = 'translate(-50%, -50%)';
      onEnd();
    }, { passive: false });
    function handleMove(cx, cy) {
      let dx = cx - startX, dy = cy - startY;
      const d = Math.hypot(dx, dy);
      if (d > maxDist) { dx = (dx / d) * maxDist; dy = (dy / d) * maxDist; }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      onMove(dx, dy);
    }
  }

  // Joystick izquierdo: movimiento
  setupJoystick(joystickLeft, knobLeft, function(dx, dy) {
    const dz = 10;
    keys.a = dx < -dz; keys.d = dx > dz;
    keys.w = dy < -dz; keys.s = dy > dz;
  }, function() {
    keys.a = keys.d = keys.w = keys.s = false;
  });

  // Joystick derecho: apuntar y disparar
  setupJoystick(joystickRight, knobRight, function(dx, dy) {
    if (Math.hypot(dx, dy) > 10) {
      joystickRightActive = true;
      aimAngleJoy = Math.atan2(dy, dx);
    }
  }, function() {
    joystickRightActive = false;
  });

  // PC: clic para disparar
  canvas.addEventListener('mousemove', function(e) {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * (W / r.width);
    mouseY = (e.clientY - r.top) * (H / r.height);
  });
  canvas.addEventListener('mousedown', function() { mouseDown = true; initAudio(); });
  canvas.addEventListener('mouseup', function() { mouseDown = false; });
  canvas.addEventListener('mouseleave', function() { mouseDown = false; });
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  window.addEventListener('keydown', function(e) {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') keys.w = true;
    if (k === 'a' || k === 'arrowleft') keys.a = true;
    if (k === 's' || k === 'arrowdown') keys.s = true;
    if (k === 'd' || k === 'arrowright') keys.d = true;
  });
  window.addEventListener('keyup', function(e) {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') keys.w = false;
    if (k === 'a' || k === 'arrowleft') keys.a = false;
    if (k === 's' || k === 'arrowdown') keys.s = false;
    if (k === 'd' || k === 'arrowright') keys.d = false;
  });

  // ==================== BOTONES HUD ====================
  restartBtn.addEventListener('click', function() { resetGame(); });
  shopBtn.addEventListener('click', function() { shopModal.classList.add('open'); renderShop(); });
  tanksBtn.addEventListener('click', function() { tanksModal.classList.add('open'); renderTanks(); });
  modesBtn.addEventListener('click', function() { modesModal.classList.add('open'); renderModes(); });
  document.querySelectorAll('[data-close]').forEach(function(btn) {
    btn.addEventListener('click', function() { document.getElementById(btn.getAttribute('data-close')).classList.remove('open'); });
  });
  [shopModal, tanksModal, modesModal, chestModal].forEach(function(m) {
    m.addEventListener('click', function(e) { if (e.target === m) m.classList.remove('open'); });
  });

  // ==================== ADMIN ====================
  adminToggle.addEventListener('click', function() {
    if (!adminUnlocked) {
      if (gems >= 100) {
        gems -= 100; adminUnlocked = true; updateUI();
        showToast('🔨 Admin desbloqueado');
        adminPanel.classList.add('open');
        renderAdminTanks();
        saveGame();
      } else {
        showToast('💎 Necesitas 100 gemas');
      }
    } else {
      adminPanel.classList.toggle('open');
      if (adminPanel.classList.contains('open')) renderAdminTanks();
    }
  });
  adminClose.addEventListener('click', function() { adminPanel.classList.remove('open'); });

  function renderAdminTanks() {
    adminTankList.innerHTML = '';
    Object.keys(TANKS).forEach(function(key) {
      const t = TANKS[key];
      if (!t.adminOnly) return;
      const btn = document.createElement('button');
      btn.className = 'weapon-btn';
      btn.textContent = t.icon + ' ' + t.name;
      btn.addEventListener('click', function() {
        ownedTanks[key] = true;
        currentTankKey = key;
        const newP = createPlayer();
        newP.x = player.x; newP.y = player.y;
        player = newP;
        showToast('👑 ' + t.name + ' equipado');
        updateUI(); saveGame();
      });
      adminTankList.appendChild(btn);
    });
  }

  document.getElementById('admLevelUp').addEventListener('click', function() {
    level++; gems += 5; updateUI(); showToast('⭐ Nivel ' + level);
    Object.keys(TANKS).forEach(function(k) {
      const t = TANKS[k];
      if (!t.adminOnly && t.levelReq > 0 && t.levelReq <= level && !ownedTanks[k]) {
        ownedTanks[k] = true; showToast('🎁 ' + t.name);
      }
    });
    saveGame();
  });
  document.getElementById('admAddGems').addEventListener('click', function() { gems += 100; updateUI(); showToast('💎 +100'); saveGame(); });
  document.getElementById('admUnlockAll').addEventListener('click', function() {
    Object.keys(TANKS).forEach(function(k) { ownedTanks[k] = true; });
    showToast('🔓 Todo desbloqueado'); saveGame();
  });
  document.getElementById('admGodMode').addEventListener('click', function() {
    godMode = !godMode;
    this.style.background = godMode ? '#4a3a0a' : '#2a1a1a';
    this.textContent = godMode ? '🛡️ Dios: ON' : '🛡️ Modo Dios';
  });
  document.getElementById('admReset').addEventListener('click', function() { resetGame(); });

  // ==================== BUCLE ====================
  let lastTime = 0;
  const FRAME_INTERVAL = 1000 / 60;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!ts) ts = performance.now();
    const delta = ts - lastTime;
    if (delta < FRAME_INTERVAL - 1) return;
    lastTime = ts - (delta % FRAME_INTERVAL);
    update();
    draw();
  }

  // ==================== INIT ====================
  const save = loadSave();
  if (save) {
    gems = save.gems || 0;
    ownedTanks = save.ownedTanks || { base: true };
    adminUnlocked = save.adminUnlocked || false;
    currentTankKey = save.currentTankKey || 'base';
    currentMode = save.currentMode || 'survival';
    bestLevel = save.bestLevel || 1;
    totalKills = save.totalKills || 0;
    if (save.upgrades) Object.keys(save.upgrades).forEach(function(k) { if (upgrades[k] !== undefined) upgrades[k] = save.upgrades[k]; });
    ownedTanks.base = true;
    if (ownedTanks.railgun_triple) currentRailgunKey = 'triple';
    showToast('💾 Partida cargada');
  }

  resizeCanvas();
  initStars();
  resetGame();
  renderUpgrades();
  requestAnimationFrame(loop);
  window.addEventListener('beforeunload', saveGame);
  setInterval(saveGame, 30000);
};
</script>
</body>
</html>
