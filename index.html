<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>⚡ TANK ARENA v5</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05070a; font-family: 'Segoe UI', system-ui, monospace;
    overflow: hidden; touch-action: none; position: fixed; inset: 0;
  }
  body { display: flex; align-items: center; justify-content: center; background: #05070a; }

  /* LOCK */
  #lockScreen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, #0c1420, #030507 80%); padding: 1rem; }
  #lockScreen.hidden { display: none; }
  .lock-box { background: linear-gradient(160deg, #121a28, #080b11); border: 1px solid #2a4a7a; border-radius: 20px; padding: 2rem 1.5rem; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 0 60px rgba(40,120,255,0.25); }
  .lock-icon { font-size: 3.5rem; margin-bottom: 1rem; }
  .lock-title { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; color: #aad0ff; margin-bottom: 0.5rem; }
  .lock-input { width: 100%; background: #0a0e14; border: 2px solid #2a4a7a; border-radius: 12px; padding: 0.8rem; color: #c8deff; font-size: 1rem; text-align: center; letter-spacing: 3px; outline: none; margin: 1rem 0; }
  .lock-btn { width: 100%; background: linear-gradient(180deg, #2e5a8a, #1a3350); border: 1px solid #7df9ff; color: #fff; font-weight: bold; padding: 0.8rem; border-radius: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
  .lock-err { color: #ff6666; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem; }

  /* GAME */
  #gameContainer { display: none; width: 100%; height: 100%; }
  #gameContainer.visible { display: block; }
  .game-wrapper { position: relative; width: 100vw; height: 100vh; max-width: 1600px; max-height: 1000px; display: flex; flex-direction: column; }
  @media (min-width: 800px) { .game-wrapper { border-radius: 18px; width: 98vw; height: 96vh; } }
  .canvas-container { position: relative; flex: 1; overflow: hidden; background: #06090e; border-radius: 10px 10px 0 0; }

  /* HUD NUEVA */
  .hud-top {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 6px; z-index: 3; pointer-events: none;
  }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
  .hud-stat {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(180deg, rgba(20,28,40,0.9), rgba(11,17,24,0.9));
    border: 1px solid rgba(80,140,220,0.4);
    padding: 3px 10px; border-radius: 8px;
    font-size: 0.72rem; font-weight: 700; color: #c8deff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    min-width: 80px;
  }
  .hud-stat.level { color: #ffd966; border-color: rgba(150,120,50,0.5); }
  .hud-stat.gem { color: #d4a0ff; border-color: rgba(140,80,200,0.5); }
  .hud-stat.xp { color: #7df9ff; border-color: rgba(60,140,200,0.5); }

  .hud-btn-row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
  .hud-btn {
    background: linear-gradient(180deg, rgba(26,42,62,0.95), rgba(15,26,40,0.95));
    border: 1px solid rgba(80,140,220,0.5); color: #b8d4ff;
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .hud-btn:active { transform: scale(0.92); background: rgba(60,120,200,0.6); }

  /* BARRA HP flotante */
  .hp-floating {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 18px;
    background: rgba(10,14,20,0.85);
    border: 1px solid rgba(255,80,100,0.5);
    border-radius: 10px; overflow: hidden; z-index: 3;
    box-shadow: 0 0 15px rgba(255,60,80,0.3);
  }
  .hp-floating-fill {
    height: 100%; background: linear-gradient(90deg, #ff1f4b, #ff8a5c);
    transition: width 0.15s ease;
  }
  .hp-floating-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: bold; color: #fff; text-shadow: 0 0 5px #000;
  }

  /* BOTONES INFERIORES (upgrades) */
  .bottom-bar {
    position: relative; background: linear-gradient(180deg, #0f141c, #080b10);
    border-top: 1px solid rgba(80,140,220,0.2);
    padding: 6px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .upgrade-row {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .upgrade-row::-webkit-scrollbar { display: none; }
  .upg-btn {
    flex: 0 0 auto;
    background: linear-gradient(180deg, #1a2a3e, #0f1825);
    border: 1px solid #3a5a8a; color: #c8deff;
    min-width: 52px; height: 52px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.55rem; font-weight: bold; cursor: pointer;
    padding: 2px;
    transition: all 0.15s;
  }
  .upg-btn:active { transform: scale(0.92); }
  .upg-btn.maxed { opacity: 0.4; }
  .upg-btn.no-xp { border-color: #8a2e2e; opacity: 0.55; }
  .upg-btn .upg-icon { font-size: 1.2rem; line-height: 1; }
  .upg-btn .upg-name { font-size: 0.5rem; margin-top: 1px; color: #97b9e0; }
  .upg-btn .upg-cost { font-size: 0.55rem; color: #7df9ff; font-weight: bold; }

  /* MODALES */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2,4,8,0.94); backdrop-filter: blur(8px);
    display: none; justify-content: center; align-items: center; z-index: 15; padding: 0.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #121a28, #080b11);
    border-radius: 16px; border: 1px solid #2a4a7a;
    max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto;
    padding: 1rem; color: #c8deff;
    box-shadow: 0 0 60px rgba(40,120,255,0.2), 0 25px 50px black;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid #2a4a7a; }
  .modal-title { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: #aad0ff; font-weight: bold; }
  .close-btn { background: #2a1a1a; border: 1px solid #8a2e2e; color: #ffb8b8; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; font-weight: bold; cursor: pointer; }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.6rem; }
  .chest-card { background: linear-gradient(160deg, #1a2438, #0d1420); border-radius: 12px; border: 2px solid #3a5a8a; padding: 0.9rem 0.5rem; text-align: center; cursor: pointer; }
  .chest-card:active { transform: scale(0.96); }
  .chest-card .chest-icon { font-size: 2.2rem; }
  .chest-card .chest-name { font-size: 0.82rem; font-weight: 700; color: #fff; }
  .chest-card .chest-price { display: inline-block; background: #5a2e8a; color: #e8c8ff; padding: 0.2rem 0.7rem; border-radius: 12px; font-weight: bold; font-size: 0.75rem; margin-top: 0.3rem; }
  .chest-card.locked { opacity: 0.5; }

  .tanks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5rem; }
  .tank-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 10px; border: 2px solid #3a5a8a;
    padding: 0.7rem 0.4rem; text-align: center; cursor: pointer;
    position: relative;
  }
  .tank-card:active { transform: scale(0.96); }
  .tank-card.active { border-color: #7df9ff; box-shadow: 0 0 25px #3e7eff; }
  .tank-card.locked { opacity: 0.5; }
  .tank-card .tank-icon { font-size: 1.8rem; }
  .tank-card .tank-name { font-size: 0.72rem; font-weight: 700; color: #fff; margin-top: 2px; }
  .tank-card .tank-weapon { font-size: 0.55rem; color: #7df9ff; margin-top: 2px; font-weight: bold; }
  .tank-card .tank-level { font-size: 0.55rem; color: #97b9e0; }
  .rarity-comun { color: #8a9ab0; } .rarity-raro { color: #5f9eff; }
  .rarity-epico { color: #c77dff; } .rarity-legendario { color: #ffd966; }
  .rarity-secreto { color: #ff5c8a; } .rarity-exotico { color: #4dffb8; }
  .rarity-mitico { color: #ff4dff; } .rarity-admin { color: #ff0000; text-shadow: 0 0 8px #ff0000; }
  .tank-card .tank-lock { position: absolute; top: 3px; right: 3px; font-size: 0.7rem; }

  .modes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
  .mode-card { background: linear-gradient(160deg, #1a2438, #0d1420); border-radius: 12px; border: 2px solid #3a5a8a; padding: 1rem 0.6rem; text-align: center; cursor: pointer; }
  .mode-card:active { transform: scale(0.96); }
  .mode-card.active { border-color: #7df9ff; box-shadow: 0 0 25px #3e7eff; }
  .mode-card .mode-icon { font-size: 2.2rem; }
  .mode-card .mode-name { font-size: 0.9rem; font-weight: 700; color: #fff; }
  .mode-card .mode-desc { font-size: 0.72rem; color: #97b9e0; line-height: 1.3; margin-top: 0.3rem; }

  /* ADMIN */
  .admin-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 360px; max-width: 94vw;
    background: linear-gradient(160deg, #0f131c, #080b11);
    border: 1px solid #8a2e2e; border-radius: 16px; padding: 1rem; z-index: 20;
    color: #ffd8d8; display: none; font-size: 0.75rem; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 0 60px rgba(255,60,60,0.3), 0 25px 50px black;
  }
  .admin-panel.open { display: block; }
  .admin-panel h3 { margin: 0 0 0.7rem 0; color: #ff6b6b; font-size: 0.95rem; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; margin-bottom: 0.4rem; }
  .admin-row label { flex: 1; color: #ffb8b8; font-size: 0.72rem; }
  .admin-row input { width: 60px; background: #1a1f2b; border: 1px solid #8a2e2e; color: #fff; padding: 0.2rem; border-radius: 5px; font-size: 0.72rem; }
  .admin-btn { background: linear-gradient(180deg, #2a1a1a, #180d0d); border: 1px solid #8a2e2e; color: #ffb8b8; padding: 0.35rem 0.6rem; border-radius: 6px; font-weight: bold; font-size: 0.72rem; width: 100%; margin-top: 0.3rem; cursor: pointer; }
  .admin-btn.good { background: linear-gradient(180deg, #0f2a1a, #081a10); border-color: #2e8a5a; color: #b8ffd8; }
  .admin-btn.danger { background: linear-gradient(180deg, #4a1010, #2a0808); border-color: #ff2e2e; }
  .admin-section { border-top: 1px solid #3a1b1b; margin-top: 0.7rem; padding-top: 0.7rem; }
  .admin-section-title { color: #ff8a8a; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.4rem; font-weight: bold; }
  .weapon-btn { background: linear-gradient(180deg, #14202e, #0a1118); border: 1px solid #2e4a7a; color: #b8d4ff; padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.7rem; margin: 0 0.2rem 0.3rem 0; font-weight: 600; cursor: pointer; }

  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(180deg, #1a2e4a, #0d1828); border: 1px solid #5f9eff;
    border-radius: 10px; padding: 0.5rem 1.2rem; color: #c8deff; font-weight: bold;
    z-index: 30; opacity: 0; transition: all 0.3s; pointer-events: none; font-size: 0.8rem;
    box-shadow: 0 0 25px rgba(80,160,255,0.6);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .chest-opening { display: flex; flex-direction: column; align-items: center; padding: 1rem; text-align: center; }
  .chest-opening .big-icon { font-size: 4rem; animation: chestShake 0.6s ease-in-out infinite; }
  @keyframes chestShake { 0%,100%{transform:rotate(-5deg) scale(1);} 50%{transform:rotate(5deg) scale(1.05);} }
  .reward-display { font-size: 1.05rem; font-weight: bold; color: #ffd966; margin-top: 0.6rem; }
  .reward-sub { font-size: 0.78rem; color: #97b9e0; margin-top: 0.3rem; }

  /* JOYSTICKS */
  .joystick {
    position: absolute; bottom: 20px; width: 120px; height: 120px;
    border-radius: 50%; display: none; z-index: 5; touch-action: none;
  }
  .joystick.active { display: block; }
  .joystick.left { left: 20px; background: radial-gradient(circle, rgba(30,60,100,0.4), rgba(20,40,70,0.2)); border: 2px solid rgba(100,180,255,0.5); }
  .joystick.right { right: 20px; background: radial-gradient(circle, rgba(100,30,30,0.4), rgba(70,20,20,0.2)); border: 2px solid rgba(255,120,120,0.5); }
  .joystick-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 50px; height: 50px; border-radius: 50%; pointer-events: none;
  }
  .joystick.left .joystick-knob { background: radial-gradient(circle, #4df0ff, #1a6aaa); box-shadow: 0 0 25px #4df0ff; }
  .joystick.right .joystick-knob { background: radial-gradient(circle, #ff6666, #aa1a1a); box-shadow: 0 0 25px #ff6666; }

  /* MINIMAPA circular */
  .minimap {
    position: absolute; top: 8px; right: 50%; transform: translateX(50%);
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(5,10,18,0.85); border: 2px solid rgba(80,140,255,0.4);
    z-index: 4; pointer-events: none;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
  }
  @media (min-width: 800px) { .minimap { width: 130px; height: 130px; } }

  .fs-btn {
    position: absolute; bottom: 150px; right: 15px;
    background: rgba(30,45,70,0.9); border: 1px solid rgba(100,160,255,0.5);
    color: #b8d4ff; width: 40px; height: 40px; border-radius: 50%;
    font-size: 1.1rem; z-index: 6; cursor: pointer;
  }

  /* DEATH */
  .death-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  .death-overlay.show { display: flex; }
  .death-icon { font-size: 6rem; animation: deathShake 0.5s ease infinite alternate; filter: drop-shadow(0 0 30px #f00); }
  @keyframes deathShake { from { transform: rotate(-5deg) scale(1); } to { transform: rotate(5deg) scale(1.1); } }
  .death-title { font-size: 2.2rem; color: #ff4444; font-weight: bold; text-transform: uppercase; letter-spacing: 4px; margin-top: 1rem; text-shadow: 0 0 20px #f00; }
  .death-stats { color: #c8deff; font-size: 1rem; margin-top: 1rem; text-align: center; line-height: 1.8; }
  .death-btn { margin-top: 1.5rem; background: linear-gradient(180deg, #2e5a8a, #1a3350); border: 1px solid #7df9ff; color: #fff; font-weight: bold; font-size: 1rem; padding: 0.8rem 2rem; border-radius: 12px; cursor: pointer; letter-spacing: 2px; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Tank Arena</div>
    <input type="password" id="passwordInput" class="lock-input" placeholder="Contraseña" autocomplete="off">
    <button id="unlockBtn" class="lock-btn">Entrar</button>
    <div id="lockError" class="lock-err"></div>
  </div>
</div>

<div id="gameContainer">
  <div class="game-wrapper">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas"></canvas>
      <canvas id="minimap" class="minimap" width="130" height="130"></canvas>
      <div class="hud-top">
        <div class="hud-left">
          <div class="hud-stat level">⭐ Nv. <span id="levelDisplay">1</span></div>
          <div class="hud-stat gem">💎 <span id="gemDisplay">0</span></div>
          <div class="hud-stat xp">✨ <span id="xpDisplay">0</span></div>
        </div>
        <div class="hud-right">
          <div class="hud-btn-row">
            <button class="hud-btn" id="modesBtn" title="Modos">🎮</button>
            <button class="hud-btn" id="tanksBtn" title="Tanque">🚀</button>
            <button class="hud-btn" id="shopBtn" title="Tienda">🛒</button>
            <button class="hud-btn" id="soundToggle" title="Sonido">🔊</button>
            <button class="hud-btn" id="adminToggle" title="Admin">🔨</button>
            <button class="hud-btn" id="restartBtn" title="Reiniciar">⟳</button>
          </div>
        </div>
      </div>
      <div class="hp-floating">
        <div class="hp-floating-fill" id="hpFill" style="width:100%"></div>
        <div class="hp-floating-label"><span id="hpText">100 / 100</span></div>
      </div>
      <button class="fs-btn" id="fullscreenBtn">⛶</button>
      <div class="joystick left" id="joystickLeft"><div class="joystick-knob" id="knobLeft"></div></div>
      <div class="joystick right" id="joystickRight"><div class="joystick-knob" id="knobRight"></div></div>
    </div>
    <div class="bottom-bar">
      <div class="upgrade-row" id="upgradeBar"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="shopModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🛒 Tienda</div><button class="close-btn" data-close="shopModal">✕</button></div>
    <div style="text-align:center;margin-bottom:0.7rem;font-size:0.9rem;">💎 <span id="shopGemCount">0</span> gemas</div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="tanksModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🚀 Tanques</div><button class="close-btn" data-close="tanksModal">✕</button></div>
    <div style="text-align:center;margin-bottom:0.5rem;font-size:0.75rem;color:#97b9e0;">
      Evolucionan al subir de nivel · Nv. actual: <span id="tankLevelReq" style="color:#7df9ff;font-weight:bold;">1</span>
    </div>
    <div class="tanks-grid" id="tanksGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="modesModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🎮 Modos</div><button class="close-btn" data-close="modesModal">✕</button></div>
    <div class="modes-grid" id="modesGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="chestModal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header"><div class="modal-title">🎁 Cofre</div><button class="close-btn" data-close="chestModal">✕</button></div>
    <div class="chest-opening" id="chestOpening"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.7rem;padding-bottom:0.5rem;border-bottom:1px solid #8a2e2e;">
    <h3 style="margin:0;">🔨 Admin</h3>
    <button id="adminClose" style="background:#2a1a1a;border:1px solid #8a2e2e;color:#ffb8b8;width:26px;height:26px;border-radius:50%;font-size:0.9rem;font-weight:bold;cursor:pointer;">✕</button>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Tanques Admin</div>
    <div id="adminTankList" style="display:flex;flex-wrap:wrap;"></div>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Bonus permanentes (gratis)</div>
    <div class="admin-row"><label>Daño +</label><input type="number" id="admDamage" value="10" min="1"><button class="admin-btn" style="width:auto" id="admApplyDamage">+</button></div>
    <div class="admin-row"><label>Velocidad +</label><input type="number" id="admSpeed" value="2" min="1"><button class="admin-btn" style="width:auto" id="admApplySpeed">+</button></div>
    <div class="admin-row"><label>HP Máx +</label><input type="number" id="admHp" value="50" min="1"><button class="admin-btn" style="width:auto" id="admApplyHp">+</button></div>
    <div class="admin-row"><label>Alcance +</label><input type="number" id="admRange" value="100" min="10"><button class="admin-btn" style="width:auto" id="admApplyRange">+</button></div>
    <div class="admin-row"><label>Cadencia +</label><input type="number" id="admFireRate" value="2" min="1"><button class="admin-btn" style="width:auto" id="admApplyFireRate">+</button></div>
    <div class="admin-row"><label>Perforación +</label><input type="number" id="admPierce" value="1" min="1"><button class="admin-btn" style="width:auto" id="admApplyPierce">+</button></div>
  </div>
  <div class="admin-section">
    <div class="admin-section-title">Trucos</div>
    <button class="admin-btn good" id="admLevelUp">⬆ Subir de nivel</button>
    <button class="admin-btn" id="admAddGems">💎 +100 gemas</button>

    destroyer:   { name: 'Destroyer',   icon: '💀', rarity: 'epico',      levelReq: 6,  weapon: 'rocket', weaponName: 'Cohetes',        color: '#ff4444', stats: { hp: 110, spd: 4,   dmg: 2,   rng: 1.2, prc: 1, body: 14, cd: 1.8 } },

    frost:       { name: 'Frost',       icon: '❄️', rarity: 'epico',      levelReq: 6,  weapon: 'ice',    weaponName: 'Cañón Hielo',    color: '#aaddff', stats: { hp: 100, spd: 4.5, dmg: 1.1, rng: 1.2, prc: 2, body: 10, cd: 1 } },

    exotic_rail: { name: 'Rail Exótico',icon: '⚡', rarity: 'exotico',    levelReq: 15, weapon: 'ray2',   weaponName: 'Rayo Doble',     color: '#ffaa00', stats: { hp: 130, spd: 4.2, dmg: 1.8, rng: 1.5, prc: 5, body: 18, cd: 0.8 } },

    admin_god:   { name: 'ADMIN DIOS',  icon: '👑', rarity: 'admin',      levelReq: 0, adminOnly: true, weapon: 'admin', weaponName: 'Juicio Divino', color: '#ffd700', stats: { hp: 500, spd: 8, dmg: 5, rng: 3, prc: 10, body: 100, cd: 0.3, dodge: 0.5 } },
    admin_void:  { name: 'ADMIN VACÍO', icon: '🕳️', rarity: 'admin',      levelReq: 0, adminOnly: true, weapon: 'void',  weaponName: 'Vacío',         color: '#222222', stats: { hp: 300, spd: 10, dmg: 4, rng: 2.5, prc: 8, body: 60, cd: 0.4, dodge: 0.4 } },
    admin_chaos: { name: 'ADMIN CAOS',  icon: '💥', rarity: 'admin',      levelReq: 0, adminOnly: true, weapon: 'chaos', weaponName: 'Caos Total',    color: '#ff0000', stats: { hp: 400, spd: 6, dmg: 6, rng: 2, prc: 12, body: 80, cd: 0.5 } }
  };

  let currentTankKey = 'base';
  let ownedTanks = { base: true };
  let adminBonuses = { dmg: 0, spd: 0, hp: 0, rng: 0, cd: 0, prc: 0 };

  // ========== MODOS ==========
  const MODES = {
    survival:  { name: 'Supervivencia', icon: '💀',   desc: 'Solo bots enemigos', bots: 8, teamMode: false },
    redVsBlue: { name: 'Rojo vs Azul',  icon: '🔴🔵', desc: 'Equipos 6 vs 6', botsPerTeam: 6, teamMode: true },
    boss:      { name: 'Jefe',          icon: '👹',   desc: 'Bots poderosos', bots: 6, teamMode: false, boss: true },
    endless:   { name: 'Infinito',      icon: '♾️',   desc: 'Bots sin fin', bots: 10, teamMode: false }
  };
  let currentMode = 'survival';

  // ========== BOT WEAPONS ==========
  const BOT_W = {
    pistol:  { name:'Pistola', color:'#ffe066', dmg:8,  spd:7,  cd:25, r:3,   spr:0.05 },
    shotgun: { name:'Escopeta',color:'#ff9a5c', dmg:5,  spd:6,  cd:50, r:3,   spr:0.4, pellets:4 },
    sniper:  { name:'Sniper',  color:'#ff5c8a', dmg:20, spd:12, cd:70, r:2.5, spr:0 },
    smg:     { name:'SMG',     color:'#7df9ff', dmg:4,  spd:8,  cd:12, r:2.5, spr:0.15 },
    rocket:  { name:'Cohete',  color:'#ff4444', dmg:15, spd:4,  cd:90, r:5,   spr:0.02, explosion:true }
  };
  const BOT_W_KEYS = Object.keys(BOT_W);

  // ========== UPGRADES (XP) ==========
  const UPGRADES = {
    maxHp:        { name:'Vida',       icon:'❤️', max:10, cost:5,  effect:'+15 HP' },
    speed:        { name:'Velocidad',  icon:'🏃', max:10, cost:5,  effect:'+0.5 spd' },
    bodyDamage:   { name:'Cuerpo',     icon:'💪', max:10, cost:6,  effect:'+5 dmg cuerpo' },
    fireRate:     { name:'Cadencia',   icon:'⚡', max:10, cost:6,  effect:'-10% cd' },
    damage:       { name:'Daño',       icon:'🔥', max:10, cost:8,  effect:'+3 dmg' },
    healthRegen:  { name:'Regen',      icon:'💚', max:10, cost:5,  effect:'+0.3 HP/s' },
    bulletSpeed:  { name:'Vel. bala',  icon:'💨', max:5,  cost:6,  effect:'+15% spd' },
    range:        { name:'Alcance',    icon:'🎯', max:10, cost:5,  effect:'+50 rng' },
    pierce:       { name:'Perforación',icon:'🗡️', max:5,  cost:10, effect:'+1 prc' }
  };
  let upgrades = {};
  Object.keys(UPGRADES).forEach(function(k) { upgrades[k] = 0; });
  function upgradeCost(key) { return UPGRADES[key].cost + upgrades[key] * 3; }

  // ========== CHESTS ==========
  const CHESTS = [
    { id:'comun', name:'Común', icon:'📦', price:25, drops:[
      { type:'gems', amount:30, weight:60 },
      { type:'tank', key:'speedy', weight:20 },
      { type:'tank', key:'heavy', weight:20 }
    ]},
    { id:'raro', name:'Raro', icon:'🎁', price:80, drops:[
      { type:'gems', amount:100, weight:50 },
      { type:'tank', key:'destroyer', weight:15 },
      { type:'tank', key:'phantom', weight:15 },
      { type:'tank', key:'frost', weight:20 }
    ]},
    { id:'epico', name:'Épico', icon:'💎', price:200, drops:[
      { type:'gems', amount:300, weight:40 },
      { type:'tank', key:'titan', weight:15 },
      { type:'tank', key:'lava', weight:15 },
      { type:'tank', key:'shadow', weight:15 },
      { type:'tank', key:'plasma', weight:15 }
    ]},
    { id:'legendario', name:'Legendario', icon:'👑', price:500, drops:[
      { type:'gems', amount:800, weight:30 },
      { type:'tank', key:'exotic_rail', weight:20 },
      { type:'tank', key:'mythic', weight:25 },
      { type:'tank', key:'plasma', weight:25 }
    ]}
  ];

  // ========== AUDIO ==========
  let audioCtx = null, soundOn = true, masterGain = null;
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.85;
        masterGain.connect(audioCtx.destination);
      } catch(e){ soundOn = false; return; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  window.addEventListener('mousedown', initAudio, { passive:true });
  window.addEventListener('touchstart', initAudio, { passive:true });

  function tone(freq, dur, type, vol, slide) {
    if (!soundOn || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, now + dur);
      g.gain.setValueAtTime(vol || 0.15, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + dur + 0.02);
    } catch(e){}
  }

  document.getElementById('soundToggle').addEventListener('click', function() {
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) initAudio();
  });

  // ========== TOAST ==========
  let toastT = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  // ========== STATE ==========
  let gems = 0, xp = 0, xpNext = 10, level = 1;
  let gameActive = true;
  let player = null;
  let bots = [], particles = [], walls = [], food = [], projectiles = [];
  let rayEffect = { active:false, timer:0, duration:8, rays:[], color:'#7df9ff' };
  let mouseX = 400, mouseY = 300, mouseDown = false;
  const keys = { w:false, a:false, s:false, d:false };
  let godMode = false, adminUnlocked = false;
  let regenAcc = 0;
  let levelUpPending = false;
  let aimJoy = 0, joyRightActive = false;
  let bestLevel = 1;

  let stars = [];
  function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) stars.push({
      x: Math.random() * MAP_W, y: Math.random() * MAP_H,
      s: Math.random() * 1.6 + 0.3, a: Math.random() * 0.5 + 0.15,
      tw: Math.random() * Math.PI * 2, sp: Math.random() * 0.02 + 0.005
    });
  }

  // ========== WALLS ==========
  function genWalls() {
    walls = [];
    for (let i = 0; i < 18; i++) {
      const w = 60 + Math.random() * 150;
      const h = 30 + Math.random() * 110;
      const x = 100 + Math.random() * (MAP_W - 200 - w);
      const y = 100 + Math.random() * (MAP_H - 200 - h);
      const px = MAP_W / 2, py = MAP_H / 2;
      if (x > px + 150 || x + w < px - 150 || y > py + 150 || y + h < py - 150) {
        walls.push({ x, y, w, h });
      }
    }
  }

  // ========== FOOD ==========
  function genFood() {
    food = [];
    for (let i = 0; i < 70; i++) {
      food.push({
        x: 100 + Math.random() * (MAP_W - 200),
        y: 100 + Math.random() * (MAP_H - 200),
        xp: 5 + Math.floor(Math.random() * 5),
        r: 8, hp: 1, color: 'hsl(' + (Math.random()*60+40) + ',90%,60%)',
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  function rectCircle(rx, ry, rw, rh, cx, cy, cr) {
    const x = Math.max(rx, Math.min(cx, rx + rw));
    const y = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - x, dy = cy - y;
    return dx*dx + dy*dy < cr*cr;
  }

  function wallCollide(e) {
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      if (rectCircle(w.x, w.y, w.w, w.h, e.x, e.y, e.radius)) {
        const cx = Math.max(w.x, Math.min(e.x, w.x + w.w));
        const cy = Math.max(w.y, Math.min(e.y, w.y + w.h));
        const dx = e.x - cx, dy = e.y - cy;
        const d = Math.hypot(dx, dy);
        if (d > 0) {
          const ov = e.radius - d;
          e.x += (dx/d) * ov;
          e.y += (dy/d) * ov;
        }
      }
    }
  }

  // ========== PLAYER ==========
  function createPlayer() {
    const t = TANKS[currentTankKey];
    const s = t.stats;
    return {
      x: MAP_W/2, y: MAP_H/2, radius: 18,
      hp: Math.round(100 * (s.hp/100) + upgrades.maxHp*15 + adminBonuses.hp),
      maxHp: Math.round(100 * (s.hp/100) + upgrades.maxHp*15 + adminBonuses.hp),
      speed: s.spd + upgrades.speed*0.5 + adminBonuses.spd,
      dmg: Math.round(12*s.dmg + upgrades.damage*3 + adminBonuses.dmg),
      range: Math.round(520*s.rng + upgrades.range*50 + adminBonuses.rng),
      rayW: 10,
      pierce: Math.round(s.prc + upgrades.pierce + adminBonuses.prc),
      cdMax: Math.max(3, Math.round(18*s.cd*(1-upgrades.fireRate*0.1) - adminBonuses.cd*0.5)),
      cdTimer: 0,
      chargeT: 18, chargeTimer: 0, isCharging: false,
      aim: 0, recoil: 0, flash: 0,
      regen: 0.3 + upgrades.healthRegen*0.3,
      bodyDmg: s.body + upgrades.bodyDamage*5,
      dodge: s.dodge || 0,
      tankKey: currentTankKey,
      weapon: t.weapon,
      weaponColor: t.color,
      team: 'blue'
    };
  }

  function evolveTank() {
    const better = Object.keys(TANKS).filter(function(k) {
      const t = TANKS[k];
      return !t.adminOnly && t.levelReq > 0 && t.levelReq <= level && t.levelReq > TANKS[currentTankKey].levelReq;
    });
    if (better.length > 0) {
      better.sort(function(a,b){ return TANKS[b].levelReq - TANKS[a].levelReq; });
      const next = better[0];
      ownedTanks[next] = true;
      currentTankKey = next;
      const np = createPlayer();
      np.x = player.x; np.y = player.y; np.hp = Math.min(player.hp, np.maxHp);
      player = np;
      toast('🚀 ¡Evolucionaste a ' + TANKS[next].name + '!');
      tone(523, 0.2, 'triangle', 0.15, 1046);
    }
  }

  function applyTank(key) {
    if (!player || !TANKS[key] || !ownedTanks[key]) return;
    if (level < TANKS[key].levelReq) { toast('🔒 Nivel ' + TANKS[key].levelReq); return; }
    currentTankKey = key;
    const np = createPlayer();
    np.x = player.x; np.y = player.y; np.hp = Math.min(player.hp, np.maxHp);
    player = np;
    toast('🚀 ' + TANKS[key].name);
    renderTanks();
    updateUI();
    save();
  }

  // ========== BOTS ==========
  function createBot(team, isBoss) {
    const wKey = BOT_W_KEYS[Math.floor(Math.random() * BOT_W_KEYS.length)];
    const hpMult = isBoss ? 3 : 1;
    return {
      x: 200 + Math.random() * (MAP_W - 400),
      y: 200 + Math.random() * (MAP_H - 400),
      radius: isBoss ? 26 : 18,
      hp: 80 * hpMult, maxHp: 80 * hpMult,
      speed: 2.5,
      team: team,
      color: team === 'red' ? '#ff4444' : '#4488ff',
      wKey: wKey, w: BOT_W[wKey],
      aim: Math.random() * Math.PI * 2,
      cd: 20 + Math.random() * 40,
      body: Math.random() * Math.PI * 2,
      isBoss: isBoss || false
    };
  }

  function spawnBots() {
    bots = [];
    const m = MODES[currentMode];
    if (m.teamMode) {
      for (let i = 0; i < m.botsPerTeam; i++) bots.push(createBot('red'));
      for (let i = 0; i < m.botsPerTeam; i++) bots.push(createBot('blue'));
    } else {
      for (let i = 0; i < m.bots; i++) bots.push(createBot('red', m.boss && i === 0));
    }
  }

  function updateBots() {
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      if (b.hp <= 0) continue;

      let closestD = Infinity, target = null;
      for (let j = 0; j < bots.length; j++) {
        if (i === j || bots[j].hp <= 0) continue;
        if (bots[j].team !== b.team) {
          const d = Math.hypot(bots[j].x-b.x, bots[j].y-b.y);
          if (d < closestD) { closestD = d; target = bots[j]; }
        }
      }
      if (player && b.team !== player.team) {
        const d = Math.hypot(player.x-b.x, player.y-b.y);
        if (d < closestD) { closestD = d; target = player; }
      }

      if (target) {
        const dx = target.x-b.x, dy = target.y-b.y;
        const d = Math.hypot(dx,dy);
        b.aim = Math.atan2(dy,dx);
        b.body = b.aim;
        if (d > 250) { b.x += (dx/d)*b.speed; b.y += (dy/d)*b.speed; }
        else if (d < 120) { b.x -= (dx/d)*b.speed*0.7; b.y -= (dy/d)*b.speed*0.7; }
        if (b.cd <= 0 && d < 450) {
          fireBotWeapon(b, b.aim);
          b.cd = b.w.cd;
        }
      } else {
        b.body += (Math.random()-0.5)*0.1;
        b.x += Math.cos(b.body)*b.speed*0.5;
        b.y += Math.sin(b.body)*b.speed*0.5;
      }
      if (b.cd > 0) b.cd--;
      wallCollide(b);
      b.x = Math.max(b.radius, Math.min(MAP_W-b.radius, b.x));
      b.y = Math.max(b.radius, Math.min(MAP_H-b.radius, b.y));
    }
  }

  function fireBotWeapon(bot, angle) {
    const w = bot.w;
    const pellets = w.pellets || 1;
    for (let i = 0; i < pellets; i++) {
      const spr = (Math.random()-0.5)*w.spr;
      const a = angle + spr;
      projectiles.push({
        x: bot.x + Math.cos(a)*(bot.radius+5),
        y: bot.y + Math.sin(a)*(bot.radius+5),
        vx: Math.cos(a)*w.spd, vy: Math.sin(a)*w.spd,
        radius: w.r, dmg: w.dmg, team: bot.team,
        color: w.color, life: 80, explosion: w.explosion || false
      });
    }
    tone(400, 0.05, 'square', 0.04, 200);
  }

  // ========== PLAYER SHOOTING (POR TANQUE) ==========
  function pointSeg(px, py, x1, y1, x2, y2) {
    const dx = x2-x1, dy = y2-y1;
    const l2 = dx*dx + dy*dy;
    let t = 0;
    if (l2 > 0) t = Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy) / l2));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  function rayEndWall(x1, y1, ang, maxR) {
    let ex = x1 + Math.cos(ang)*maxR;
    let ey = y1 + Math.sin(ang)*maxR;
    let minT = 1;
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      for (let s = 0; s <= 20; s++) {
        const t = s/20;
        const px = x1 + (ex-x1)*t;
        const py = y1 + (ey-y1)*t;
        if (px > w.x && px < w.x+w.w && py > w.y && py < w.y+w.h) {
          if (t < minT) minT = t;
          break;
        }
      }
    }
    return { x: x1+(ex-x1)*minT, y: y1+(ey-y1)*minT };
  }

  function firePlayer() {
    if (!gameActive) return;
    const t = TANKS[currentTankKey];
    const baseAng = joyRightActive ? aimJoy : Math.atan2(mouseY+camera.y-player.y, mouseX+camera.x-player.x);
    const w = t.weapon;

    playShotSound(w);
    player.recoil = 6; player.flash = 6;

    // Comportamiento SEGÚN ARMA DEL TANQUE
    if (w === 'smg') {
      for (let i = 0; i < 2; i++) {
        const spr = (Math.random()-0.5)*0.15;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(baseAng+spr)*14, vy: Math.sin(baseAng+spr)*14,
          radius: 2.5, dmg: player.dmg*0.5, team:'blue', color: t.color, life: 40
        });
      }
    } else if (w === 'shotgun') {
      for (let i = 0; i < 5; i++) {
        const spr = (Math.random()-0.5)*0.5;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(baseAng+spr)*10, vy: Math.sin(baseAng+spr)*10,
          radius: 3, dmg: player.dmg*0.35, team:'blue', color: t.color, life: 50
        });
      }
    } else if (w === 'rocket') {
      projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(baseAng)*6, vy: Math.sin(baseAng)*6,
        radius: 6, dmg: player.dmg*1.5, team:'blue', color: t.color, life: 100, explosion: true
      });
    } else if (w === 'flame') {
      for (let i = 0; i < 3; i++) {
        const spr = (Math.random()-0.5)*0.4;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(baseAng+spr)*7, vy: Math.sin(baseAng+spr)*7,
          radius: 5, dmg: player.dmg*0.3, team:'blue', color: t.color, life: 25
        });
      }
    } else if (w === 'cannon') {
      projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(baseAng)*8, vy: Math.sin(baseAng)*8,
        radius: 8, dmg: player.dmg*1.3, team:'blue', color: t.color, life: 80
      });
    } else {
      // ARMAS DE RAYO: ray1, ray2, sniper, ice, dark, plasma, rainbow, admin, void, chaos
      let rays = [baseAng];
      if (w === 'ray2') rays = [baseAng-0.12, baseAng+0.12];
      else if (w === 'rainbow') rays = [baseAng-0.15, baseAng, baseAng+0.15];
      else if (w === 'admin' || w === 'void' || w === 'chaos') rays = [baseAng-0.2, baseAng, baseAng+0.2];

      rayEffect = { active:true, timer:8, duration:8, rays:rays, color:t.color };
      for (let r = 0; r < rays.length; r++) {
        const end = rayEndWall(player.x, player.y, rays[r], player.range);
        applyRay(player.x, player.y, end.x, end.y, player.dmg * (w==='admin'||w==='void'||w==='chaos' ? 2 : 1), t.color);
      }
    }
  }

  function playShotSound(w) {
    if (w === 'smg') tone(900, 0.05, 'square', 0.15, 400);
    else if (w === 'shotgun') { tone(200, 0.2, 'sawtooth', 0.25, 40); }
    else if (w === 'rocket') tone(120, 0.3, 'sawtooth', 0.3, 60);
    else if (w === 'flame') tone(300, 0.1, 'sawtooth', 0.12, 200);
    else if (w === 'cannon') tone(150, 0.25, 'square', 0.3, 50);
    else if (w === 'sniper') { tone(1400, 0.1, 'square', 0.35, 100); tone(180, 0.3, 'sine', 0.3, 40); }
    else { tone(120, 0.3, 'sine', 0.4, 35); tone(800, 0.2, 'sawtooth', 0.2, 60); }
  }

  function applyRay(x1, y1, x2, y2, dmg, color) {
    let pierce = player.pierce;
    const hit = [];
    const cands = [];
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      if (b.hp <= 0 || b.team === 'blue') continue;
      if (pointSeg(b.x, b.y, x1, y1, x2, y2) < b.radius + player.rayW/2) {
        cands.push({ t: b, d: Math.hypot(b.x-x1, b.y-y1), type: 'bot' });
      }
    }
    for (let i = 0; i < food.length; i++) {
      const f = food[i];
      if (pointSeg(f.x, f.y, x1, y1, x2, y2) < f.r + player.rayW/2) {
        cands.push({ t: f, d: Math.hypot(f.x-x1, f.y-y1), type: 'food' });
      }
    }
    cands.sort(function(a,b){ return a.d-b.d; });
    for (let c = 0; c < cands.length; c++) {
      if (pierce <= 0) break;
      const cd = cands[c];
      if (hit.indexOf(cd.t) !== -1) continue;
      hit.push(cd.t);
      if (cd.type === 'food') {
        xp += cd.t.xp; gems += 1;
        addParticles(cd.t.x, cd.t.y, cd.t.color, 8);
        const idx = food.indexOf(cd.t);
        if (idx !== -1) food.splice(idx, 1);
        respawnFood();
      } else {
        cd.t.hp -= dmg;
        addParticles(cd.t.x, cd.t.y, color, 4);
        if (cd.t.hp <= 0) {
          const idx = bots.indexOf(cd.t);
          if (idx !== -1) bots.splice(idx, 1);
          xp += 5; gems += 2;
          addParticles(cd.t.x, cd.t.y, '#ffaa66', 10);
          if (!MODES[currentMode].teamMode) {
            setTimeout(function() { if (gameActive) bots.push(createBot('red')); }, 3000);
          }
        }
      }
      pierce--;
    }
  }

  function respawnFood() {
    setTimeout(function() {
      if (!gameActive) return;
      food.push({
        x: 100 + Math.random() * (MAP_W - 200),
        y: 100 + Math.random() * (MAP_H - 200),
        xp: 5 + Math.floor(Math.random() * 5),
        r: 8, hp: 1, color: 'hsl(' + (Math.random()*60+40) + ',90%,60%)',
        pulse: Math.random() * Math.PI * 2
      });
    }, 1500 + Math.random() * 2000);
  }

  // ========== UPDATE ==========
  function update() {
    if (!gameActive || !player) return;

    let dx = 0, dy = 0;
    if (keys.w) dy -= 1; if (keys.s) dy += 1;
    if (keys.a) dx -= 1; if (keys.d) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const l = Math.hypot(dx,dy);
      player.x += (dx/l)*player.speed;
      player.y += (dy/l)*player.speed;
    }
    wallCollide(player);
    player.x = Math.max(player.radius, Math.min(MAP_W-player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(MAP_H-player.radius, player.y));

    camera.x = Math.max(0, Math.min(MAP_W-W, player.x-W/2));
    camera.y = Math.max(0, Math.min(MAP_H-H, player.y-H/2));

    const targetAng = joyRightActive ? aimJoy : Math.atan2(mouseY+camera.y-player.y, mouseX+camera.x-player.x);
    let diff = targetAng - player.aim;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    player.aim += diff*0.3;
    if (player.recoil > 0) player.recoil *= 0.85;
    if (player.flash > 0) player.flash--;

    if (player.regen > 0 && player.hp < player.maxHp) {
      regenAcc++;
      if (regenAcc >= 60) {
        regenAcc = 0;
        player.hp = Math.min(player.maxHp, player.hp + player.regen);
        updateUI();
      }
    }

    const shouldFire = joyRightActive || mouseDown;
    if (player.cdTimer > 0) {
      player.cdTimer--;
      player.isCharging = false; player.chargeTimer = 0;
    } else if (shouldFire) {
      if (!player.isCharging) { player.isCharging = true; player.chargeTimer = 0; }
      player.chargeTimer++;
      if (player.chargeTimer >= player.chargeT) {
        firePlayer();
        player.chargeTimer = 0; player.isCharging = false;
        player.cdTimer = player.cdMax;
      }
    } else {
      player.isCharging = false; player.chargeTimer = 0;
    }

    if (rayEffect.active) { rayEffect.timer--; if (rayEffect.timer <= 0) rayEffect.active = false; }

    updateBots();

    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx; p.y += p.vy; p.life--;

      let hitW = false;
      for (let w = 0; w < walls.length; w++) {
        const wall = walls[w];
        if (p.x > wall.x && p.x < wall.x+wall.w && p.y > wall.y && p.y < wall.y+wall.h) {
          hitW = true; break;
        }
      }
      if (hitW) {
        if (p.explosion) addParticles(p.x, p.y, '#ff6600', 15);
        projectiles.splice(i, 1); continue;
      }
      if (p.life <= 0) { projectiles.splice(i, 1); continue; }

      if (p.team !== 'blue' && Math.hypot(p.x-player.x, p.y-player.y) < player.radius+p.radius) {
        if (!godMode) { player.hp -= p.dmg; updateUI(); }
        projectiles.splice(i, 1);
        if (!godMode && player.hp <= 0) { gameOver(); return; }
        continue;
      }

      let hitB = false;
      for (let b = 0; b < bots.length; b++) {
        if (bots[b].hp <= 0 || bots[b].team === p.team) continue;
        if (Math.hypot(p.x-bots[b].x, p.y-bots[b].y) < bots[b].radius+p.radius) {
          bots[b].hp -= p.dmg;
          hitB = true;
          if (bots[b].hp <= 0) {
            addParticles(bots[b].x, bots[b].y, bots[b].color, 12);
            if (p.team === 'blue') { xp += 5; gems += 2; }
          }
          break;
        }
      }
      if (hitB) { projectiles.splice(i, 1); continue; }
    }

    if (xp >= xpNext && !levelUpPending) {
      levelUpPending = true;
      level++;
      if (level > bestLevel) bestLevel = level;
      xp = 0;
      xpNext = Math.floor(10 + level*3);
      gems += 10;
      toast('⭐ ¡Nivel ' + level + '! +10 gemas');
      Object.keys(TANKS).forEach(function(k) {
        const t = TANKS[k];
        if (!t.adminOnly && t.levelReq > 0 && t.levelReq <= level && !ownedTanks[k]) ownedTanks[k] = true;
      });
      evolveTank();
      updateUI();
      setTimeout(function() { levelUpPending = false; }, 1000);
      save();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.022;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = 0; i < stars.length; i++) stars[i].tw += stars[i].sp;
  }

  function gameOver() {
    player.hp = 0;
    gameActive = false;
    tone(300, 0.3, 'sawtooth', 0.15, 150);
    tone(200, 0.5, 'sine', 0.2, 80);
    save();
    document.getElementById('deathStats').innerHTML =
      'Nivel: <b>' + level + '</b><br>Bajas: <b>' + (totalKills||0) + '</b><br>Gemas: <b>' + gems + '</b>';
    document.getElementById('deathOverlay').classList.add('show');
    document.getElementById('deathRestartBtn').onclick = function() {
      document.getElementById('deathOverlay').classList.remove('show');
      resetGame();
    };
  }
  let totalKills = 0;

  function addParticles(x, y, color, n) {
    n = n || 5;
    if (particles.length > 250) return;
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
        life: 1, color: color||'#ffaa66', size: 2.5+Math.random()*3
      });
    }
  }

  // ========== DRAW ==========
  function draw() {
    const bg = ctx.createRadialGradient(W/2, H/2, 30, W/2, H/2, Math.max(W,H)*0.75);
    bg.addColorStop(0, '#0c121c'); bg.addColorStop(0.5, '#070b12'); bg.addColorStop(1, '#030507');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(s.tw));
      ctx.fillStyle = '#aaccff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(60,110,180,0.06)'; ctx.lineWidth = 1;
    for (let x = 0; x < MAP_W; x += 50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,MAP_H); ctx.stroke(); }
    for (let y = 0; y < MAP_H; y += 50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(MAP_W,y); ctx.stroke(); }

    ctx.strokeStyle = 'rgba(100,160,255,0.3)'; ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, MAP_W, MAP_H);

    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      const g = ctx.createLinearGradient(w.x, w.y, w.x, w.y+w.h);
      g.addColorStop(0, '#2a3a5a'); g.addColorStop(1, '#1a2a4a');
      ctx.fillStyle = g; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = 'rgba(100,180,255,0.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    for (let i = 0; i < food.length; i++) {
      const f = food[i];
      const s = f.r + Math.sin(f.pulse) * 1.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, s, 0, Math.PI*2);
      ctx.fillStyle = f.color; ctx.shadowBlur = 12; ctx.shadowColor = f.color;
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(f.x-2, f.y-2, s*0.4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    }

    // Bots tanque
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      if (b.hp <= 0) continue;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.body);

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(2, 3, b.radius*1.1, b.radius*0.9, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#333';
      ctx.fillRect(-b.radius, -b.radius*0.85, b.radius*2, b.radius*0.5);
      ctx.fillRect(-b.radius, b.radius*0.35, b.radius*2, b.radius*0.5);
      ctx.fillStyle = '#555';
      for (let j = 0; j < 4; j++) {
        ctx.fillRect(-b.radius + j*(b.radius*0.5), -b.radius*0.85, 3, b.radius*0.5);
        ctx.fillRect(-b.radius + j*(b.radius*0.5), b.radius*0.35, 3, b.radius*0.5);
      }

      const bg2 = ctx.createLinearGradient(0, -b.radius*0.6, 0, b.radius*0.6);
      bg2.addColorStop(0, b.color); bg2.addColorStop(1, shade(b.color, -40));
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.roundRect(-b.radius*0.75, -b.radius*0.5, b.radius*1.5, b.radius, 4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = shade(b.color, 20);
      ctx.beginPath(); ctx.arc(0, 0, b.radius*0.45, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.stroke();

      const localAim = b.aim - b.body;
      ctx.rotate(localAim);
      ctx.fillStyle = shade(b.w.color, 10);
      ctx.fillRect(0, -3, b.radius*1.3, 6);
      ctx.fillStyle = b.w.color;
      ctx.fillRect(b.radius*1.2, -2, 4, 4);
      ctx.restore();

      const hp = b.hp/b.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(b.x-20, b.y-b.radius-14, 40, 5);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x-20, b.y-b.radius-14, 40*hp, 5);
    }

    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
      ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (rayEffect.active) {
      const t = rayEffect.timer / rayEffect.duration;
      const a = Math.min(1, t*1.8);
      const c = rayEffect.color || '#7df9ff';
      for (let r = 0; r < rayEffect.rays.length; r++) {
        const ang = rayEffect.rays[r];
        const end = rayEndWall(player.x, player.y, ang, player.range);
        ctx.save();
        ctx.globalAlpha = a*0.3; ctx.strokeStyle = c;
        ctx.lineWidth = player.rayW*2*(0.5+0.5*t);
        ctx.lineCap = 'round'; ctx.shadowBlur = 30; ctx.shadowColor = c;
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(end.x, end.y); ctx.stroke();
        ctx.globalAlpha = a; ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(1.5, player.rayW/2.5*t);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(end.x, end.y); ctx.stroke();
        ctx.restore();
      }
    }

    // Player tank
    if (player) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.aim);

      ctx.shadowColor = godMode ? '#ffdd00' : '#2ad4ff';
      ctx.shadowBlur = 25;

      ctx.fillStyle = '#1a3a5a';
      ctx.fillRect(-player.radius, -player.radius*0.85, player.radius*2, player.radius*0.5);
      ctx.fillRect(-player.radius, player.radius*0.35, player.radius*2, player.radius*0.5);

      const pg = ctx.createLinearGradient(0, -player.radius*0.6, 0, player.radius*0.6);
      pg.addColorStop(0, godMode ? '#ffcc33' : (TANKS[currentTankKey].color || '#2b8cff'));
      pg.addColorStop(1, shade(godMode ? '#ffcc33' : (TANKS[currentTankKey].color || '#2b8cff'), -50));
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.roundRect(-player.radius*0.75, -player.radius*0.5, player.radius*1.5, player.radius, 4);
      ctx.fill();
      ctx.strokeStyle = godMode ? '#ffe680' : '#7dd4ff'; ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = godMode ? '#ffdd00' : (TANKS[currentTankKey].color || '#7dd4ff');
      ctx.beginPath(); ctx.arc(0, 0, player.radius*0.45, 0, Math.PI*2); ctx.fill();

      // Cañón distinto por arma
      const w = TANKS[currentTankKey].weapon;
      let barrelLen = player.radius + 14;
      let barrelW = 6;
      if (w === 'shotgun') { barrelLen = player.radius + 10; barrelW = 10; }
      else if (w === 'sniper') { barrelLen = player.radius + 22; barrelW = 4; }
      else if (w === 'rocket') { barrelLen = player.radius + 16; barrelW = 8; }
      else if (w === 'cannon') { barrelLen = player.radius + 12; barrelW = 12; }
      else if (w === 'flame') { barrelLen = player.radius + 12; barrelW = 8; }
      else if (w === 'smg') { barrelLen = player.radius + 10; barrelW = 4; }

      ctx.fillStyle = '#1a3a6a';
      ctx.fillRect(0, -barrelW/2, barrelLen - player.recoil, barrelW);
      ctx.fillStyle = TANKS[currentTankKey].color || '#7dd4ff';
      ctx.fillRect(barrelLen - 6 - player.recoil, -2, 4, 4);

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    ctx.restore();

    if (player) {
      ctx.font = 'bold 11px "Segoe UI", monospace'; ctx.textAlign = 'center';
      const px = player.x - camera.x, py = player.y - camera.y;
      ctx.fillStyle = TANKS[currentTankKey].color || '#ffd966';
      ctx.fillText(TANKS[currentTankKey].weaponName, px, py - player.radius - 22);
    }

    // XP barra
    const xpPct = xp / xpNext;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(8, H-14, W-16, 7);
    const xg = ctx.createLinearGradient(8, 0, W-8, 0);
    xg.addColorStop(0, '#3a8eff'); xg.addColorStop(1, '#7df9ff');
    ctx.fillStyle = xg; ctx.fillRect(8, H-14, (W-16)*xpPct, 7);
    ctx.strokeStyle = 'rgba(120,180,255,0.4)'; ctx.lineWidth = 1; ctx.strokeRect(8, H-14, W-16, 7);

    drawMinimap();
  }

  function shade(color, pct) {
    const n = parseInt(color.replace('#',''), 16);
    const a = Math.round(2.55 * pct);
    const R = Math.max(0, Math.min(255, (n>>16) + a));
    const G = Math.max(0, Math.min(255, ((n>>8)&0xFF) + a));
    const B = Math.max(0, Math.min(255, (n&0xFF) + a));
    return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
  }

  function drawMinimap() {
    mctx.clearRect(0, 0, 130, 130);
    mctx.fillStyle = 'rgba(5,10,18,0.85)'; mctx.fillRect(0, 0, 130, 130);
    const sx = 130/MAP_W, sy = 130/MAP_H;
    mctx.fillStyle = 'rgba(60,100,160,0.6)';
    for (let i = 0; i < walls.length; i++) mctx.fillRect(walls[i].x*sx, walls[i].y*sy, walls[i].w*sx, walls[i].h*sy);
    mctx.fillStyle = 'rgba(255,200,50,0.8)';
    for (let i = 0; i < food.length; i++) mctx.fillRect(food[i].x*sx-1, food[i].y*sy-1, 2, 2);
    for (let i = 0; i < bots.length; i++) {
      if (bots[i].hp <= 0) continue;
      mctx.fillStyle = bots[i].color;
      mctx.beginPath(); mctx.arc(bots[i].x*sx, bots[i].y*sy, 2.5, 0, Math.PI*2); mctx.fill();
    }
    if (player) {
      mctx.fillStyle = '#4df0ff';
      mctx.beginPath(); mctx.arc(player.x*sx, player.y*sy, 2.5, 0, Math.PI*2); mctx.fill();
    }
    mctx.strokeStyle = 'rgba(100,180,255,0.4)'; mctx.lineWidth = 1; mctx.strokeRect(0, 0, 130, 130);
  }

  // ========== UI ==========
  function updateUI() {
    ui.level.textContent = level;
    ui.gems.textContent = gems;
    ui.xp.textContent = xp;
    ui.shopGems.textContent = gems;
    if (player) {
      const pct = Math.max(0, (player.hp/player.maxHp)*100);
      ui.hpFill.style.width = pct + '%';
      ui.hpText.textContent = Math.ceil(player.hp) + ' / ' + player.maxHp;
    }
  }

  function resetGame() {
    gameActive = true; level = 1; xp = 0; xpNext = 10;
    bots = []; particles = []; projectiles = []; totalKills = 0;
    currentTankKey = 'base';
    player = createPlayer();
    godMode = false; regenAcc = 0; levelUpPending = false;
    genWalls(); genFood(); spawnBots();
    updateUI(); renderUpgrades();
    save();
  }

  // ========== RENDERS ==========
  function renderTanks() {
    const grid = document.getElementById('tanksGrid');
    grid.innerHTML = '';
    document.getElementById('tankLevelReq').textContent = level;
    Object.keys(TANKS).forEach(function(key) {
      const t = TANKS[key];
      if (t.adminOnly && !adminUnlocked) return;
      const owned = ownedTanks[key] || t.adminOnly;
      const levelOk = level >= t.levelReq;
      const active = currentTankKey === key;
      const card = document.createElement('div');
      card.className = 'tank-card' + (active ? ' active' : '') + ((!owned || !levelOk) ? ' locked' : '');
      card.innerHTML =
        ((!owned || !levelOk) ? '<div class="tank-lock">🔒</div>' : '') +
        '<div class="tank-icon">' + t.icon + '</div>' +
        '<div class="tank-name">' + t.name + '</div>' +
        '<div class="tank-rarity rarity-' + t.rarity + '">' + t.rarity + '</div>' +
        '<div class="tank-weapon">' + t.weaponName + '</div>' +
        '<div class="tank-level">Nv. ' + t.levelReq + '</div>';
      card.addEventListener('click', function() {
        if (!owned) { toast('🔒 Consíguelo en cofres'); return; }
        if (!levelOk) { toast('🔒 Nivel ' + t.levelReq); return; }
        applyTank(key);
      });
      grid.appendChild(card);
    });
  }

  function renderModes() {
    const grid = document.getElementById('modesGrid');
    grid.innerHTML = '';
    Object.keys(MODES).forEach(function(key) {
      const m = MODES[key];
      const active = currentMode === key;
      const card = document.createElement('div');
      card.className = 'mode-card' + (active ? ' active' : '');
      card.innerHTML = '<div class="mode-icon">' + m.icon + '</div><div class="mode-name">' + m.name + '</div><div class="mode-desc">' + m.desc + '</div>';
      card.addEventListener('click', function() {
        currentMode = key;
        document.getElementById('modesModal').classList.remove('open');
        resetGame();
        toast('🎮 ' + m.name);
      });
      grid.appendChild(card);
    });
  }

  function renderShop() {
    const grid = document.getElementById('shopGrid');
    grid.innerHTML = '';
    CHESTS.forEach(function(c) {
      const canAfford = gems >= c.price;
      const card = document.createElement('div');
      card.className = 'chest-card' + (canAfford ? '' : ' locked');
      card.innerHTML = '<div class="chest-icon">' + c.icon + '</div><div class="chest-name">' + c.name + '</div><div class="chest-price">' + c.price + '</div>';
      card.addEventListener('click', function() {
        if (canAfford) buyChest(c);
        else toast('💎 Faltan gemas');
      });
      grid.appendChild(card);
    });
  }

  function buyChest(chest) {
    if (gems < chest.price) return;
    gems -= chest.price; updateUI();
    document.getElementById('shopModal').classList.remove('open');
    openChest(chest);
  }

  function openChest(chest) {
    const modal = document.getElementById('chestModal');
    modal.classList.add('open');
    document.getElementById('chestOpening').innerHTML =
      '<div class="big-icon">' + chest.icon + '</div><div style="color:#97b9e0;margin-top:0.6rem;font-size:0.85rem;">Abriendo...</div>';
    setTimeout(function() {
      const total = chest.drops.reduce(function(s, d) { return s + d.weight; }, 0);
      let roll = Math.random() * total;
      let drop = chest.drops[0];
      for (let i = 0; i < chest.drops.length; i++) {
        roll -= chest.drops[i].weight;
        if (roll <= 0) { drop = chest.drops[i]; break; }
      }
      let html = '';
      if (drop.type === 'gems') {
        gems += drop.amount;
        html = '<div class="big-icon">💎</div><div class="reward-display">+' + drop.amount + ' GEMAS</div>';
      } else if (drop.type === 'tank') {
        const t = TANKS[drop.key];
        if (t && !ownedTanks[drop.key]) {
          ownedTanks[drop.key] = true;
          html = '<div class="big-icon">' + t.icon + '</div><div class="reward-display">¡' + t.name + '!</div><div class="reward-sub">' + t.rarity.toUpperCase() + ' · ' + t.weaponName + '</div>';
        } else {
          gems += 50;
          html = '<div class="big-icon">💎</div><div class="reward-display">Repetido +50</div>';
        }
      }
      document.getElementById('chestOpening').innerHTML = html +
        '<button class="admin-btn good" style="margin-top:1rem;width:auto;padding:0.4rem 1.2rem;" id="chestAccept">✓</button>';
      tone(523, 0.15, 'triangle', 0.15, 1046);
      updateUI(); save();
      document.getElementById('chestAccept').addEventListener('click', function() {
        modal.classList.remove('open');
      });
    }, 800);
  }

  function renderUpgrades() {
    ui.upgradeBar.innerHTML = '';
    Object.keys(UPGRADES).forEach(function(key) {
      const u = UPGRADES[key];
      const lvl = upgrades[key];
      const maxed = lvl >= u.max;
      const cost = upgradeCost(key);
      const canAfford = xp >= cost;
      const btn = document.createElement('div');
      btn.className = 'upg-btn' + (maxed ? ' maxed' : '') + ((!maxed && !canAfford) ? ' no-xp' : '');
      btn.innerHTML =
        '<div class="upg-icon">' + u.icon + '</div>' +
        '<div class="upg-name">' + u.name + '</div>' +
        '<div class="upg-cost">' + (maxed ? 'MAX' : cost) + '</div>';
      btn.title = u.name + ' · ' + u.effect + ' · Nv.' + lvl + '/' + u.max + ' · ' + cost + ' XP';
      btn.addEventListener('click', function() {
        if (maxed) { toast('Máximo alcanzado'); return; }
        if (xp < cost) { toast('✨ Necesitas ' + cost + ' XP'); return; }
        xp -= cost;
        upgrades[key]++;
        updateUI(); renderUpgrades();
        const np = createPlayer();
        np.x = player.x; np.y = player.y; np.hp = Math.min(player.hp, np.maxHp);
        player = np;
        toast('✅ ' + u.name + ' mejorado');
        save();
      });
      ui.upgradeBar.appendChild(btn);
    });
  }

  // ========== JOYSTICKS ==========
  function setupJoy(zone, knob, onMove, onEnd) {
    let active = false, sx = 0, sy = 0;
    const maxD = 35;
    zone.addEventListener('touchstart', function(e) {
      e.preventDefault(); active = true;
      const t = e.touches[0];
      const r = zone.getBoundingClientRect();
      sx = r.left + r.width/2; sy = r.top + r.height/2;
      handle(t.clientX, t.clientY);
    }, { passive: false });
    zone.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!active) return;
      handle(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    zone.addEventListener('touchend', function(e) {
      e.preventDefault(); active = false;
      knob.style.transform = 'translate(-50%,-50%)';
      onEnd();
    }, { passive: false });
    zone.addEventListener('touchcancel', function() {
      active = false; knob.style.transform = 'translate(-50%,-50%)'; onEnd();
    }, { passive: false });
    function handle(cx, cy) {
      let dx = cx-sx, dy = cy-sy;
      const d = Math.hypot(dx,dy);
      if (d > maxD) { dx = (dx/d)*maxD; dy = (dy/d)*maxD; }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      onMove(dx, dy);
    }
  }

  setupJoy(document.getElementById('joystickLeft'), document.getElementById('knobLeft'), function(dx, dy) {
    const dz = 10;
    keys.a = dx < -dz; keys.d = dx > dz;
    keys.w = dy < -dz; keys.s = dy > dz;
  }, function() { keys.a = keys.d = keys.w = keys.s = false; });

  setupJoy(document.getElementById('joystickRight'), document.getElementById('knobRight'), function(dx, dy) {
    if (Math.hypot(dx, dy) > 10) {
      joyRightActive = true;
      aimJoy = Math.atan2(dy, dx);
    }
  }, function() { joyRightActive = false; });

  canvas.addEventListener('mousemove', function(e) {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * (W/r.width);
    mouseY = (e.clientY - r.top) * (H/r.height);
  });
  canvas.addEventListener('mousedown', function() { mouseDown = true; initAudio(); });
  canvas.addEventListener('mouseup', function() { mouseDown = false; });
  canvas.addEventListener('mouseleave', function() { mouseDown = false; });
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  window.addEventListener('keydown', function(e) {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') keys.w = true;
    if (k === 'a' || k === 'arrowleft') keys.a = true;
    if (k === 's' || k === 'arrowdown') keys.s = true;
    if (k === 'd' || k === 'arrowright') keys.d = true;
  });
  window.addEventListener('keyup', function(e) {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') keys.w = false;
    if (k === 'a' || k === 'arrowleft') keys.a = false;
    if (k === 's' || k === 'arrowdown') keys.s = false;
    if (k === 'd' || k === 'arrowright') keys.d = false;
  });

  // ========== BOTONES ==========
  document.getElementById('restartBtn').addEventListener('click', function() { resetGame(); });
  document.getElementById('shopBtn').addEventListener('click', function() {
    document.getElementById('shopModal').classList.add('open'); renderShop();
  });
  document.getElementById('tanksBtn').addEventListener('click', function() {
    document.getElementById('tanksModal').classList.add('open'); renderTanks();
  });
  document.getElementById('modesBtn').addEventListener('click', function() {
    document.getElementById('modesModal').classList.add('open'); renderModes();
  });
  document.getElementById('fullscreenBtn').addEventListener('click', function() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  document.querySelectorAll('[data-close]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.getElementById(btn.getAttribute('data-close')).classList.remove('open');
    });
  });
  ['shopModal','tanksModal','modesModal','chestModal'].forEach(function(id) {
    const el = document.getElementById(id);
    el.addEventListener('click', function(e) { if (e.target === el) el.classList.remove('open'); });
  });

  // ========== ADMIN ==========
  document.getElementById('adminToggle').addEventListener('click', function() {
    if (!adminUnlocked) {
      if (gems >= 100) {
        gems -= 100; adminUnlocked = true; updateUI();
        toast('🔨 Admin desbloqueado');
        document.getElementById('adminPanel').classList.add('open');
        renderAdminTanks();
        save();
      } else {
        toast('💎 Necesitas 100 gemas');
      }
    } else {
      document.getElementById('adminPanel').classList.toggle('open');
      if (document.getElementById('adminPanel').classList.contains('open')) renderAdminTanks();
    }
  });
  document.getElementById('adminClose').addEventListener('click', function() {
    document.getElementById('adminPanel').classList.remove('open');
  });

  function renderAdminTanks() {
    const list = document.getElementById('adminTankList');
    list.innerHTML = '';
    Object.keys(TANKS).forEach(function(key) {
      const t = TANKS[key];
      if (!t.adminOnly) return;
      const btn = document.createElement('button');
      btn.className = 'weapon-btn';
      btn.textContent = t.icon + ' ' + t.name;
      btn.addEventListener('click', function() {
        ownedTanks[key] = true;
        applyTank(key);
        updateUI(); save();
      });
      list.appendChild(btn);
    });
  }

  // Admin bonuses (aplican de VERDAD al jugador)
  function applyAdminBonus(type, val) {
    adminBonuses[type] += val;
    const np = createPlayer();
    np.x = player.x; np.y = player.y;
    if (type === 'hp') np.hp = np.maxHp; else np.hp = Math.min(player.hp, np.maxHp);
    player = np;
    updateUI(); save();
  }
  document.getElementById('admApplyDamage').addEventListener('click', function() {
    const v = parseInt(document.getElementById('admDamage').value) || 10;
    applyAdminBonus('dmg', v);
    toast('⚔️ +' + v + ' daño');
  });
  document.getElementById('admApplySpeed').addEventListener('click', function() {
    const v = parseFloat(document.getElementById('admSpeed').value) || 2;
    applyAdminBonus('spd', v);
    toast('🏃 +' + v + ' velocidad');
  });
  document.getElementById('admApplyHp').addEventListener('click', function() {
    const v = parseInt(document.getElementById('admHp').value) || 50;
    applyAdminBonus('hp', v);
    toast('❤️ +' + v + ' HP');
  });
  document.getElementById('admApplyRange').addEventListener('click', function() {
    const v = parseInt(document.getElementById('admRange').value) || 100;
    applyAdminBonus('rng', v);
    toast('🎯 +' + v + ' alcance');
  });
  document.getElementById('admApplyFireRate').addEventListener('click', function() {
    const v = parseInt(document.getElementById('admFireRate').value) || 2;
    applyAdminBonus('cd', v);
    toast('⚡ +' + v + ' cadencia');
  });
  document.getElementById('admApplyPierce').addEventListener('click', function() {
    const v = parseInt(document.getElementById('admPierce').value) || 1;
    applyAdminBonus('prc', v);
    toast('🗡️ +' + v + ' perforación');
  });

  document.getElementById('admLevelUp').addEventListener('click', function() {
    level++; xp = 0; gems += 20;
    toast('⭐ Nivel ' + level);
    Object.keys(TANKS).forEach(function(k) {
      const t = TANKS[k];
      if (!t.adminOnly && t.levelReq > 0 && t.levelReq <= level && !ownedTanks[k]) ownedTanks[k] = true;
    });
    evolveTank();
    updateUI(); save();
  });
  document.getElementById('admAddGems').addEventListener('click', function() {
    gems += 100; updateUI(); toast('💎 +100'); save();
  });
  document.getElementById('admUnlockAll').addEventListener('click', function() {
    Object.keys(TANKS).forEach(function(k) { ownedTanks[k] = true; });
    toast('🔓 Todos desbloqueados'); save();
  });
  document.getElementById('admGodMode').addEventListener('click', function() {
    godMode = !godMode;
    this.style.background = godMode ? '#4a3a0a' : '#2a1a1a';
    this.textContent = godMode ? '🛡️ Dios: ON' : '🛡️ Modo Dios';
  });
  document.getElementById('admReset').addEventListener('click', function() { resetGame(); });

  // ========== LOOP ==========
  let lastT = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!ts) ts = performance.now();
    if (ts - lastT < 15) return;
    lastT = ts;
    update();
    draw();
  }

  // ========== INIT ==========
  const saveData = load();
  if (saveData) {
    gems = saveData.gems || 0;
    ownedTanks = saveData.ownedTanks || { base: true };
    adminUnlocked = saveData.adminUnlocked || false;
    currentTankKey = saveData.currentTankKey || 'base';
    currentMode = saveData.currentMode || 'survival';
    bestLevel = saveData.bestLevel || 1;
    if (saveData.upgrades) Object.keys(saveData.upgrades).forEach(function(k) { if (upgrades[k] !== undefined) upgrades[k] = saveData.upgrades[k]; });
    if (saveData.adminBonuses) Object.keys(saveData.adminBonuses).forEach(function(k) { if (adminBonuses[k] !== undefined) adminBonuses[k] = saveData.adminBonuses[k]; });
    ownedTanks.base = true;
    toast('💾 Partida cargada');
  }

  resize();
  initStars();
  resetGame();
  renderUpgrades();
  requestAnimationFrame(loop);
  window.addEventListener('beforeunload', save);
  setInterval(save, 30000);
};
</script>
</body>
