<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>⚡ TANK ARENA · v4.0</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05070a; font-family: 'Segoe UI', system-ui, monospace;
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    position: fixed; inset: 0;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, #101620 0%, #05070a 70%);
  }

  /* ===== LOCK SCREEN ===== */
  #lockScreen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #0c1420 0%, #030507 80%);
    transition: opacity 0.4s ease, visibility 0.4s ease; padding: 1rem;
  }
  #lockScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .lock-box {
    background: linear-gradient(160deg, #121a28, #080b11);
    border: 1px solid #2a4a7a; border-radius: 20px;
    padding: 2rem 1.5rem; width: 100%; max-width: 380px;
    text-align: center; box-shadow: 0 0 60px rgba(40,120,255,0.25);
  }
  .lock-icon { font-size: 3.5rem; margin-bottom: 1rem; }
  .lock-title { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 3px; color: #aad0ff; margin-bottom: 0.4rem; }
  .lock-subtitle { font-size: 0.85rem; color: #5f7a9e; margin-bottom: 1.5rem; }
  .lock-input {
    width: 100%; background: #0a0e14; border: 2px solid #2a4a7a;
    border-radius: 12px; padding: 0.8rem 1rem; color: #c8deff;
    font-size: 1.1rem; font-family: inherit; text-align: center;
    letter-spacing: 3px; outline: none; margin-bottom: 1rem;
  }
  .lock-btn {
    width: 100%; background: linear-gradient(180deg, #2e5a8a, #1a3350);
    border: 1px solid #7df9ff; color: #fff; font-weight: bold;
    font-size: 1rem; padding: 0.9rem; border-radius: 12px;
    cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  }
  .lock-error-msg { color: #ff6666; font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.2rem; font-weight: 600; }

  /* ===== GAME ===== */
  #gameContainer { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
  #gameContainer.visible { display: flex; }

  .game-wrapper {
    position: relative; width: 100vw; height: 100vh; max-width: 1600px; max-height: 1000px;
    background: linear-gradient(145deg, #0f131b 0%, #080b10 100%);
    padding: 4px; display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 800px) {
    .game-wrapper { border-radius: 18px; padding: 10px; width: 98vw; height: 96vh; }
  }
  .canvas-container {
    position: relative; flex: 1; border-radius: 8px; overflow: hidden; background: #06090e;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  /* ===== HUD RENOVADO ===== */
  .stats-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding: 0 4px; gap: 4px; flex-wrap: wrap;
    color: #c8deff; font-weight: 600; font-size: 0.7rem;
  }
  .hud-item {
    display: flex; align-items: center; gap: 4px;
    background: linear-gradient(180deg, #141c28, #0b1118);
    border: 1px solid #2a3f5c; padding: 3px 8px; border-radius: 6px;
    min-height: 28px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .level-badge { color: #ffd966; border-color: #5a4a1f; }
  .gem-badge { color: #c77dff; border-color: #5a2e8a; }
  .xp-badge { color: #7df9ff; border-color: #2e5a8a; }
  .hp-container { display: flex; align-items: center; gap: 4px; }
  .hp-fill { width: 70px; height: 10px; background: #0a0e14; border-radius: 3px; overflow: hidden; border: 1px solid #3a1f28; }
  @media (min-width: 500px) { .hp-fill { width: 100px; height: 12px; } }
  .hp-fill span { display: block; height: 100%; background: linear-gradient(90deg, #ff1f4b, #ff8a5c); transition: width 0.15s ease; }

  button { font-family: inherit; cursor: pointer; border: none; outline: none; -webkit-appearance: none; }
  .hud-btn {
    font-weight: bold; padding: 5px 7px; border-radius: 6px; font-size: 0.75rem; border: 1px solid;
    min-width: 32px; min-height: 32px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a2a3e, #0f1a28); border-color: #2e5a8a; color: #b8d4ff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .hud-btn:active { transform: scale(0.92); box-shadow: 0 0 10px rgba(80,160,255,0.5); }

  /* ===== MODALES ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2,4,8,0.94); backdrop-filter: blur(8px);
    display: none; justify-content: center; align-items: center; z-index: 15; padding: 0.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #121a28, #080b11);
    border-radius: 16px; border: 1px solid #2a4a7a;
    max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto;
    padding: 1.2rem; color: #c8deff; -webkit-overflow-scrolling: touch;
    box-shadow: 0 0 60px rgba(40,120,255,0.2), 0 25px 50px black;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid #2a4a7a;
  }
  .modal-title { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 2px; color: #aad0ff; }
  .close-btn {
    background: #2a1a1a; border: 1px solid #8a2e2e; color: #ffb8b8;
    width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; font-weight: bold;
  }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.7rem; }
  .chest-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 12px; border: 2px solid #3a5a8a; padding: 0.9rem 0.5rem;
    text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .chest-card:active { transform: scale(0.96); }
  .chest-card .chest-icon { font-size: 2.2rem; margin-bottom: 0.3rem; }
  .chest-card .chest-name { font-size: 0.82rem; font-weight: 700; color: #fff; }
  .chest-card .chest-price { display: inline-block; background: #5a2e8a; color: #e8c8ff; padding: 0.2rem 0.7rem; border-radius: 12px; font-weight: bold; font-size: 0.75rem; margin-top: 0.3rem; }
  .chest-card.locked { opacity: 0.5; }

  .tanks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.6rem; }
  .tank-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 10px; border: 2px solid #3a5a8a; padding: 0.7rem 0.4rem;
    text-align: center; cursor: pointer; position: relative; transition: all 0.2s;
  }
  .tank-card:active { transform: scale(0.96); }
  .tank-card.active { border-color: #7df9ff; box-shadow: 0 0 25px #3e7eff; }
  .tank-card.locked { opacity: 0.5; }
  .tank-card .tank-icon { font-size: 1.8rem; margin-bottom: 0.2rem; }
  .tank-card .tank-name { font-size: 0.72rem; font-weight: 700; color: #fff; }
  .tank-card .tank-rarity { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  .tank-card .tank-level { font-size: 0.58rem; color: #97b9e0; margin-top: 2px; }
  .tank-card .tank-weapon { font-size: 0.55rem; color: #7df9ff; margin-top: 2px; }
  .rarity-comun { color: #8a9ab0; } .rarity-raro { color: #5f9eff; }
  .rarity-epico { color: #c77dff; } .rarity-legendario { color: #ffd966; }
  .rarity-secreto { color: #ff5c8a; } .rarity-exotico { color: #4dffb8; }
  .rarity-mitico { color: #ff4dff; } .rarity-admin { color: #ff0000; text-shadow: 0 0 8px #ff0000; }
  .tank-card .tank-lock { position: absolute; top: 3px; right: 3px; font-size: 0.7rem; }

  .modes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
  .mode-card {
    background: linear-gradient(160deg, #1a2438, #0d1420);
    border-radius: 12px; border: 2px solid #3a5a8a; padding: 1rem 0.6rem;
    text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .mode-card:active { transform: scale(0.96); }
  .mode-card.active { border-color: #7df9ff; box-shadow: 0 0 25px #3e7eff; }
  .mode-card .mode-icon { font-size: 2.2rem; margin-bottom: 0.3rem; }
  .mode-card .mode-name { font-size: 0.9rem; font-weight: 700; color: #fff; }
  .mode-card .mode-desc { font-size: 0.72rem; color: #97b9e0; line-height: 1.3; margin-top: 0.3rem; }

  /* ===== ADMIN PANEL ===== */
  .admin-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 360px; max-width: 94vw;
    background: linear-gradient(160deg, #0f131c, #080b11);
    border: 1px solid #8a2e2e; border-radius: 16px; padding: 1rem; z-index: 20;
    color: #ffd8d8; display: none; font-size: 0.75rem; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 0 60px rgba(255,60,60,0.3), 0 25px 50px black;
  }
  .admin-panel.open { display: block; }
  .admin-panel h3 { margin: 0 0 0.7rem 0; color: #ff6b6b; font-size: 0.95rem; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; margin-bottom: 0.4rem; }
  .admin-row label { flex: 1; color: #ffb8b8; font-size: 0.72rem; }
  .admin-row input[type="number"] { width: 65px; background: #1a1f2b; border: 1px solid #8a2e2e; color: #fff; padding: 0.2rem 0.3rem; border-radius: 5px; font-size: 0.72rem; }
  .admin-btn { background: linear-gradient(180deg, #2a1a1a, #180d0d); border: 1px solid #8a2e2e; color: #ffb8b8; padding: 0.35rem 0.6rem; border-radius: 6px; font-weight: bold; font-size: 0.72rem; width: 100%; margin-top: 0.3rem; }
  .admin-btn.good { background: linear-gradient(180deg, #0f2a1a, #081a10); border-color: #2e8a5a; color: #b8ffd8; }
  .admin-btn.danger { background: linear-gradient(180deg, #4a1010, #2a0808); border-color: #ff2e2e; }
  .admin-section { border-top: 1px solid #3a1b1b; margin-top: 0.7rem; padding-top: 0.7rem; }
  .admin-section-title { color: #ff8a8a; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.4rem; font-weight: bold; }
  .weapon-btn { background: linear-gradient(180deg, #14202e, #0a1118); border: 1px solid #2e4a7a; color: #b8d4ff; padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.7rem; margin: 0 0.2rem 0.3rem 0; font-weight: 600; }
  .weapon-btn.active { background: linear-gradient(180deg, #2e5a8a, #1a3350); border-color: #7df9ff; color: #fff; }

  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(180deg, #1a2e4a, #0d1828); border: 1px solid #5f9eff; border-radius: 10px; padding: 0.5rem 1.2rem;
    color: #c8deff; font-weight: bold; z-index: 30; opacity: 0; transition: all 0.3s ease;
    pointer-events: none; font-size: 0.8rem; max-width: 90vw; text-align: center;
    box-shadow: 0 0 25px rgba(80,160,255,0.6);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .chest-opening { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; text-align: center; }
  .chest-opening .big-icon { font-size: 4rem; animation: chestShake 0.6s ease-in-out infinite; }
  @keyframes chestShake { 0%, 100% { transform: rotate(-5deg) scale(1); } 50% { transform: rotate(5deg) scale(1.05); } }
  .reward-display { font-size: 1.05rem; font-weight: bold; color: #ffd966; margin-top: 0.6rem; }
  .reward-sub { font-size: 0.78rem; color: #97b9e0; margin-top: 0.3rem; }

  /* ===== JOYSTICKS ===== */
  .joystick-zone {
    position: absolute; bottom: 20px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(30,60,100,0.4), rgba(20,40,70,0.2));
    border: 2px solid rgba(100, 180, 255, 0.5);
    border-radius: 50%; display: none; z-index: 5; touch-action: none;
    box-shadow: 0 0 20px rgba(80,160,255,0.3);
  }
  .joystick-zone.active { display: block; }
  .joystick-zone.left { left: 20px; }
  .joystick-zone.right { right: 20px; background: radial-gradient(circle, rgba(100,30,30,0.4), rgba(70,20,20,0.2)); border-color: rgba(255, 120, 120, 0.5); box-shadow: 0 0 20px rgba(255,80,80,0.3); }
  .joystick-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 50px; height: 50px;
    background: radial-gradient(circle, #4df0ff, #1a6aaa);
    border-radius: 50%; border: 2px solid rgba(200, 240, 255, 0.7);
    box-shadow: 0 0 25px #4df0ff; pointer-events: none;
  }
  .joystick-zone.right .joystick-knob {
    background: radial-gradient(circle, #ff6666, #aa1a1a);
    border-color: rgba(255, 200, 200, 0.7);
    box-shadow: 0 0 25px #ff6666;
  }

  .minimap {
    position: absolute; top: 8px; right: 8px;
    width: 100px; height: 100px;
    background: rgba(5, 10, 18, 0.85);
    border: 1px solid rgba(80, 140, 255, 0.4);
    border-radius: 8px; z-index: 4; pointer-events: none;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  @media (min-width: 800px) { .minimap { width: 140px; height: 140px; } }

  .fullscreen-btn {
    position: absolute; top: 8px; left: 8px;
    background: linear-gradient(180deg, rgba(30,45,70,0.9), rgba(15,25,40,0.9));
    border: 1px solid rgba(100, 160, 255, 0.5);
    color: #b8d4ff; width: 36px; height: 36px;
    border-radius: 8px; font-size: 1rem; z-index: 6;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  /* ===== BARRA DE MEJORAS ===== */
  .upgrade-bar {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 6; background: rgba(10, 15, 25, 0.9);
    padding: 5px 10px; border-radius: 10px; border: 1px solid rgba(80, 140, 255, 0.4);
    flex-wrap: wrap; justify-content: center; max-width: 95%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  .upgrade-btn {
    background: linear-gradient(180deg, #1a2a3e, #0f1825); border: 1px solid #3a5a8a; color: #c8deff;
    width: 38px; height: 38px; border-radius: 7px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.52rem; font-weight: bold; cursor: pointer;
    position: relative; transition: all 0.15s;
  }
  .upgrade-btn .upg-icon { font-size: 0.95rem; line-height: 1; }
  .upgrade-btn .upg-cost { font-size: 0.45rem; color: #7df9ff; }
  .upgrade-btn:active { transform: scale(0.9); }
  .upgrade-btn.maxed { opacity: 0.4; }
  .upgrade-btn.no-xp { border-color: #8a2e2e; opacity: 0.6; }
  @media (min-width: 500px) {
    .upgrade-btn { width: 46px; height: 46px; font-size: 0.6rem; }
    .upgrade-btn .upg-icon { font-size: 1.15rem; }
    .upgrade-btn .upg-cost { font-size: 0.5rem; }
  }

  /* ===== DEATH ANIMATION ===== */
  .death-overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.92);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    animation: deathFadeIn 0.5s ease;
  }
  .death-overlay.show { display: flex; }
  @keyframes deathFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .death-icon {
    font-size: 6rem; animation: deathShake 0.5s ease infinite alternate;
    filter: drop-shadow(0 0 30px #ff0000);
  }
  @keyframes deathShake { from { transform: rotate(-5deg) scale(1); } to { transform: rotate(5deg) scale(1.1); } }
  .death-title {
    font-size: 2.2rem; color: #ff4444; font-weight: bold;
    text-transform: uppercase; letter-spacing: 4px; margin-top: 1rem;
    text-shadow: 0 0 20px #ff0000;
  }
  .death-stats {
    color: #c8deff; font-size: 1rem; margin-top: 1rem; text-align: center;
    line-height: 1.8;
  }
  .death-btn {
    margin-top: 1.5rem; background: linear-gradient(180deg, #2e5a8a, #1a3350);
    border: 1px solid #7df9ff; color: #fff; font-weight: bold;
    font-size: 1rem; padding: 0.8rem 2rem; border-radius: 12px;
    cursor: pointer; letter-spacing: 2px;
  }
  .death-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Acceso Restringido</div>
    <div class="lock-subtitle">Introduce la contraseña</div>
    <input type="password" id="passwordInput" class="lock-input" placeholder="••••••••" autocomplete="off" maxlength="32">
    <button id="unlockBtn" class="lock-btn">Desbloquear</button>
    <div id="lockError" class="lock-error-msg"></div>
  </div>
</div>

<div id="gameContainer">
  <div class="game-wrapper">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas"></canvas>
      <canvas id="minimap" class="minimap" width="140" height="140"></canvas>
      <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>
      <div class="joystick-zone left" id="joystickLeft">
        <div class="joystick-knob" id="knobLeft"></div>
      </div>
      <div class="joystick-zone right" id="joystickRight">
        <div class="joystick-knob" id="knobRight"></div>
      </div>
      <div class="upgrade-bar" id="upgradeBar"></div>
    </div>
    <div class="stats-bar">
      <div class="hud-item level-badge">⭐ <span id="levelDisplay">1</span></div>
      <div class="hud-item gem-badge">💎 <span id="gemDisplay">0</span></div>
      <div class="hud-item xp-badge">✨ <span id="xpDisplay">0</span></div>
      <div class="hud-item hp-container">
        <span>❤️</span>
        <div class="hp-fill"><span id="hpFill" style="width:100%"></span></div>
      </div>
      <div class="hud-item" style="padding:3px 5px;gap:3px;">
        <button class="hud-btn" id="modesBtn" title="Modos">🎮</button>
        <button class="hud-btn" id="tanksBtn" title="Tanque">🚀</button>
        <button class="hud-btn" id="shopBtn" title="Tienda">🛒</button>
        <button class="hud-btn" id="soundToggle" title="Sonido">🔊</button>
        <button class="hud-btn" id="adminToggle" title="Admin">🔨</button>
        <button class="hud-btn" id="restartBtn" title="Reiniciar">⟳</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="shopModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🛒 Tienda</div><button class="close-btn" data-close="shopModal">✕</button></div>
    <div style="text-align:center;margin-bottom:0.7rem;font-size:0.9rem;">Gemas: <span style="color:#e8c8ff;font-weight:bold;">💎 <span id="shopGemCount">0</span></span></div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="tanksModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🚀 Tanques</div><button class="close-btn" data-close="tanksModal">✕</button></div>
    <div style="text-align:center;margin-bottom:0.6rem;font-size:0.78rem;color:#97b9e0;">
      Empiezas con Base · Evoluciona al subir de nivel · Nivel: <span id="tankLevelReq" style="color:#7df9ff;font-weight:bold;">1</span>
    </div>
    <div class="tanks-grid" id="tanksGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="modesModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">🎮 Modos</div><button class="close-btn" data-close="modesModal">✕</button></div>
    <div class="modes-grid" id="modesGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="chestModal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header"><div class="modal-title">🎁 Cofre</div><button class="close-btn" data-close="chestModal">✕</button></div>
    <div class="chest-opening" id="chestOpening"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.7rem;padding-bottom:0.5rem;border-bottom:1px solid #8a2e2e;">
    <h3 style="margin:0;">🔨 Admin</h3>

  function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX, dy = cy - closestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function resolveWallCollision(entity) {

        const cy = Math.max(w.y, Math.min(entity.y, w.y + w.h));
        const dx = entity.x - cx, dy = entity.y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const ov = entity.radius - dist;
          entity.x += (dx / dist) * ov;
          entity.y += (dy / dist) * ov;
        }
      }
    }

  function checkTankEvolution() {
    const better = Object.keys(TANKS).filter(function(k) {
      const t = TANKS[k];
      return !t.adminOnly && t.levelReq > 0 && t.levelReq <= level && TANKS[currentTankKey] && t.levelReq > TANKS[currentTankKey].levelReq;
    });
    if (better.length > 0) {
      better.sort(function(a, b) { return TANKS[b].levelReq - TANKS[a].levelReq; });
      const nextKey = better[0];
      if (currentTankKey !== nextKey) {
        ownedTanks[nextKey] = true;
        currentTankKey = nextKey;
        const newP = createPlayer();
        newP.x = player.x; newP.y = player.y;
        newP.hp = Math.min(player.hp, newP.maxHp);
        player = newP;
        showToast('🚀 ¡Evolucionaste a ' + TANKS[nextKey].name + '!');
        playTone(523, 0.2, 'triangle', 0.15, 1046);
      }
    }
  }

  function applyTankToPlayer(key) {
    if (!player || !TANKS[key] || !ownedTanks[key]) return;
    if (level < TANKS[key].levelReq) { showToast('🔒 Nivel ' + TANKS[key].levelReq); return; }
    currentTankKey = key;
    const newP = createPlayer();
    newP.x = player.x; newP.y = player.y;
    newP.hp = Math.min(player.hp, newP.maxHp);
    player = newP;
    showToast('🚀 ' + TANKS[key].name + ' equipado');
    renderTanks();
    updateUI();
    saveGame();
  }

  // ==================== BOTS ====================
  function createBot(team, isBoss) {
    const teamColors = { red: '#ff4444', blue: '#4488ff' };
    const weaponKey = BOT_WEAPON_KEYS[Math.floor(Math.random() * BOT_WEAPON_KEYS.length)];
    const w = BOT_WEAPONS[weaponKey];
    const hpMult = isBoss ? 3 : 1;
    return {
      x: 200 + Math.random() * (MAP_W - 400),
      y: 200 + Math.random() * (MAP_H - 400),
      radius: isBoss ? 26 : 18,
      hp: 80 * hpMult, maxHp: 80 * hpMult,
      speed: 2.5,
      team: team,
      color: teamColors[team],
      weaponKey: weaponKey,
      weapon: w,
      aimAngle: Math.random() * Math.PI * 2,
      cooldown: 20 + Math.random() * 40,
      bodyAngle: Math.random() * Math.PI * 2,
      isBot: true,
      isBoss: isBoss || false
    };
  }

  function spawnBotsForMode() {
    bots = [];
    const mode = MODES[currentMode];
    if (mode.teamMode) {
      // En Rojo vs Azul, tú eres azul. Bots azules son aliados, rojos enemigos
      for (let i = 0; i < mode.botsPerTeam; i++) bots.push(createBot('red'));
      for (let i = 0; i < mode.botsPerTeam; i++) bots.push(createBot('blue'));
    } else {
      // En otros modos, TODOS los bots son enemigos (rojos)
      for (let i = 0; i < mode.bots; i++) {
        bots.push(createBot('red', mode.bossMode && i === 0));
      }
    }
  }

  function updateBots() {
    for (let i = 0; i < bots.length; i++) {
      const bot = bots[i];
      if (bot.hp <= 0) continue;

      let closestDist = Infinity, target = null;

      // Bots enemigos
      for (let j = 0; j < bots.length; j++) {
        if (i === j || bots[j].hp <= 0) continue;
        if (bots[j].team !== bot.team) {
          const d = Math.hypot(bots[j].x - bot.x, bots[j].y - bot.y);
          if (d < closestDist) { closestDist = d; target = bots[j]; }
        }
      }
      // Jugador (si es de otro equipo)
      if (player && bot.team !== player.team) {
        const d = Math.hypot(player.x - bot.x, player.y - bot.y);
        if (d < closestDist) { closestDist = d; target = player; }
      }

      if (target) {
        const dx = target.x - bot.x, dy = target.y - bot.y;
        const dist = Math.hypot(dx, dy);
        bot.aimAngle = Math.atan2(dy, dx);
        bot.bodyAngle = bot.aimAngle;
        if (dist > 250) {
          bot.x += (dx / dist) * bot.speed;
          bot.y += (dy / dist) * bot.speed;
        } else if (dist < 120) {
          bot.x -= (dx / dist) * bot.speed * 0.7;
          bot.y -= (dy / dist) * bot.speed * 0.7;
        }
        if (bot.cooldown <= 0 && dist < 450) {
          fireBotWeapon(bot, bot.aimAngle);
          bot.cooldown = bot.weapon.cooldown;
        }
      } else {
        bot.bodyAngle += (Math.random() - 0.5) * 0.1;
        bot.x += Math.cos(bot.bodyAngle) * bot.speed * 0.5;
        bot.y += Math.sin(bot.bodyAngle) * bot.speed * 0.5;
      }
      if (bot.cooldown > 0) bot.cooldown--;
      resolveWallCollision(bot);
      bot.x = Math.max(bot.radius, Math.min(MAP_W - bot.radius, bot.x));
      bot.y = Math.max(bot.radius, Math.min(MAP_H - bot.radius, bot.y));
    }
  }

  function fireBotWeapon(bot, angle) {
    const w = bot.weapon;
    const pellets = w.pellets || 1;
    for (let i = 0; i < pellets; i++) {
      let spread = (Math.random() - 0.5) * w.spread;
      const a = angle + spread;
      projectiles.push({
        x: bot.x + Math.cos(a) * (bot.radius + 5),
        y: bot.y + Math.sin(a) * (bot.radius + 5),
        vx: Math.cos(a) * w.speed,
        vy: Math.sin(a) * w.speed,
        radius: w.radius, damage: w.damage,
        team: bot.team, color: w.color,
        life: 80, explosion: w.explosion || false
      });
    }
    playTone(400, 0.05, 'square', 0.04, 200);
  }

  // ==================== DISPARO DEL JUGADOR (SEGÚN TANQUE) ====================
  function pointSegmentDistance(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = 0;
    if (lenSq > 0) { t = ((px - x1) * dx + (py - y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); }
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function getRayEndWithWalls(x1, y1, angle, maxRange) {
    let endX = x1 + Math.cos(angle) * maxRange;
    let endY = y1 + Math.sin(angle) * maxRange;
    let minT = 1;
    for (let i = 0; i < walls.length; i++) {
      const wall = walls[i];
      for (let step = 0; step <= 20; step++) {
        const t = step / 20;
        const px = x1 + (endX - x1) * t;
        const py = y1 + (endY - y1) * t;
        if (px > wall.x && px < wall.x + wall.w && py > wall.y && py < wall.y + wall.h) {
          if (t < minT) minT = t;
          break;
        }
      }
    }
    return { x: x1 + (endX - x1) * minT, y: y1 + (endY - y1) * minT };
  }

  // Arma según tipo de tanque
  function firePlayerWeapon() {
    if (!gameActive) return;
    const tank = TANKS[currentTankKey];
    const baseAngle = joystickRightActive ? aimAngleJoy : Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
    const wType = tank.weapon;

    playTone(120, 0.35, 'sine', 0.5, 35);
    playTone(800, 0.3, 'sawtooth', 0.25, 60);
    player.recoil = 6; player.flash = 6;

    // Comportamiento según tipo de arma
    const weaponColors = {
      railgun: '#7df9ff', smg: '#7df9ff', shotgun: '#ff9a5c',
      rocket: '#ff4444', sniper: '#ff5c8a', ice: '#aaddff',
      cannon: '#ff8800', flame: '#ff6600', dark: '#8a2be2',
      plasma: '#c77dff', rainbow: '#ff00ff', admin: '#ffd700',
      void: '#000000', chaos: '#ff0000'
    };

    if (wType === 'shotgun') {
      // Escopeta: 5 perdigones
      for (let i = 0; i < 5; i++) {
        const spread = (Math.random() - 0.5) * 0.5;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(baseAngle + spread) * 10,
          vy: Math.sin(baseAngle + spread) * 10,
          radius: 3, damage: player.rayDamage * 0.4,
          team: 'blue', color: '#ff9a5c', life: 50
        });
      }
    } else if (wType === 'smg') {
      // SMG: bala rápida con spread
      const spread = (Math.random() - 0.5) * 0.15;
      projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(baseAngle + spread) * 14,
        vy: Math.sin(baseAngle + spread) * 14,
        radius: 2.5, damage: player.rayDamage * 0.6,
        team: 'blue', color: '#7df9ff', life: 40
      });
    } else if (wType === 'rocket') {
      // Cohete: explosivo
      projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(baseAngle) * 6,
        vy: Math.sin(baseAngle) * 6,
        radius: 6, damage: player.rayDamage * 1.5,
        team: 'blue', color: '#ff4444', life: 100, explosion: true
      });
    } else if (wType === 'flame') {
      // Lanzallamas: varios proyectiles cortos
      for (let i = 0; i < 3; i++) {
        const spread = (Math.random() - 0.5) * 0.4;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(baseAngle + spread) * 7,
          vy: Math.sin(baseAngle + spread) * 7,
          radius: 5, damage: player.rayDamage * 0.3,
          team: 'blue', color: '#ff6600', life: 25
        });
      }
    } else if (wType === 'ice') {
      // Hielo: rayo que ralentiza
      const rayEnd = getRayEndWithWalls(player.x, player.y, baseAngle, player.rayRange);
      rayEffect = { active: true, timer: 8, duration: 8, rays: [baseAngle], color: '#aaddff' };
      applyRayDamage(player.x, player.y, rayEnd.x, rayEnd.y, player.rayDamage, 'blue', '#aaddff');
    } else if (wType === 'cannon') {
      // Cañón: bala grande
      projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(baseAngle) * 8,
        vy: Math.sin(baseAngle) * 8,
        radius: 8, damage: player.rayDamage * 1.3,
        team: 'blue', color: '#ff8800', life: 80
      });
    } else if (wType === 'dark') {
      // Oscuro: rayo
      const rayEnd = getRayEndWithWalls(player.x, player.y, baseAngle, player.rayRange);
      rayEffect = { active: true, timer: 8, duration: 8, rays: [baseAngle], color: '#8a2be2' };
      applyRayDamage(player.x, player.y, rayEnd.x, rayEnd.y, player.rayDamage, 'blue', '#8a2be2');
    } else if (wType === 'plasma') {
      // Plasma: 2 rayos paralelos
      const rayEnd = getRayEndWithWalls(player.x, player.y, baseAngle, player.rayRange);
      rayEffect = { active: true, timer: 8, duration: 8, rays: [baseAngle], color: '#c77dff' };
      applyRayDamage(player.x, player.y, rayEnd.x, rayEnd.y, player.rayDamage, 'blue', '#c77dff');
    } else if (wType === 'rainbow') {
      // Arcoíris: 3 rayos
      const rayEnd = getRayEndWithWalls(player.x, player.y, baseAngle, player.rayRange);
      rayEffect = { active: true, timer: 8, duration: 8, rays: [baseAngle - 0.1, baseAngle, baseAngle + 0.1], color: '#ff00ff' };
      applyRayDamage(player.x, player.y, rayEnd.x, rayEnd.y, player.rayDamage, 'blue', '#ff00ff');
    } else if (wType === 'admin' || wType === 'void' || wType === 'chaos') {
      // Admin: rayo devastador
      const rayEnd = getRayEndWithWalls(player.x, player.y, baseAngle, player.rayRange);
      rayEffect = { active: true, timer: 8, duration: 8, rays: [baseAngle], color: weaponColors[wType] };
      applyRayDamage(player.x, player.y, rayEnd.x, rayEnd.y, player.rayDamage * 2, 'blue', weaponColors[wType]);
    } else {
      // Railgun por defecto (1-3 vías según railgun)
      const railgun = RAILGUNS[currentRailgunKey];
      const rays = [];
      const viaCount = railgun.via;
      const spread = viaCount > 1 ? 0.15 : 0;
      for (let s = 0; s < viaCount; s++) {
        let offset = 0;
        if (viaCount > 1) offset = -spread / 2 + (s * spread / (viaCount - 1));
        rays.push(baseAngle + offset);
      }
      rayEffect = { active: true, timer: 8, duration: 8, rays: rays, color: railgun.color };
      for (let s = 0; s < rays.length; s++) {
        const rayEnd = getRayEndWithWalls(player.x, player.y, rays[s], player.rayRange);
        applyRayDamage(player.x, player.y, rayEnd.x, rayEnd.y, player.rayDamage, 'blue', railgun.color);
      }
    }
  }

  // Aplica daño de rayo a bots y comida
  function applyRayDamage(x1, y1, x2, y2, damage, team, color) {
    let pierceLeft = player.pierce;
    const hitEntities = [];
    const candidates = [];
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      if (b.hp <= 0 || b.team === team) continue;
      if (pointSegmentDistance(b.x, b.y, x1, y1, x2, y2) < b.radius + player.rayWidth / 2) {
        candidates.push({ target: b, d: Math.hypot(b.x - x1, b.y - y1), type: 'bot' });
      }
    }
    for (let i = 0; i < foodItems.length; i++) {
      const f = foodItems[i];
      if (pointSegmentDistance(f.x, f.y, x1, y1, x2, y2) < f.radius + player.rayWidth / 2) {
        candidates.push({ target: f, d: Math.hypot(f.x - x1, f.y - y1), type: 'food' });
      }
    }
    candidates.sort(function(a, b) { return a.d - b.d; });
    for (let c = 0; c < candidates.length; c++) {
      if (pierceLeft <= 0) break;
      const cand = candidates[c];
      if (hitEntities.indexOf(cand.target) !== -1) continue;
      hitEntities.push(cand.target);
      if (cand.type === 'food') {
        const f = cand.target;
        xp += f.xpValue; gems += 1;
        addHitParticles(f.x, f.y, f.color, 8);
        playTone(600, 0.08, 'sine', 0.1, 900);
        const idx = foodItems.indexOf(f);
        if (idx !== -1) foodItems.splice(idx, 1);
        respawnFood();
      } else {
        cand.target.hp -= damage;
        addHitParticles(cand.target.x, cand.target.y, color, 4);
        if (cand.target.hp <= 0) {
          const idx = bots.indexOf(cand.target);
          if (idx !== -1) bots.splice(idx, 1);
          xp += 5; totalKills++; gems += 2;
          addHitParticles(cand.target.x, cand.target.y, '#ffaa66', 10);
          // Respawn bot en modo survival/endless
          if (!MODES[currentMode].teamMode && (currentMode === 'survival' || currentMode === 'endless')) {
            setTimeout(function() {
              if (gameActive) bots.push(createBot('red'));
            }, 3000);
          }
        }
      }
      pierceLeft--;
    }
  }

  function respawnFood() {
    setTimeout(function() {
      if (!gameActive) return;
      foodItems.push({
        x: 100 + Math.random() * (MAP_W - 200),
        y: 100 + Math.random() * (MAP_H - 200),
        xpValue: 5 + Math.floor(Math.random() * 5),
        radius: 8, hp: 1, maxHp: 1,
        color: 'hsl(' + Math.random() * 60 + 40 + ', 90%, 60%)',
        pulse: Math.random() * Math.PI * 2
      });
    }, 1500 + Math.random() * 2000);
  }

  // ==================== UPDATE ====================
  function update() {
    if (!gameActive || !player) return;

    let dx = 0, dy = 0;
    if (keys.w) dy -= 1; if (keys.s) dy += 1;
    if (keys.a) dx -= 1; if (keys.d) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      player.x += dx * player.speed;
      player.y += dy * player.speed;
    }
    resolveWallCollision(player);
    player.x = Math.max(player.radius, Math.min(MAP_W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(MAP_H - player.radius, player.y));

    camera.x = Math.max(0, Math.min(MAP_W - W, player.x - W / 2));
    camera.y = Math.max(0, Math.min(MAP_H - H, player.y - H / 2));

    let targetAngle;
    if (joystickRightActive) {
      targetAngle = aimAngleJoy;
    } else {
      targetAngle = Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
    }
    let diff = targetAngle - player.aimAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.aimAngle += diff * 0.3;
    if (player.recoil > 0) player.recoil *= 0.85;
    if (player.flash > 0) player.flash--;

    if (player.regenPerSecond > 0 && player.hp < player.maxHp) {
      regenAccumulator++;
      if (regenAccumulator >= REGEN_INTERVAL) {
        regenAccumulator = 0;
        player.hp = Math.min(player.maxHp, player.hp + player.regenPerSecond);
        updateUI();
      }
    }

    const shouldFire = joystickRightActive || mouseDown;
    if (player.cooldownTimer > 0) {
      player.cooldownTimer--;
      player.isCharging = false; player.chargeTimer = 0;
    } else if (shouldFire) {
      if (!player.isCharging) { player.isCharging = true; player.chargeTimer = 0; }
      player.chargeTimer++;
      if (player.chargeTimer >= player.chargeTime) {
        firePlayerWeapon();
        player.chargeTimer = 0; player.isCharging = false;
        player.cooldownTimer = player.cooldownMax;
      }
    } else {
      player.isCharging = false; player.chargeTimer = 0;
    }

    if (rayEffect.active) { rayEffect.timer--; if (rayEffect.timer <= 0) rayEffect.active = false; }

    updateBots();

    // Proyectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx; p.y += p.vy; p.life--;

      let hitWall = false;
      for (let w = 0; w < walls.length; w++) {
        const wall = walls[w];
        if (p.x > wall.x && p.x < wall.x + wall.w && p.y > wall.y && p.y < wall.y + wall.h) {
          hitWall = true; break;
        }
      }
      if (hitWall) {
        if (p.explosion) addHitParticles(p.x, p.y, '#ff6600', 15);
        projectiles.splice(i, 1); continue;
      }

      if (p.life <= 0) { projectiles.splice(i, 1); continue; }

      // Colisión con jugador
      if (p.team !== player.team && Math.hypot(p.x - player.x, p.y - player.y) < player.radius + p.radius) {
        if (!godMode) { player.hp -= p.damage; updateUI(); }
        projectiles.splice(i, 1);
        if (!godMode && player.hp <= 0) { gameOver(); return; }
        continue;
      }

      // Colisión con bots enemigos
      let hitBot = false;
      for (let b = 0; b < bots.length; b++) {
        if (bots[b].hp <= 0 || bots[b].team === p.team) continue;
        if (Math.hypot(p.x - bots[b].x, p.y - bots[b].y) < bots[b].radius + p.radius) {
          bots[b].hp -= p.damage;
          hitBot = true;
          if (bots[b].hp <= 0) {
            addHitParticles(bots[b].x, bots[b].y, bots[b].color, 12);
            if (p.team === 'blue') { xp += 5; gems += 2; totalKills++; }
          }
          break;
        }
      }
      if (hitBot) { projectiles.splice(i, 1); continue; }
    }

    // Level up + evolución
    if (xp >= xpToNext && !levelUpPending) {
      levelUpPending = true;
      level++;
      xp = 0;
      xpToNext = Math.floor(10 + level * 3);
      gems += 10;
      showToast('⭐ ¡Nivel ' + level + '! +10 gemas');
      Object.keys(TANKS).forEach(function(k) {
        const t = TANKS[k];
        if (!t.adminOnly && t.levelReq > 0 && t.levelReq <= level && !ownedTanks[k]) {
          ownedTanks[k] = true;
        }
      });
      checkTankEvolution();
      updateUI();
      setTimeout(function() { levelUpPending = false; }, 1000);
      saveGame();
    }

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.022;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = 0; i < stars.length; i++) stars[i].twinkle += stars[i].speed;
  }

  function gameOver() {
    player.hp = 0;
    gameActive = false;
    playTone(300, 0.3, 'sawtooth', 0.15, 150);
    playTone(200, 0.5, 'sine', 0.2, 80);
    saveGame();
    deathStats.innerHTML =
      'Nivel alcanzado: <b>' + level + '</b><br>' +
      'Bajas totales: <b>' + totalKills + '</b><br>' +
      'Gemas: <b>' + gems + '</b>';
    deathOverlay.classList.add('show');
    deathRestartBtn.onclick = function() {
      deathOverlay.classList.remove('show');
      resetGame();
    };
  }

  function addHitParticles(x, y, color, count) {
    count = count || 5;
    if (particles.length > 250) return;
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
        life: 1.0, color: color || '#ffaa66', size: 2.5 + Math.random() * 3
      });
    }
  }

  // ==================== DRAW ====================
  function draw() {
    const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, '#0c121c'); bgGrad.addColorStop(0.5, '#070b12'); bgGrad.addColorStop(1, '#030507');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.fillStyle = '#aaccff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(60, 110, 180, 0.06)'; ctx.lineWidth = 1;
    for (let x = 0; x < MAP_W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke(); }
    for (let y = 0; y < MAP_H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke(); }

    ctx.strokeStyle = 'rgba(100, 160, 255, 0.3)'; ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, MAP_W, MAP_H);

    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      const grad = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      grad.addColorStop(0, '#2a3a5a'); grad.addColorStop(1, '#1a2a4a');
      ctx.fillStyle = grad; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    // Comida
    for (let i = 0; i < foodItems.length; i++) {
      const f = foodItems[i];
      const s = f.radius + Math.sin(f.pulse) * 1.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, s, 0, Math.PI * 2);
      ctx.fillStyle = f.color; ctx.shadowBlur = 12; ctx.shadowColor = f.color;
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(f.x - 2, f.y - 2, s * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    }

    // Bots tanque
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      if (b.hp <= 0) continue;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.bodyAngle);

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(2, 3, b.radius * 1.1, b.radius * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#333';
      ctx.fillRect(-b.radius, -b.radius * 0.85, b.radius * 2, b.radius * 0.5);
      ctx.fillRect(-b.radius, b.radius * 0.35, b.radius * 2, b.radius * 0.5);
      ctx.fillStyle = '#555';
      for (let j = 0; j < 4; j++) {
        ctx.fillRect(-b.radius + j * (b.radius * 0.5), -b.radius * 0.85, 3, b.radius * 0.5);
        ctx.fillRect(-b.radius + j * (b.radius * 0.5), b.radius * 0.35, 3, b.radius * 0.5);
      }

      const bodyGrad = ctx.createLinearGradient(0, -b.radius * 0.6, 0, b.radius * 0.6);
      bodyGrad.addColorStop(0, b.color);
      bodyGrad.addColorStop(1, shadeColor(b.color, -40));
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(-b.radius * 0.75, -b.radius * 0.5, b.radius * 1.5, b.radius, 4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = shadeColor(b.color, 20);
      ctx.beginPath();
      ctx.arc(0, 0, b.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.stroke();

      const localAim = b.aimAngle - b.bodyAngle;
      ctx.rotate(localAim);
      ctx.fillStyle = shadeColor(b.weapon.color, 10);
      ctx.fillRect(0, -3, b.radius * 1.3, 6);
      ctx.fillStyle = b.weapon.color;
      ctx.fillRect(b.radius * 1.2, -2, 4, 4);
      ctx.restore();

      const hpPct = b.hp / b.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(b.x - 20, b.y - b.radius - 14, 40, 5);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - 20, b.y - b.radius - 14, 40 * hpPct, 5);
    }

    // Proyectiles
    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    // Partículas
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Rayo
    if (rayEffect.active) {
      const t = rayEffect.timer / rayEffect.duration;
      const alpha = Math.min(1, t * 1.8);
      const color = rayEffect.color || '#7df9ff';
      for (let r = 0; r < rayEffect.rays.length; r++) {
        const angle = rayEffect.rays[r];
        const rayEnd = getRayEndWithWalls(player.x, player.y, angle, player.rayRange);
        ctx.save();
        ctx.globalAlpha = alpha * 0.3; ctx.strokeStyle = color;
        ctx.lineWidth = player.rayWidth * 2 * (0.5 + 0.5 * t);
        ctx.lineCap = 'round'; ctx.shadowBlur = 30; ctx.shadowColor = color;
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(rayEnd.x, rayEnd.y); ctx.stroke();
        ctx.globalAlpha = alpha; ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(1.5, player.rayWidth / 2.5 * t);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(rayEnd.x, rayEnd.y); ctx.stroke();
        ctx.restore();
      }
    }

    // Jugador (tanque)
    if (player) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.aimAngle);

      ctx.shadowColor = godMode ? '#ffdd00' : '#2ad4ff';
      ctx.shadowBlur = 25;

      ctx.fillStyle = '#1a3a5a';
      ctx.fillRect(-player.radius, -player.radius * 0.85, player.radius * 2, player.radius * 0.5);
      ctx.fillRect(-player.radius, player.radius * 0.35, player.radius * 2, player.radius * 0.5);

      const pg = ctx.createLinearGradient(0, -player.radius * 0.6, 0, player.radius * 0.6);
      pg.addColorStop(0, godMode ? '#ffcc33' : '#2b8cff');
      pg.addColorStop(1, godMode ? '#8a6a00' : '#0a2a5a');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.roundRect(-player.radius * 0.75, -player.radius * 0.5, player.radius * 1.5, player.radius, 4);
      ctx.fill();
      ctx.strokeStyle = godMode ? '#ffe680' : '#7dd4ff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = godMode ? '#ffdd00' : '#7dd4ff';
      ctx.beginPath();
      ctx.arc(0, 0, player.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1a3a6a';
      ctx.fillRect(0, -3, player.radius + 14 - player.recoil, 6);
      ctx.fillStyle = player.isCharging ? '#ffdd66' : '#7dd4ff';
      ctx.fillRect(player.radius + 10 - player.recoil, -2, 4, 4);

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    ctx.restore();

    // HUD
    if (player) {
      ctx.font = 'bold 11px "Segoe UI", monospace'; ctx.textAlign = 'center';
      const px = player.x - camera.x, py = player.y - camera.y;
      ctx.fillStyle = '#ffd966';
      ctx.fillText(player.weaponName, px, py - player.radius - 22);
    }

    // Barra XP
    const xpPct = xp / xpToNext;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(8, H - 14, W - 16, 7);
    const xg = ctx.createLinearGradient(8, 0, W - 8, 0);
    xg.addColorStop(0, '#3a8eff'); xg.addColorStop(1, '#7df9ff');
    ctx.fillStyle = xg; ctx.fillRect(8, H - 14, (W - 16) * xpPct, 7);
    ctx.strokeStyle = 'rgba(120, 180, 255, 0.4)'; ctx.lineWidth = 1; ctx.strokeRect(8, H - 14, W - 16, 7);
    ctx.font = 'bold 7px "Segoe UI", monospace'; ctx.fillStyle = '#b8d4ff';
    ctx.fillText('XP ' + xp + '/' + xpToNext, W / 2, H - 7);

    drawMinimap();
  }

  function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
  }

  function drawMinimap() {
    mctx.clearRect(0, 0, 140, 140);
    mctx.fillStyle = 'rgba(5, 10, 18, 0.85)'; mctx.fillRect(0, 0, 140, 140);
    const sx = 140 / MAP_W, sy = 140 / MAP_H;
    mctx.fillStyle = 'rgba(60, 100, 160, 0.6)';
    for (let i = 0; i < walls.length; i++) mctx.fillRect(walls[i].x * sx, walls[i].y * sy, walls[i].w * sx, walls[i].h * sy);
    mctx.fillStyle = 'rgba(255, 200, 50, 0.8)';
    for (let i = 0; i < foodItems.length; i++) mctx.fillRect(foodItems[i].x * sx - 1, foodItems[i].y * sy - 1, 2, 2);
    for (let i = 0; i < bots.length; i++) {
      if (bots[i].hp <= 0) continue;
      mctx.fillStyle = bots[i].color;
      mctx.beginPath(); mctx.arc(bots[i].x * sx, bots[i].y * sy, 2.5, 0, Math.PI * 2); mctx.fill();
    }
    if (player) {
      mctx.fillStyle = '#4df0ff';
      mctx.beginPath(); mctx.arc(player.x * sx, player.y * sy, 2.5, 0, Math.PI * 2); mctx.fill();
    }
    mctx.strokeStyle = 'rgba(100, 180, 255, 0.4)'; mctx.lineWidth = 1; mctx.strokeRect(0, 0, 140, 140);
  }

    setTimeout(function() {
      const total = chest.drops.reduce(function(s, d) { return s + d.weight; }, 0);

      let drop = chest.drops[0];
      for (let i = 0; i < chest.drops.length; i++) {
        roll -= chest.drops[i].weight;
        if (roll <= 0) { drop = chest.drops[i]; break; }

      let html = '';

        gems += drop.amount;

      } else if (drop.type === 'tank') {

          html = '<div class="big-icon">' + t.icon + '</div><div class="reward-display">¡' + t.name + '!</div><div class="reward-sub">' + t.rarity.toUpperCase() + ' · ' + t.weaponName + '</div>';

  // ==================== JOYSTICKS ====================
  function setupJoystick(zone, knob, onMove, onEnd) {
    let active = false, startX = 0, startY = 0;
    const maxDist = 35;
    zone.addEventListener('touchstart', function(e) {
      e.preventDefault(); active = true;
      const t = e.touches[0];
      const r = zone.getBoundingClientRect();
      startX = r.left + r.width / 2;
      startY = r.top + r.height / 2;
      handleMove(t.clientX, t.clientY);
    }, { passive: false });
    zone.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!active) return;
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    zone.addEventListener('touchend', function(e) {
      e.preventDefault(); active = false;
      knob.style.transform = 'translate(-50%, -50%)';
      onEnd();
    }, { passive: false });
    zone.addEventListener('touchcancel', function() {
      active = false;
      knob.style.transform = 'translate(-50%, -50%)';
      onEnd();
    }, { passive: false });
    function handleMove(cx, cy) {
      let dx = cx - startX, dy = cy - startY;
      const d = Math.hypot(dx, dy);
      if (d > maxDist) { dx = (dx / d) * maxDist; dy = (dy / d) * maxDist; }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      onMove(dx, dy);
    }
  }

  setupJoystick(joystickLeft, knobLeft, function(dx, dy) {
    const dz = 10;
    keys.a = dx < -dz; keys.d = dx > dz;
    keys.w = dy < -dz; keys.s = dy > dz;
  }, function() {
    keys.a = keys.d = keys.w = keys.s = false;
  });

  setupJoystick(joystickRight, knobRight, function(dx, dy) {
    if (Math.hypot(dx, dy) > 10) {
      joystickRightActive = true;
      aimAngleJoy = Math.atan2(dy, dx);
    }
  }, function() {
    joystickRightActive = false;
  });

    adminBonuses.pierce += parseInt(document.getElementById('admPierce').value) || 1;
    const newP = createPlayer();
    newP.x = player.x; newP.y = player.y; newP.hp = Math.min(player.hp, newP.maxHp);
    player = newP;
    showToast('🗡️ +' + document.getElementById('admPierce').value + ' perforación');
    updateUI(); saveGame();
  });

  document.getElementById('admLevelUp').addEventListener('click', function() {
    level++; xp = 0; gems += 20; updateUI(); showToast('⭐ Nivel ' + level);
    Object.keys(TANKS).forEach(function(k) {
      const t = TANKS[k];
      if (!t.adminOnly && t.levelReq > 0 && t.levelReq <= level && !ownedTanks[k]) {
        ownedTanks[k] = true;
      }
    });
    checkTankEvolution();
    saveGame();
  });
  document.getElementById('admAddGems').addEventListener('click', function() { gems += 100; updateUI(); showToast('💎 +100'); saveGame(); });
  document.getElementById('admUnlockAll').addEventListener('click', function() {
    Object.keys(TANKS).forEach(function(k) { ownedTanks[k] = true; });
    showToast('🔓 Todo desbloqueado'); saveGame();
  });
  document.getElementById('admGodMode').addEventListener('click', function() {
    godMode = !godMode;
    this.style.background = godMode ? '#4a3a0a' : '#2a1a1a';
    this.textContent = godMode ? '🛡️ Dios: ON' : '🛡️ Modo Dios';
  });
  document.getElementById('admReset').addEventListener('click', function() { resetGame(); });

  // ==================== BUCLE ====================
  let lastTime = 0;
  const FRAME_INTERVAL = 1000 / 60;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!ts) ts = performance.now();
    const delta = ts - lastTime;
    if (delta < FRAME_INTERVAL - 1) return;
    lastTime = ts - (delta % FRAME_INTERVAL);
    update();
    draw();
  }

  // ==================== INIT ====================
  const save = loadSave();
  if (save) {
    gems = save.gems || 0;
    ownedTanks = save.ownedTanks || { base: true };
    adminUnlocked = save.adminUnlocked || false;
    currentTankKey = save.currentTankKey || 'base';
    currentMode = save.currentMode || 'survival';
    bestLevel = save.bestLevel || 1;
    totalKills = save.totalKills || 0;
    if (save.upgrades) Object.keys(save.upgrades).forEach(function(k) { if (upgrades[k] !== undefined) upgrades[k] = save.upgrades[k]; });
    if (save.adminBonuses) Object.keys(save.adminBonuses).forEach(function(k) { if (adminBonuses[k] !== undefined) adminBonuses[k] = save.adminBonuses[k]; });
    ownedTanks.base = true;
    showToast('💾 Partida cargada');
  }

  resizeCanvas();
  initStars();
  resetGame();
  renderUpgrades();
  requestAnimationFrame(loop);
  window.addEventListener('beforeunload', saveGame);
  setInterval(saveGame, 30000);
};
</script>
</body>
</html>
